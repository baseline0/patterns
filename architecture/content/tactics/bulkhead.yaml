id: bulkhead
name: Bulkhead
summary: Partition capacity into isolated pools so a failure or traffic surge in one area cannot consume all resources and starve unrelated work.
decision: Allocate separate thread pools, connection pools, queues, or compute quotas per workload and cap each pool so one caller cannot exhaust the whole system.
mechanism: Assign each dependency or request class its own bounded resource pool with a fixed size and queue, and reject or shed load locally when that pool is full.
failure_modes:
  - Pools sized so generously that an overload still exhausts the shared host.
  - Too many small pools wasting capacity that could be shared.
  - Forgetting to isolate the connection pool while isolating threads.
  - No backpressure, so an unbounded queue grows until memory is exhausted.
use_when:
  - Multiple tenants or workloads share one process or cluster.
  - A slow dependency must not block unrelated requests.
  - Blast radius must be bounded for availability targets.
avoid_when:
  - The system has a single workload with uniform priority.
  - Resource overhead of many pools exceeds the available budget.
  - Work cannot be classified before resources are assigned.
tradeoffs:
  - benefit: A stuck dependency is contained, keeping other request classes available.
    cost: Static partitions waste idle capacity that another pool could use.
  - benefit: Bounded queues give predictable memory use and p95 latency under load.
    cost: Requests beyond a pool cap are rejected and need explicit fallback handling.
quality_impacts:
  - attribute: availability
    effect: improves
    note: Isolated pools keep critical paths serving traffic when a noncritical path saturates, protecting the availability percentage.
  - attribute: performance
    effect: improves
    note: Bounded queues prevent unbounded waits and keep p95 latency predictable during bursts.
  - attribute: security
    effect: improves
    note: Per-tenant quotas limit how much capacity one noisy or hostile client can consume.
related_patterns:
  - circuit-breaker
  - queue-based-load-leveling
  - microservices
  - proxy
  - 05-3tier-web
  - 09-microservices
scenarios:
  - 05-3tier-web
  - 09-microservices
quiz:
  - question: What does a bulkhead primarily protect?
    choices:
      - Data encryption at rest
      - Capacity for unrelated workloads from one failing path
      - The exact ordering of every message
      - The source code from bugs
    answer: 1
    explanation: Bulkheads isolate resource pools so one overloaded path cannot consume all capacity.
  - question: Why should bulkhead queues be bounded?
    choices:
      - Unbounded queues grow until memory runs out and latency spikes.
      - Bounded queues remove the need for timeouts.
      - Bounded queues make retries unnecessary.
      - Unbounded queues improve p95 latency.
    answer: 0
    explanation: Without a cap, queued work consumes memory and turns overload into a crash instead of a clean rejection.
