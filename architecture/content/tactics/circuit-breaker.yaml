quiz:
  - question: What does a half-open circuit breaker do?
    choices:
      - Rejects every call permanently
      - Allows a limited probe to test recovery
      - Increases the timeout on every call
      - Retries indefinitely until success
    answer: 1
    explanation: A half-open state permits a small number of probe requests so the breaker can close only after real recovery.
  - question: Which condition should count toward opening a breaker?
    choices:
      - A malformed request rejected by input validation
      - Repeated timeouts from the remote dependency
      - A user choosing to cancel a request
      - A successful cache hit
    answer: 1
    explanation: Breakers should track dependency faults such as timeouts, not deterministic application-level rejections.
