quiz:
  - question: Which signal best supports on-call alerting?
    choices:
      - CPU usage on one host
      - A symptom-based service level indicator tied to user impact
      - The number of lines of code deployed
      - The count of log files on disk
    answer: 1
    explanation: Symptom-based indicators reflect what users experience and reduce false alarms from harmless internal noise.
  - question: What is the main privacy risk of observability data?
    choices:
      - Traces are always encrypted by default.
      - Logs may capture tokens or personal data if fields are not scrubbed.
      - Metrics cannot store numeric values.
      - Correlation identifiers expose source code.
    answer: 1
    explanation: Broad instrumentation can accidentally record secrets or personal data, so scrubbing must be explicit.
