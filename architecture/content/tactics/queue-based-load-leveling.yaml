quiz:
  - question: What signal should drive worker autoscaling in load leveling?
    choices:
      - The number of code files in the worker
      - Backlog depth and message age
      - The colour of the dashboard
      - The total number of producers ever seen
    answer: 1
    explanation: Backlog depth and age show real pending work, so scaling on them drains the queue within target time.
  - question: Why must the queue be bounded or paired with load shedding?
    choices:
      - Bounded queues improve encryption strength.
      - An unbounded queue can grow until storage or memory fails.
      - Bounded queues remove the need for workers.
      - Unbounded queues guarantee faster processing.
    answer: 1
    explanation: Without a cap or shedding policy, sustained overload turns a buffer into an outage.
