scenarios:
  - 01-static-website
  - 05-3tier-web
quiz:
  - question: In cache aside, what is the source of truth?
    choices:
      - The cache, until it expires
      - The application's local memory
      - The underlying datastore
      - The client browser
    answer: 2
    explanation: The datastore remains authoritative; the cache is a disposable optimization populated on a miss.
  - question: What is the most common correctness bug with cache aside?
    choices:
      - Caching values that are read more than once
      - Failing to invalidate a key after its source data changes
      - Setting a time to live on cached entries
      - Using a hit counter on the cache
    answer: 1
    explanation: A missed invalidation leaves a stale value in the cache until expiry, producing incorrect reads.
