quiz:
  - question: Why should exponential backoff include jitter?
    choices:
      - To make each retry succeed on the first attempt.
      - To prevent many clients from retrying at the same instant.
      - To remove the need for a maximum attempt count.
      - To turn permanent errors into transient ones.
    answer: 1
    explanation: Random jitter desynchronizes clients so a recovering dependency is not hit by a synchronized retry storm.
  - question: Which failure should not be retried?
    choices:
      - A brief connection reset
      - A gateway timeout
      - A validation error caused by malformed input
      - A transient socket error
    answer: 2
    explanation: A validation error is deterministic, so repeating it only wastes capacity and adds latency.
