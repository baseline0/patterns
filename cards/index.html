glossary.json"}}, {"id": "fd328ad4138e", "title": "Complexity: dict[key] = value", "body": "**O(1) average**\n\namortized, including the occasional resize", "metadata": {"tags": ["hash-tables", "complexity"], "source": "data-structures/hash-tables/glossary.json"}}, {"id": "a26a1313faed", "title": "Complexity: set add / remove / in", "body": "**O(1) average**\n\na dict with no values", "metadata": {"tags": ["hash-tables", "complexity"], "source": "data-structures/hash-tables/glossary.json"}}, {"id": "3b1a83252629", "title": "Complexity: list membership (x in list)", "body": "**O(n)**\n\nfor comparison: a linear scan", "metadata": {"tags": ["hash-tables", "complexity"], "source": "data-structures/hash-tables/glossary.json"}}, {"id": "5206230edbb7", "title": "Q1: Why can a tuple be a dict key but a list cannot?", "body": "A. Tuples are faster to hash\nB. A tuple is immutable, so its hash cannot change; a list is mutable and not hashable\nC. Lists are too large to store\nD. Dicts only accept strings and tuples\n\n**B.** A key's hash must stay fixed while the key is stored. Only immutable values can guarantee that.", "metadata": {"tags": ["hash-tables", "question"], "source": "data-structures/hash-tables/glossary.json"}}, {"id": "89327eeb3051", "title": "Q2: On average, what does membership testing cost in a set of n ", "body": "A. O(1)\nB. O(log n)\nC. O(n)\nD. O(n log n)\n\n**A.** The hash picks a slot directly. Only collisions add probes, and those are rare.", "metadata": {"tags": ["hash-tables", "question"], "source": "data-structures/hash-tables/glossary.json"}}, {"id": "6f5f2f3da40f", "title": "Q3: Since Python 3.7, what does iterating over a dict return?", "body": "A. Keys in sorted order\nB. Keys in insertion order\nC. Keys in random order\nD. Keys in order of their hash\n\n**B.** Insertion order is a language guarantee, because entries are stored in a dense array in that order.", "metadata": {"tags": ["hash-tables", "question"], "source": "data-structures/hash-tables/glossary.json"}}, {"id": "05cd3154426e", "title": "Q4: Why is the 'group anagrams' problem a fit for defaultdict(li", "body": "A. It sorts the words automatically\nB. Each new key gets an empty list on first use, so grouping needs no existence check\nC. It removes duplicate words\nD. It keeps the groups sorted\n\n**B.** defaultdict creates the missing list on access, so each word appends to its group in one step.", "metadata": {"tags": ["hash-tables", "question"], "source": "data-structures/hash-tables/glossary.json"}}, {"id": "6c52e584010b", "title": "LeetCode 1: Two Sum", "body": "**Pattern**: complement lookup\n\n**Why**: Looking up target minus the current value is O(1), so one pass finds the pair.\n\n**Python**: `dict: store each value's index, check for the complement`", "metadata": {"tags": ["hash-tables", "problem"], "source": "data-structures/hash-tables/glossary.json"}}, {"id": "7880f03f701c", "title": "LeetCode 49: Group Anagrams", "body": "**Pattern**: group by a canonical key\n\n**Why**: Anagrams share a key, so each word joins its group with one lookup.\n\n**Python**: `collections.defaultdict(list), keyed by the sorted letters`", "metadata": {"tags": ["hash-tables", "problem"], "source": "data-structures/hash-tables/glossary.json"}}, {"id": "dad845b06c7b", "title": "LeetCode 128: Longest Consecutive Sequence", "body": "**Pattern**: start only at the beginning of a run\n\n**Why**: Checking a value's neighbours is O(1), and only run starts need extending, so the total stays O(n).\n\n**Python**: `set: membership checks`", "metadata": {"tags": ["hash-tables", "problem"], "source": "data-structures/hash-tables/glossary.json"}}, {"id": "35052f987786", "title": "Signal: Has this value been seen before, in one pass", "body": "**Structure**: hash set\n\n**Requirement**: O(1) per check\n\n**Python**: `set`\n\n**Example**: Two Sum (LeetCode 1): a dict of values already seen", "metadata": {"tags": ["hash-tables", "signal"], "source": "data-structures/hash-tables/glossary.json"}}, {"id": "4227e4074a12", "title": "Signal: Group items that share a computed key", "body": "**Structure**: hash table of lists\n\n**Requirement**: O(1) per item to find its group\n\n**Python**: `collections.defaultdict(list)`\n\n**Example**: Group Anagrams (LeetCode 49)", "metadata": {"tags": ["hash-tables", "signal"], "source": "data-structures/hash-tables/glossary.json"}}, {"id": "62efa6851d62", "title": "Signal: Find the longest run of consecutive values without sorting", "body": "**Structure**: hash set\n\n**Requirement**: O(n) total, each value checked in O(1)\n\n**Python**: `set`\n\n**Example**: Longest Consecutive Sequence (LeetCode 128)", "metadata": {"tags": ["hash-tables", "signal"], "source": "data-structures/hash-tables/glossary.json"}}, {"id": "02fcb05c59eb", "title": "Claim: heap-root-is-minimum", "body": "After heapq.heapify, the first element of the plain list is the minimum.", "metadata": {"tags": ["heaps", "claim"], "source": "data-structures/heaps/glossary.json"}}, {"id": "3989937a3b9e", "title": "Claim: heappop-yields-sorted-order", "body": "Repeated heappop returns the elements in ascending order.", "metadata": {"tags": ["heaps", "claim"], "source": "data-structures/heaps/glossary.json"}}, {"id": "75cd4388acef", "title": "Claim: heapify-is-linear", "body": "heapify on n items costs about n, not n log n: doubling n roughly doubles the time, not more.", "metadata": {"tags": ["heaps", "claim"], "source": "data-structures/heaps/glossary.json"}}, {"id": "1d9a9eaae161", "title": "Claim: nlargest-beats-a-full-sort-for-small-k", "body": "heapq.nlargest(k, data) for small k is faster than sorting all of data and slicing.", "metadata": {"tags": ["heaps", "claim"], "source": "data-structures/heaps/glossary.json"}}, {"id": "30dfcdbb9e68", "title": "Complexity: heap[0] (peek minimum)", "body": "**O(1)**\n\nthe minimum is always at index 0", "metadata": {"tags": ["heaps", "complexity"], "source": "data-structures/heaps/glossary.json"}}, {"id": "99d7c0707a9a", "title": "Complexity: heapq.heappush", "body": "**O(log n)**\n\nsift up at most log n levels", "metadata": {"tags": ["heaps", "complexity"], "source": "data-structures/heaps/glossary.json"}}, {"id": "434d3364257e", "title": "Complexity: heapq.heappop", "body": "**O(log n)**\n\nmove the last item to the root, sift down", "metadata": {"tags": ["heaps", "complexity"], "source": "data-structures/heaps/glossary.json"}}, {"id": "c50191d53ce9", "title": "Complexity: heapq.heapify", "body": "**O(n)**\n\nbottom-up, in place", "metadata": {"tags": ["heaps", "complexity"], "source": "data-structures/heaps/glossary.json"}}, {"id": "f54d09bd8f0b", "title": "Complexity: heapq.nlargest(k, data)", "body": "**O(n log k)**\n\nkeeps a heap of size k while scanning", "metadata": {"tags": ["heaps", "complexity"], "source": "data-structures/heaps/glossary.json"}}, {"id": "f3582d6e8c02", "title": "Q1: Why does heapq store a heap in a plain list?", "body": "A. Lists are the only mutable sequence in Python\nB. The children of index i are at 2i+1 and 2i+2, so no node objects are needed\nC. heapq only works on tuples\nD. A heap is faster to store as a list because it stays sorted\n\n**B.** The array layout gives the tree's parent and child positions by arithmetic, with no pointers to manage.", "metadata": {"tags": ["heaps", "question"], "source": "data-structures/heaps/glossary.json"}}, {"id": "8689f4fec07f", "title": "Q2: What is the cost of heapq.heappop on a heap of n items?", "body": "A. O(1)\nB. O(log n)\nC. O(n)\nD. O(n log n)\n\n**B.** The last item moves to the root and sifts down at most one path, about log n levels.", "metadata": {"tags": ["heaps", "question"], "source": "data-structures/heaps/glossary.json"}}, {"id": "b2b9bb4b5f3d", "title": "Q3: heapq is a min-heap. How do you get the largest value first?", "body": "A. Call heapq.heappop(max=True)\nB. Push the negated values and pop the smallest\nC. Sort the list first\nD. Use a deque instead\n\n**B.** The most negative number is the one with the largest magnitude, so negating turns max into min.", "metadata": {"tags": ["heaps", "question"], "source": "data-structures/heaps/glossary.json"}}, {"id": "76d2dbd98523", "title": "Q4: Why is building a heap from a list with heapify faster than ", "body": "A. heapify skips the comparisons\nB. heapify is O(n) bottom-up, while n pushes cost O(n log n) in total\nC. heappush cannot be used on lists\nD. heapify sorts the list first\n\n**B.** Sifting down from the middle does less total work than sifting up each item as it arrives.", "metadata": {"tags": ["heaps", "question"], "source": "data-structures/heaps/glossary.json"}}, {"id": "99f1b64ff782", "title": "LeetCode 347: Top K Frequent Elements", "body": "**Pattern**: top-k selection\n\n**Why**: Only the k most frequent matter, so a heap of size k beats sorting every distinct value.\n\n**Python**: `collections.Counter, then heapq.nlargest`", "metadata": {"tags": ["heaps", "problem"], "source": "data-structures/heaps/glossary.json"}}, {"id": "a46a622d2544", "title": "LeetCode 215: Kth Largest Element in an Array", "body": "**Pattern**: top-k selection\n\n**Why**: A min-heap of the k largest seen so far keeps its root as the answer.\n\n**Python**: `heapq: heappush, and heappop when the heap grows past k`", "metadata": {"tags": ["heaps", "problem"], "source": "data-structures/heaps/glossary.json"}}, {"id": "f71650ee3a90", "title": "LeetCode 23: Merge k Sorted Lists", "body": "**Pattern**: k-way merge\n\n**Why**: One head per list in the heap gives the next smallest value across all lists in O(log k).\n\n**Python**: `heapq.heappush / heappop, or heapq.merge`", "metadata": {"tags": ["heaps", "problem"], "source": "data-structures/heaps/glossary.json"}}, {"id": "c21e67d5a778", "title": "Signal: Find the k largest or smallest elements in a stream or a lar", "body": "**Structure**: binary heap of size k\n\n**Requirement**: O(n log k), with only k items held\n\n**Python**: `heapq (heappush / heappop) or heapq.nlargest`\n\n**Example**: Top K Frequent Elements (LeetCode 347)", "metadata": {"tags": ["heaps", "signal"], "source": "data-structures/heaps/glossary.json"}}, {"id": "e6ba39aef4e6", "title": "Signal: Repeatedly take the two smallest and combine them", "body": "**Structure**: binary heap\n\n**Requirement**: O(log n) per step, the smallest always available\n\n**Python**: `heapq`\n\n**Example**: Minimum Cost to Connect Sticks (LeetCode 1167)", "metadata": {"tags": ["heaps", "signal"], "source": "data-structures/heaps/glossary.json"}}, {"id": "28463060acb2", "title": "Signal: Merge several sorted sequences in order", "body": "**Structure**: heap of one head per source\n\n**Requirement**: O(N log k) for N items from k sources\n\n**Python**: `heapq.merge`\n\n**Example**: Merge k Sorted Lists (LeetCode 23)", "metadata": {"tags": ["heaps", "signal"], "source": "data-structures/heaps/glossary.json"}}, {"id": "aaaa57ef8fd0", "title": "Claim: linked-list-no-random-access", "body": "A linked list requires O(n) steps to reach a position, so binary search is impossible without modifying the structure.", "metadata": {"tags": ["linked-lists", "claim"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "d823e11fdef1", "title": "Claim: linked-list-insert-delete-constant", "body": "Insertion and deletion at a known node (with a pointer to it) cost O(1), because no shifting is required.", "metadata": {"tags": ["linked-lists", "claim"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "969a7b529b37", "title": "Claim: reversal-redirects-pointers-inplace", "body": "Reversing a linked list in-place by redirecting pointers uses O(1) extra space and O(n) time.", "metadata": {"tags": ["linked-lists", "claim"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "a9b54f7d74b2", "title": "Claim: cycle-detection-two-pointers", "body": "A cycle in a linked list can be detected by advancing two pointers at different speeds; if they meet, a cycle exists.", "metadata": {"tags": ["linked-lists", "claim"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "16b21bc0d1a1", "title": "Claim: dummy-node-simplifies-head-cases", "body": "A dummy node pointing to the head eliminates special cases when modifying the head node.", "metadata": {"tags": ["linked-lists", "claim"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "8b6867547df0", "title": "Complexity: Traverse the list (find a node)", "body": "**O(n)**\n\nmust follow pointers from the head", "metadata": {"tags": ["linked-lists", "complexity"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "82c7bd82cc2a", "title": "Complexity: Insert at a known position (with a pointer to the previous node)", "body": "**O(1)**\n\nredirect two pointers, no shifting", "metadata": {"tags": ["linked-lists", "complexity"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "23fa4ee202d2", "title": "Complexity: Delete at a known position (with a pointer to the previous node)", "body": "**O(1)**\n\nredirect one pointer, no shifting", "metadata": {"tags": ["linked-lists", "complexity"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "02abed056150", "title": "Complexity: Reverse the entire list", "body": "**O(n)**\n\none pass, redirecting pointers; O(1) extra space", "metadata": {"tags": ["linked-lists", "complexity"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "3fea30c9c16f", "title": "Complexity: Detect a cycle", "body": "**O(n)**\n\nfast and slow pointers; they meet if a cycle exists", "metadata": {"tags": ["linked-lists", "complexity"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "ba61667a5490", "title": "Complexity: Merge two sorted lists", "body": "**O(n + m)**\n\ncompare nodes from both lists, advance the smaller", "metadata": {"tags": ["linked-lists", "complexity"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "8102a426b2f1", "title": "Complexity: Merge k sorted lists (naive)", "body": "**O(n * k^2)**\n\nmerge pairwise; improve with a heap or merge sort strategy", "metadata": {"tags": ["linked-lists", "complexity"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "3c2fe44ecd7e", "title": "Q1: Why is reversal a natural fit for linked lists?", "body": "A. Linked lists are smaller than arrays\nB. Pointers can be redirected in-place without allocating new nodes, using O(1) extra space\nC. Reversing arrays requires copying the entire array\nD. Linked lists are always bidirectional\n\n**B.** Reversing a linked list changes the direction of pointers, not the nodes themselves. This in-place redirection uses constant extra space.", "metadata": {"tags": ["linked-lists", "question"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "4d830726aaff", "title": "Q2: How does the two-pointer cycle detection algorithm work?", "body": "A. Mark visited nodes with a flag\nB. Use a set to track seen nodes\nC. Advance two pointers at different speeds; they meet if a cycle exists\nD. Count nodes and check if the count exceeds the list length\n\n**C.** A fast pointer (2 steps per iteration) and a slow pointer (1 step) eventually meet if a cycle exists. If the fast pointer reaches null, there is no cycle.", "metadata": {"tags": ["linked-lists", "question"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "1c558da1c3fa", "title": "Q3: Why is a dummy node useful when merging linked lists?", "body": "A. It makes the list shorter\nB. It holds the smaller of the two heads\nC. It eliminates special cases at the head by providing a node to attach to initially\nD. It is required by the algorithm\n\n**C.** A dummy node lets the merge code treat the head uniformly. Instead of checking 'is this the first node?', the code always attaches to the previous node.", "metadata": {"tags": ["linked-lists", "question"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "bd012f483f7a", "title": "Q4: In the 'Merge K Sorted Lists' problem, why is a heap faster ", "body": "A. Heaps use less memory\nB. Heaps sort the lists automatically\nC. Finding the next smallest among k lists is O(log k) with a heap instead of O(k) with linear search\nD. Heaps eliminate the need for pointers\n\n**C.** A heap tracks the smallest head across k lists. Inserting and extracting takes O(log k) per step, making the total time O(n log k) instead of O(n * k).", "metadata": {"tags": ["linked-lists", "question"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "33c9d0ff7641", "title": "Q5: What is the time complexity of traversing a linked list to f", "body": "A. O(1)\nB. O(log n)\nC. O(n)\nD. O(n log n)\n\n**C.** A linked list has no random access. Reaching a node requires following pointers from the head, which takes O(n) in the worst case.", "metadata": {"tags": ["linked-lists", "question"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "86dc2518bade", "title": "LeetCode 206: Reverse Linked List", "body": "**Pattern**: iterative pointer reversal\n\n**Why**: Reversing requires redirecting each node's pointer from forward to backward. Tracking three pointers (prev, curr, next) allows safe redirection in one pass.\n\n**Python**: `manual pointer management; track previous, current, next`", "metadata": {"tags": ["linked-lists", "problem"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "4f65e65a32ff", "title": "LeetCode 141: Linked List Cycle", "body": "**Pattern**: tortoise and hare\n\n**Why**: If a cycle exists, two pointers at different speeds must meet. If the fast pointer reaches null, there is no cycle.\n\n**Python**: `two pointer variables advancing at different speeds`", "metadata": {"tags": ["linked-lists", "problem"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "7302346dc79c", "title": "LeetCode 21: Merge Two Sorted Lists", "body": "**Pattern**: two-pointer list merging\n\n**Why**: Merging compares heads and advances the smaller pointer. A dummy node avoids special-casing the new head.\n\n**Python**: `dummy node, manual pointer chaining`", "metadata": {"tags": ["linked-lists", "problem"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "c77cd8e0c0b3", "title": "LeetCode 23: Merge K Sorted Lists", "body": "**Pattern**: reduce k lists to 1 via pairwise merging\n\n**Why**: Naive pairwise merging is slow; a heap picks the next smallest in O(log k) time, making total time O(n log k).\n\n**Python**: `heapq.heappush for efficient next-smallest, or recursion`", "metadata": {"tags": ["linked-lists", "problem"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "429ed554e8ac", "title": "LeetCode 92: Reverse Linked List II", "body": "**Pattern**: bounded reversal\n\n**Why**: Reversing only a section requires finding the start, reversing in place, then connecting back. Careful pointer tracking avoids breaking the chain.\n\n**Python**: `manual pointer management; track boundaries`", "metadata": {"tags": ["linked-lists", "problem"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "67059d3b1e3d", "title": "LeetCode 2: Add Two Numbers", "body": "**Pattern**: digit-by-digit addition\n\n**Why**: Addition processes digits in parallel, managing carry state. New nodes are created for the result; careful pointer management avoids leaks.\n\n**Python**: `manual pointer advancement, node creation`", "metadata": {"tags": ["linked-lists", "problem"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "29aa810c8297", "title": "LeetCode 160: Intersection of Two Linked Lists", "body": "**Pattern**: length-adjusted pointers\n\n**Why**: If two lists intersect, advancing through both at equal speed detects the intersection. Equal-length traversal aligns the pointers.\n\n**Python**: `manual pointer advancement; two passes to align`", "metadata": {"tags": ["linked-lists", "problem"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "a713afb31492", "title": "Signal: Reverse a sequence when you cannot use an array", "body": "**Structure**: pointer redirection in a single pass\n\n**Requirement**: Change direction in-place; O(n) time\n\n**Python**: `manual pointer management`\n\n**Example**: Reverse Linked List (LeetCode 206)", "metadata": {"tags": ["linked-lists", "signal"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "9742f391a909", "title": "Signal: Detect or break a cycle in a chain", "body": "**Structure**: two-pointer race: fast and slow\n\n**Requirement**: Identify loops without extra space or mutation\n\n**Python**: `two pointer variables`\n\n**Example**: Linked List Cycle (LeetCode 141)", "metadata": {"tags": ["linked-lists", "signal"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "13ebebf120da", "title": "Signal: Merge multiple sequences while maintaining order", "body": "**Structure**: pointer manipulation with a dummy node\n\n**Requirement**: Compare heads, advance the smaller, O(n + m) for two lists\n\n**Python**: `manual pointer chaining`\n\n**Example**: Merge Two Sorted Lists (LeetCode 21)", "metadata": {"tags": ["linked-lists", "signal"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "8921acfdee14", "title": "Signal: Find the middle of a list or reverse a section", "body": "**Structure**: two pointers: one moves 2 steps, one moves 1\n\n**Requirement**: Locate a position without knowing the length\n\n**Python**: `two pointer variables; count or fast/slow`\n\n**Example**: Reverse Linked List II (LeetCode 92)", "metadata": {"tags": ["linked-lists", "signal"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "2a5b7a5ea836", "title": "Signal: Simulate addition with numbers stored as linked list nodes", "body": "**Structure**: traverse both lists in parallel, manage carry state\n\n**Requirement**: Process digit by digit with carry; may need to extend the list\n\n**Python**: `manual pointer advancement and node creation`\n\n**Example**: Add Two Numbers (LeetCode 2)", "metadata": {"tags": ["linked-lists", "signal"], "source": "data-structures/linked-lists/glossary.json"}}, {"id": "7258ae2026a0", "title": "Claim: list-append-is-amortized-constant", "body": "List growth is geometric: capacity grows by a bounded fraction each time it is exceeded, so appends stay O(1) amortized.", "metadata": {"tags": ["lists-and-deques", "claim"], "source": "data-structures/lists-and-deques/glossary.json"}}, {"id": "9cf88b5673c2", "title": "Claim: list-pop-zero-scales-linearly", "body": "list.pop(0) cost grows with the list length, because every remaining pointer shifts.", "metadata": {"tags": ["lists-and-deques", "claim"], "source": "data-structures/lists-and-deques/glossary.json"}}, {"id": "b5b1b019c7e3", "title": "Claim: deque-popleft-is-constant", "body": "deque.popleft cost does not grow with the deque length.", "metadata": {"tags": ["lists-and-deques", "claim"], "source": "data-structures/lists-and-deques/glossary.json"}}, {"id": "69a6feb47ed8", "title": "Claim: insort-shift-is-linear", "body": "bisect.insort is a binary search plus a list shift, so insertion at the front is linear; the search alone is logarithmic.", "metadata": {"tags": ["lists-and-deques", "claim"], "source": "data-structures/lists-and-deques/glossary.json"}}, {"id": "8364307faf60", "title": "Complexity: list.append", "body": "**O(1) amortized**\n\ngeometric growth of spare capacity", "metadata": {"tags": ["lists-and-deques", "complexity"], "source": "data-structures/lists-and-deques/glossary.json"}}, {"id": "b67ae225fa9c", "title": "Complexity: list.pop()  (end)", "body": "**O(1)**\n\n", "metadata": {"tags": ["lists-and-deques", "complexity"], "source": "data-structures/lists-and-deques/glossary.json"}}, {"id": "f85719dadcb8", "title": "Complexity: list.pop(0) / insert(0, x)", "body": "**O(n)**\n\nevery pointer shifts", "metadata": {"tags": ["lists-and-deques", "complexity"], "source": "data-structures/lists-and-deques/glossary.json"}}, {"id": "a0160c30b4f2", "title": "Complexity: list[i]", "body": "**O(1)**\n\ndirect offset into the array", "metadata": {"tags": ["lists-and-deques", "complexity"], "source": "data-structures/lists-and-deques/glossary.json"}}, {"id": "1d6cb40f38b4", "title": "Complexity: deque.appendleft / popleft", "body": "**O(1)**\n\ntouches only the end block", "metadata": {"tags": ["lists-and-deques", "complexity"], "source": "data-structures/lists-and-deques/glossary.json"}}, {"id": "3a64bc0af84f", "title": "Complexity: deque[i] (middle)", "body": "**O(n)**\n\nwalks blocks; not constant", "metadata": {"tags": ["lists-and-deques", "complexity"], "source": "data-structures/lists-and-deques/glossary.json"}}, {"id": "eae232188f6d", "title": "Complexity: bisect.bisect_left (search)", "body": "**O(log n)**\n\non a sorted list", "metadata": {"tags": ["lists-and-deques", "complexity"], "source": "data-structures/lists-and-deques/glossary.json"}}, {"id": "aff4460d1731", "title": "Complexity: bisect.insort (insert)", "body": "**O(n)**\n\nthe search is O(log n); the shift is linear", "metadata": {"tags": ["lists-and-deques", "complexity"], "source": "data-structures/lists-and-deques/glossary.json"}}, {"id": "e353fe53dd39", "title": "Q1: Why is list.pop(0) a poor choice for a BFS queue?", "body": "A. It allocates a new list every time\nB. It shifts every remaining pointer, so each pop costs O(n)\nC. It is not allowed on lists\nD. It is only slow for strings\n\n**B.** A list is a contiguous array. Removing the first element moves each remaining pointer one slot left.", "metadata": {"tags": ["lists-and-deques", "question"], "source": "data-structures/lists-and-deques/glossary.json"}}, {"id": "829f45c827cb", "title": "Q2: Which structure is the right queue for BFS in Python?", "body": "A. list with pop(0)\nB. collections.deque with popleft\nC. dict with the smallest key\nD. set with pop()\n\n**B.** deque.popleft is O(1), because it touches only the block at the front.", "metadata": {"tags": ["lists-and-deques", "question"], "source": "data-structures/lists-and-deques/glossary.json"}}, {"id": "1e864cc92f61", "title": "Q3: Why are appends to a list amortized O(1)?", "body": "A. Each append reserves exactly one slot\nB. Capacity grows by a fraction each time it is exceeded, so copies are rare\nC. Appends never copy\nD. CPython stores lists as linked nodes\n\n**B.** Spare capacity grows geometrically, so the cost of the occasional copy spreads across many appends.", "metadata": {"tags": ["lists-and-deques", "question"], "source": "data-structures/lists-and-deques/glossary.json"}}, {"id": "16a9b9bb93cc", "title": "Q4: bisect.insort on a sorted list is O(log n) per insert. True ", "body": "A. True: the binary search dominates\nB. False: the search is O(log n) but the list shift makes insertion O(n)\n\n**B.** Finding the position is logarithmic. Inserting the value shifts the elements after it.", "metadata": {"tags": ["lists-and-deques", "question"], "source": "data-structures/lists-and-deques/glossary.json"}}, {"id": "8a5903e41818", "title": "Q5: Why can a list not be a dict key?", "body": "A. Lists are too large\nB. Lists are not hashable: their contents can change, so their hash would change too\nC. Dict keys must be strings\nD. Lists are stored out of order\n\n**B.** A key's hash must stay constant while it is in the table. A mutable list cannot guarantee that.", "metadata": {"tags": ["lists-and-deques", "question"], "source": "data-structures/lists-and-deques/glossary.json"}}, {"id": "0928bcc85a78", "title": "LeetCode 102: Binary Tree Level Order Traversal", "body": "**Pattern**: breadth-first search\n\n**Why**: The frontier is a FIFO queue. list.pop(0) would shift the whole frontier on every step.\n\n**Python**: `collections.deque: append and popleft`", "metadata": {"tags": ["lists-and-deques", "problem"], "source": "data-structures/lists-and-deques/glossary.json"}}, {"id": "a7b587c1fc5a", "title": "LeetCode 739: Daily Temperatures", "body": "**Pattern**: monotonic stack\n\n**Why**: The stack is used only at one end, so a plain list costs O(1) per push and pop.\n\n**Python**: `list: append and pop`", "metadata": {"tags": ["lists-and-deques", "problem"], "source": "data-structures/lists-and-deques/glossary.json"}}, {"id": "bef35a7879db", "title": "LeetCode 11: Container With Most Water", "body": "**Pattern**: two pointers\n\n**Why**: Random access by position is O(1), which the two pointers rely on.\n\n**Python**: `list indexing`", "metadata": {"tags": ["lists-and-deques", "problem"], "source": "data-structures/lists-and-deques/glossary.json"}}, {"id": "6e723ef55f7a", "title": "Signal: Process in first-in, first-out order, with work added and re", "body": "**Structure**: block list\n\n**Requirement**: O(1) at both ends\n\n**Python**: `collections.deque`\n\n**Example**: Binary Tree Level Order Traversal (LeetCode 102)", "metadata": {"tags": ["lists-and-deques", "signal"], "source": "data-structures/lists-and-deques/glossary.json"}}, {"id": "394bc0ac4116", "title": "Signal: Last-in, first-out; nearest greater or smaller element in on", "body": "**Structure**: contiguous array used as a stack\n\n**Requirement**: O(1) push and pop at one end; O(n) total\n\n**Python**: `list (append / pop)`\n\n**Example**: Daily Temperatures (LeetCode 739)", "metadata": {"tags": ["lists-and-deques", "signal"], "source": "data-structures/lists-and-deques/glossary.json"}}, {"id": "b3597b72beef", "title": "Signal: Maintain a sorted sequence while looking values up", "body": "**Structure**: sorted contiguous array\n\n**Requirement**: O(log n) search; insertion dominated by the shift\n\n**Python**: `bisect`\n\n**Example**: Searching a sorted list; avoid repeated insort in hot loops", "metadata": {"tags": ["lists-and-deques", "signal"], "source": "data-structures/lists-and-deques/glossary.json"}}, {"id": "16972822c3dc", "title": "Claim: two-pointers-check-palindrome", "body": "Two pointers from opposite ends can check a palindrome in O(n) time and O(1) space without reversing.", "metadata": {"tags": ["strings", "claim"], "source": "data-structures/strings/glossary.json"}}, {"id": "36bb012dba80", "title": "Claim: anagram-count-vs-sort", "body": "Anagrams have identical character counts. Comparing counts is O(n); sorting both strings is O(n log n).", "metadata": {"tags": ["strings", "claim"], "source": "data-structures/strings/glossary.json"}}, {"id": "59f1f7a30c55", "title": "Claim: sliding-window-is-linear", "body": "A sliding window processes each character at most twice, keeping substring search O(n) instead of O(n^2).", "metadata": {"tags": ["strings", "claim"], "source": "data-structures/strings/glossary.json"}}, {"id": "fdc21b0bcb6f", "title": "Claim: in-place-reversal-no-allocation", "body": "Reversing a string in place by swapping characters uses O(1) space; building a reversed copy uses O(n).", "metadata": {"tags": ["strings", "claim"], "source": "data-structures/strings/glossary.json"}}, {"id": "6606e60556c8", "title": "Complexity: palindrome check (two pointers)", "body": "**O(n) time, O(1) space**\n\nmove from ends inward; no allocation", "metadata": {"tags": ["strings", "complexity"], "source": "data-structures/strings/glossary.json"}}, {"id": "3048e8338c2f", "title": "Complexity: reverse string in place (swap)", "body": "**O(n) time, O(1) space**\n\nswap characters with two pointers", "metadata": {"tags": ["strings", "complexity"], "source": "data-structures/strings/glossary.json"}}, {"id": "7ac93f1384fb", "title": "Complexity: anagram check (character count)", "body": "**O(n)**\n\ndict lookups are O(1); faster than sorting", "metadata": {"tags": ["strings", "complexity"], "source": "data-structures/strings/glossary.json"}}, {"id": "007752d76b13", "title": "Complexity: anagram check (sort both)", "body": "**O(n log n)**\n\nfor comparison; sorting is more overhead than needed", "metadata": {"tags": ["strings", "complexity"], "source": "data-structures/strings/glossary.json"}}, {"id": "fcc3d961b94d", "title": "Complexity: substring search (naive)", "body": "**O(n*m)**\n\nnested loop: for each position, match up to m chars", "metadata": {"tags": ["strings", "complexity"], "source": "data-structures/strings/glossary.json"}}, {"id": "9000b664be99", "title": "Complexity: longest substring without repeats", "body": "**O(n)**\n\nsliding window; each char seen at most twice", "metadata": {"tags": ["strings", "complexity"], "source": "data-structures/strings/glossary.json"}}, {"id": "de93a93b7c91", "title": "Q1: When two pointers check a palindrome from the ends inward, w", "body": "A. The left pointer reaches the right pointer\nB. Characters at the current positions do not match\nC. The string has an odd length\nD. The string contains a space\n\n**B.** Palindromes have matching characters at symmetric positions. Any mismatch means the string is not a palindrome.", "metadata": {"tags": ["strings", "question"], "source": "data-structures/strings/glossary.json"}}, {"id": "0a8a1c342e44", "title": "Q2: Why is checking if two strings are anagrams using Counter fa", "body": "A. Counter is implemented in C and always faster\nB. Counter is O(n); sorting both is O(n log n)\nC. Counter eliminates duplicate characters\nD. Sorting cannot compare frequencies\n\n**B.** Counting characters is linear. Sorting is O(n log n), so dict lookup is more efficient for anagram detection.", "metadata": {"tags": ["strings", "question"], "source": "data-structures/strings/glossary.json"}}, {"id": "d8f9938d4851", "title": "Q3: In the sliding-window approach to 'longest substring without", "body": "A. Tracks the start of the current valid substring\nB. Points to the rightmost character\nC. Remains at the first character\nD. Skips whitespace\n\n**A.** The right pointer expands the window; the left retracts when a repeat is found. The distance between them is the substring length.", "metadata": {"tags": ["strings", "question"], "source": "data-structures/strings/glossary.json"}}, {"id": "acaeccbf619f", "title": "Q4: Why does reversing a string with two pointers and swapping u", "body": "A. Swapping modifies the original; slicing allocates a new string\nB. Two pointers are inherently more efficient\nC. Slicing only works on immutable strings\nD. Swapping runs in the CPU cache\n\n**A.** Strings in Python are immutable, so str[::-1] allocates a new string. In-place swaps work on lists or character arrays.", "metadata": {"tags": ["strings", "question"], "source": "data-structures/strings/glossary.json"}}, {"id": "28235435dbd2", "title": "Q5: When comparing anagrams, why must we count all characters in", "body": "A. Duplicates are not relevant to anagrams\nB. We need to verify the same multiset of characters appears in both strings\nC. Counting is always faster than checking\nD. Anagrams only have unique characters\n\n**B.** Anagrams have the same characters with the same frequencies. Checking duplicates alone misses frequency differences.", "metadata": {"tags": ["strings", "question"], "source": "data-structures/strings/glossary.json"}}, {"id": "be3d85663ce3", "title": "LeetCode 28: Implement strStr", "body": "**Pattern**: substring search at each position\n\n**Why**: Comparing characters position by position finds the first match in O(n*m). Rolling hash improves to O(n) but naive is sufficient for moderate lengths.\n\n**Python**: `str.find or manual char-by-char comparison`", "metadata": {"tags": ["strings", "problem"], "source": "data-structures/strings/glossary.json"}}, {"id": "fed23a5c6e75", "title": "LeetCode 125: Valid Palindrome", "body": "**Pattern**: two pointers ignoring non-alphanumeric\n\n**Why**: Two pointers from the ends check symmetry in O(n) without allocating a reversed or cleaned string.\n\n**Python**: `str.isalnum and lower for filtering; two pointers`", "metadata": {"tags": ["strings", "problem"], "source": "data-structures/strings/glossary.json"}}, {"id": "8c2b464216f6", "title": "LeetCode 242: Valid Anagram", "body": "**Pattern**: count and compare\n\n**Why**: Counting character frequencies is O(n). Sorting both strings is O(n log n). Counter is optimal for this check.\n\n**Python**: `collections.Counter`", "metadata": {"tags": ["strings", "problem"], "source": "data-structures/strings/glossary.json"}}, {"id": "9f3057e41e12", "title": "LeetCode 58: Length of Last Word", "body": "**Pattern**: reverse scan to skip trailing spaces\n\n**Why**: Scanning backward from the end finds the last word in one pass, avoiding the overhead of splitting and reversing.\n\n**Python**: `str.split or manual indexing from the end`", "metadata": {"tags": ["strings", "problem"], "source": "data-structures/strings/glossary.json"}}, {"id": "900d42e5cf1e", "title": "LeetCode 151: Reverse Words in a String", "body": "**Pattern**: word-by-word reversal with space handling\n\n**Why**: Using split().reverse().join() is Pythonic and concise. Manual reversal in place avoids intermediate allocations.\n\n**Python**: `str.split and reverse and join, or two-pointer character swap`", "metadata": {"tags": ["strings", "problem"], "source": "data-structures/strings/glossary.json"}}, {"id": "5e0f6b6292ba", "title": "LeetCode 680: Valid Palindrome II", "body": "**Pattern**: two pointers with one skip allowed\n\n**Why**: When a mismatch is found, we must try skipping the left or right character. Backtracking checks both without full string duplication.\n\n**Python**: `two-pointer recursion or backtracking to check both skip cases`", "metadata": {"tags": ["strings", "problem"], "source": "data-structures/strings/glossary.json"}}, {"id": "f8252b8b77bb", "title": "Signal: Verify a string reads the same forward and backward", "body": "**Structure**: two pointers from ends\n\n**Requirement**: O(n) time, O(1) space\n\n**Python**: `str indexing`\n\n**Example**: Valid Palindrome (LeetCode 125)", "metadata": {"tags": ["strings", "signal"], "source": "data-structures/strings/glossary.json"}}, {"id": "998bcffb01b9", "title": "Signal: Compare words by their letters, ignoring order", "body": "**Structure**: character frequency dict\n\n**Requirement**: O(n) without sorting\n\n**Python**: `collections.Counter`\n\n**Example**: Valid Anagram (LeetCode 242)", "metadata": {"tags": ["strings", "signal"], "source": "data-structures/strings/glossary.json"}}, {"id": "2a18c4b15103", "title": "Signal: Find longest substring with a property (no repeats, all vowe", "body": "**Structure**: sliding window with dict\n\n**Requirement**: O(n) in one pass\n\n**Python**: `dict or set to track character presence`\n\n**Example**: Longest Substring Without Repeating Characters (LeetCode 3)", "metadata": {"tags": ["strings", "signal"], "source": "data-structures/strings/glossary.json"}}, {"id": "8fbd9bc6a3df", "title": "Signal: Locate first occurrence of a pattern or substring", "body": "**Structure**: rolling hash or KMP\n\n**Requirement**: O(n) or O(n+m) without O(n*m)\n\n**Python**: `str.find or manual index-by-index`\n\n**Example**: Implement strStr (LeetCode 28)", "metadata": {"tags": ["strings", "signal"], "source": "data-structures/strings/glossary.json"}}, {"id": "0266641a534f", "title": "Signal: Reverse, rotate, or rearrange words in a string", "body": "**Structure**: two-pointer reversal\n\n**Requirement**: O(n) time, O(1) space\n\n**Python**: `str.split and join, or manual swap`\n\n**Example**: Reverse Words in a String (LeetCode 151)", "metadata": {"tags": ["strings", "signal"], "source": "data-structures/strings/glossary.json"}}, {"id": "60237e7af4f4", "title": "Claim: tree-is-recursive-structure", "body": "A binary tree is defined recursively: a node with a left and right subtree, each of which is a binary tree (or empty).", "metadata": {"tags": ["trees", "claim"], "source": "data-structures/trees/glossary.json"}}, {"id": "427361f909e0", "title": "Claim: bst-maintains-invariant", "body": "A binary search tree maintains the invariant that every left descendant is smaller and every right descendant is larger.", "metadata": {"tags": ["trees", "claim"], "source": "data-structures/trees/glossary.json"}}, {"id": "18167f5d660d", "title": "Claim: inorder-traversal-yields-sorted", "body": "In-order traversal of a BST visits nodes in sorted order.", "metadata": {"tags": ["trees", "claim"], "source": "data-structures/trees/glossary.json"}}, {"id": "ae15bd705954", "title": "Claim: tree-height-bounds-recursive-depth", "body": "The height of a tree bounds the recursion depth and the required stack space.", "metadata": {"tags": ["trees", "claim"], "source": "data-structures/trees/glossary.json"}}, {"id": "08dd8104d3ca", "title": "Claim: balanced-tree-search-is-logarithmic", "body": "Search in a balanced BST takes O(log n) time because each comparison eliminates about half the tree.", "metadata": {"tags": ["trees", "claim"], "source": "data-structures/trees/glossary.json"}}, {"id": "f9247fc53f51", "title": "Complexity: BST search (balanced)", "body": "**O(log n)**\n\neach comparison halves the tree; unbalanced tree degrades to O(n)", "metadata": {"tags": ["trees", "complexity"], "source": "data-structures/trees/glossary.json"}}, {"id": "fa60943fecae", "title": "Complexity: BST insert (balanced)", "body": "**O(log n)**\n\nsearch for the position, then add a leaf", "metadata": {"tags": ["trees", "complexity"], "source": "data-structures/trees/glossary.json"}}, {"id": "93408ee149e0", "title": "Complexity: BST delete (balanced)", "body": "**O(log n)**\n\nsearch, then restructure; unbalanced tree O(n)", "metadata": {"tags": ["trees", "complexity"], "source": "data-structures/trees/glossary.json"}}, {"id": "ddf252ca830b", "title": "Complexity: Tree traversal (DFS pre/in/post)", "body": "**O(n)**\n\nvisit every node and edge once; recursive depth is O(h)", "metadata": {"tags": ["trees", "complexity"], "source": "data-structures/trees/glossary.json"}}, {"id": "575c03a830c2", "title": "Complexity: Tree traversal (BFS level-order)", "body": "**O(n)**\n\ndeque maintains the frontier; space is O(w) where w is max width", "metadata": {"tags": ["trees", "complexity"], "source": "data-structures/trees/glossary.json"}}, {"id": "c6977b5d4018", "title": "Complexity: Find LCA (lowest common ancestor)", "body": "**O(n)**\n\nsearch both subtrees to find the split point; O(h) on a balanced tree", "metadata": {"tags": ["trees", "complexity"], "source": "data-structures/trees/glossary.json"}}, {"id": "349d50d64792", "title": "Complexity: Validate BST", "body": "**O(n)**\n\ncheck every node's invariant and track bounds", "metadata": {"tags": ["trees", "complexity"], "source": "data-structures/trees/glossary.json"}}, {"id": "9ab09172cdf4", "title": "Q1: Why is recursion a natural fit for tree problems?", "body": "A. Trees are always small, so recursion never overflows\nB. Each subtree is a smaller instance of the same problem, making induction natural\nC. Recursion is faster than iteration\nD. Trees require random access, which recursion provides\n\n**B.** The recursive structure of a tree (subtree is a tree) matches the recursive structure of the solution (solve left, right, combine).", "metadata": {"tags": ["trees", "question"], "source": "data-structures/trees/glossary.json"}}, {"id": "eae750f49679", "title": "Q2: What does in-order traversal of a BST produce?", "body": "A. Nodes in reverse sorted order\nB. Nodes sorted from smallest to largest\nC. Nodes in the order they were inserted\nD. Nodes in reverse insertion order\n\n**B.** In-order traversal visits left subtree, then node, then right subtree. In a BST, left nodes are smaller, so the result is sorted.", "metadata": {"tags": ["trees", "question"], "source": "data-structures/trees/glossary.json"}}, {"id": "dcf4382c3b5d", "title": "Q3: Why does BST search run in O(log n) time on a balanced tree ", "body": "A. Unbalanced trees store data differently\nB. Unbalanced trees require random access\nC. A balanced tree eliminates about half the tree per comparison; an unbalanced tree may eliminate only one node\nD. Unbalanced trees require more memory\n\n**C.** On a balanced tree, comparison with the root partitions the remaining nodes. On a chain (unbalanced), only one node is eliminated per step.", "metadata": {"tags": ["trees", "question"], "source": "data-structures/trees/glossary.json"}}, {"id": "8b5669101bd7", "title": "Q4: Which traversal naturally uses a queue instead of recursion?", "body": "A. Pre-order (depth-first)\nB. In-order (depth-first)\nC. Level-order (breadth-first)\nD. Post-order (depth-first)\n\n**C.** Level-order visits nodes by depth, layer by layer, which a queue enforces naturally. DFS traversals use recursion or a stack.", "metadata": {"tags": ["trees", "question"], "source": "data-structures/trees/glossary.json"}}, {"id": "1b958620d26e", "title": "Q5: What invariant must a BST maintain?", "body": "A. Left children are smaller, right children are larger\nB. All nodes at each level are sorted\nC. The tree is always perfectly balanced\nD. Child values are the average of their parent and sibling\n\n**A.** In a BST, every node must have smaller values in its left subtree and larger values in its right subtree.", "metadata": {"tags": ["trees", "question"], "source": "data-structures/trees/glossary.json"}}, {"id": "7d1e01900e7d", "title": "LeetCode 100: Same Tree", "body": "**Pattern**: structural equality check\n\n**Why**: Two trees are the same if their roots have equal values and both subtrees are identical. Recursion naturally expresses this.\n\n**Python**: `recursion; compare node values and recurse on subtrees`", "metadata": {"tags": ["trees", "problem"], "source": "data-structures/trees/glossary.json"}}, {"id": "2063659db944", "title": "LeetCode 104: Maximum Depth of Binary Tree", "body": "**Pattern**: post-order traversal\n\n**Why**: Depth of a tree is one plus the maximum depth of its subtrees. Recursion unwraps this definition.\n\n**Python**: `recursion; max(depth(left), depth(right)) + 1`", "metadata": {"tags": ["trees", "problem"], "source": "data-structures/trees/glossary.json"}}, {"id": "7d2b85c1417c", "title": "LeetCode 98: Validate Binary Search Tree", "body": "**Pattern**: constrained recursion\n\n**Why**: A BST must satisfy bounds at every node. Recursion tracks constraints: left subtree \u003c node \u003c right subtree.\n\n**Python**: `recursion; pass min and max bounds down the tree`", "metadata": {"tags": ["trees", "problem"], "source": "data-structures/trees/glossary.json"}}, {"id": "eced1aa0c241", "title": "LeetCode 102: Binary Tree Level Order Traversal", "body": "**Pattern**: level-order traversal\n\n**Why**: Level-order requires visiting all nodes at depth d before depth d+1, which a queue naturally provides.\n\n**Python**: `collections.deque; append children, popleft to process`", "metadata": {"tags": ["trees", "problem"], "source": "data-structures/trees/glossary.json"}}, {"id": "eea8f9480079", "title": "LeetCode 105: Construct Binary Tree from Preorder and Inorder Traversal", "body": "**Pattern**: divideandconquer via traversal properties\n\n**Why**: Preorder starts with the root. Inorder shows which nodes are left and right. Recursion reconstructs subtrees.\n\n**Python**: `recursion; preorder gives root, inorder partitions left/right`", "metadata": {"tags": ["trees", "problem"], "source": "data-structures/trees/glossary.json"}}, {"id": "96aba2841923", "title": "LeetCode 236: Lowest Common Ancestor of a Binary Tree", "body": "**Pattern**: postorder traversal for result aggregation\n\n**Why**: The LCA is the deepest node that has both targets as descendants. Recursion finds it by returning the first non-null result.\n\n**Python**: `recursion; check left and right subtrees, return non-null result`", "metadata": {"tags": ["trees", "problem"], "source": "data-structures/trees/glossary.json"}}, {"id": "d81b8c0d0309", "title": "LeetCode 543: Diameter of Binary Tree", "body": "**Pattern**: postorder traversal tracking global max\n\n**Why**: The diameter passes through some node as the longest path from left to right. Recursion computes heights and tracks the max sum.\n\n**Python**: `recursion; track height and update max diameter`", "metadata": {"tags": ["trees", "problem"], "source": "data-structures/trees/glossary.json"}}, {"id": "feceefce49b6", "title": "Signal: Check if two trees have the same structure and values", "body": "**Structure**: recursive comparison\n\n**Requirement**: Compare recursively; O(n) in worst case\n\n**Python**: `recursion; compare left and right subtrees`\n\n**Example**: Same Tree (LeetCode 100)", "metadata": {"tags": ["trees", "signal"], "source": "data-structures/trees/glossary.json"}}, {"id": "0a308b4295af", "title": "Signal: Find maximum depth or path length from root", "body": "**Structure**: post-order recursion\n\n**Requirement**: Recurse to each leaf and combine results\n\n**Python**: `recursion on left and right subtrees`\n\n**Example**: Maximum Depth of Binary Tree (LeetCode 104)", "metadata": {"tags": ["trees", "signal"], "source": "data-structures/trees/glossary.json"}}, {"id": "b811669b2d8a", "title": "Signal: Verify that a tree satisfies BST properties at every node", "body": "**Structure**: recursive validation with min/max bounds\n\n**Requirement**: Track bounds; no value escapes left \u003c node \u003c right\n\n**Python**: `recursion; pass down constraints`\n\n**Example**: Validate Binary Search Tree (LeetCode 98)", "metadata": {"tags": ["trees", "signal"], "source": "data-structures/trees/glossary.json"}}, {"id": "04b573bf5ad0", "title": "Signal: Collect results from each level of the tree", "body": "**Structure**: breadth-first with a queue\n\n**Requirement**: Visit all nodes at depth d before depth d+1\n\n**Python**: `collections.deque; append and popleft`\n\n**Example**: Binary Tree Level Order Traversal (LeetCode 102)", "metadata": {"tags": ["trees", "signal"], "source": "data-structures/trees/glossary.json"}}, {"id": "b63366e5bcb6", "title": "Signal: Find paths or relationships between nodes in the tree", "body": "**Structure**: recursive search with context\n\n**Requirement**: Locate common ancestor or nearest node in sorted order\n\n**Python**: `recursion; track path or constraint`\n\n**Example**: Lowest Common Ancestor (LeetCode 236)", "metadata": {"tags": ["trees", "signal"], "source": "data-structures/trees/glossary.json"}}, {"id": "5b0753ed838f", "title": "Intent: Abstract Factory", "body": "Provide an interface for creating families of related objects without specifying concrete classes.", "metadata": {"tags": ["design-pattern", "creational", "abstract-factory", "intent"], "source": "design-patterns/glossary.json"}}, {"id": "c67942d70d97", "title": "Use Abstract Factory when", "body": "A system must produce compatible sets of components (UI widgets, storage clients, drivers) that vary by environment but must work together.", "metadata": {"tags": ["design-pattern", "creational", "abstract-factory", "problem"], "source": "design-patterns/glossary.json"}}, {"id": "0aea33824b3d", "title": "Trade-off: Abstract Factory", "body": "**Benefit**: Enforces consistency among related products and centralizes family selection.\n\n**Cost**: Adding a new product kind requires changing every factory interface and implementation.", "metadata": {"tags": ["design-pattern", "creational", "abstract-factory", "tradeoff"], "source": "design-patterns/glossary.json"}}, {"id": "6a1e7fde6809", "title": "Q1: Abstract Factory differs from Factory Method because it:", "body": "A. Creates one product via inheritance hook only\nB. Creates families of related products together\nC. Clones existing instances\nD. Builds objects step by step\n\n**B.** Its focus is consistent families (e.g., queue + storage + metrics) per environment.", "metadata": {"tags": ["design-pattern", "creational", "abstract-factory", "question"], "source": "design-patterns/glossary.json"}}, {"id": "aff5e6394d1b", "title": "Q2: When adding a new product type to an Abstract Factory, you u", "body": "A. Change only one concrete class\nB. Update all factory interfaces and concrete factories\nC. Add a database migration\nD. Introduce an event bus\n\n**B.** The abstraction declares creation for every family member, so it widens across implementations.", "metadata": {"tags": ["design-pattern", "creational", "abstract-factory", "question"], "source": "design-patterns/glossary.json"}}, {"id": "73b555f5f902", "title": "Intent: Adapter", "body": "Convert the interface of a component into one clients expect so incompatible interfaces can collaborate.", "metadata": {"tags": ["design-pattern", "structural", "adapter", "intent"], "source": "design-patterns/glossary.json"}}, {"id": "240d84578baf", "title": "Use Adapter when", "body": "Integrating third-party or legacy APIs requires changing client code or duplicating translation logic across the system.", "metadata": {"tags": ["design-pattern", "structural", "adapter", "problem"], "source": "design-patterns/glossary.json"}}, {"id": "4ce9a0a4054e", "title": "Trade-off: Adapter", "body": "**Benefit**: Enables reuse of existing components without polluting client code.\n\n**Cost**: Adds a translation layer that can hide impedance mismatches or performance costs.", "metadata": {"tags": ["design-pattern", "structural", "adapter", "tradeoff"], "source": "design-patterns/glossary.json"}}, {"id": "6dbeab213d15", "title": "Q1: Adapter primarily addresses:", "body": "A. Object creation complexity\nB. Interface incompatibility between components\nC. Concurrent access control\nD. State persistence\n\n**B.** It translates one interface into another expected by clients.", "metadata": {"tags": ["design-pattern", "structural", "adapter", "question"], "source": "design-patterns/glossary.json"}}, {"id": "23585df36b63", "title": "Q2: In a layered architecture, an adapter commonly lives at:", "body": "A. The domain core only\nB. An integration boundary such as infrastructure/ports\nC. The browser UI exclusively\nD. The database index layer\n\n**B.** Adapters bridge external or legacy systems to internal abstractions at boundaries.", "metadata": {"tags": ["design-pattern", "structural", "adapter", "question"], "source": "design-patterns/glossary.json"}}, {"id": "77ab57c09947", "title": "Intent: Bridge", "body": "Decouple an abstraction from its implementation so both can vary independently.", "metadata": {"tags": ["design-pattern", "structural", "bridge", "intent"], "source": "design-patterns/glossary.json"}}, {"id": "a7bb79c75be3", "title": "Use Bridge when", "body": "Combining multiple abstractions with multiple implementations via inheritance causes class explosion and tight coupling.", "metadata": {"tags": ["design-pattern", "structural", "bridge", "problem"], "source": "design-patterns/glossary.json"}}, {"id": "a3d73c455473", "title": "Trade-off: Bridge", "body": "**Benefit**: Reduces subclass explosion and enables independent evolution of both hierarchies.\n\n**Cost**: Increases design complexity and requires up-front separation of concerns.", "metadata": {"tags": ["design-pattern", "structural", "bridge", "tradeoff"], "source": "design-patterns/glossary.json"}}, {"id": "a15b5ec75c7c", "title": "Q1: Bridge is preferred over inheritance when:", "body": "A. Only one implementation will ever exist\nB. Two orthogonal dimensions must vary independently\nC. Objects must be composed into trees\nD. You need to cache remote responses\n\n**B.** It splits abstraction and implementation into separate hierarchies.", "metadata": {"tags": ["design-pattern", "structural", "bridge", "question"], "source": "design-patterns/glossary.json"}}, {"id": "89c97ec932bc", "title": "Q2: A sign Bridge may be missing is:", "body": "A. Many subclasses named like FeatureXOnPlatformY\nB. Need for undo/redo\nC. Expensive object creation\nD. Tree traversal requirements\n\n**A.** Combinatorial subclasses indicate abstraction and implementation are tangled.", "metadata": {"tags": ["design-pattern", "structural", "bridge", "question"], "source": "design-patterns/glossary.json"}}, {"id": "b7d53c5843f9", "title": "Intent: Builder", "body": "Separate construction of a complex object from its representation so the same process can create different forms.", "metadata": {"tags": ["design-pattern", "creational", "builder", "intent"], "source": "design-patterns/glossary.json"}}, {"id": "3667b1d8fa24", "title": "Use Builder when", "body": "Creating objects with many optional parts, validation rules, or assembly steps leads to telescoping constructors and fragile setup code.", "metadata": {"tags": ["design-pattern", "creational", "builder", "problem"], "source": "design-patterns/glossary.json"}}, {"id": "b0313eae3227", "title": "Trade-off: Builder", "body": "**Benefit**: Improves readability and correctness for complex object assembly.\n\n**Cost**: Adds classes/objects and can be overkill for simple data structures.", "metadata": {"tags": ["design-pattern", "creational", "builder", "tradeoff"], "source": "design-patterns/glossary.json"}}, {"id": "f17d955bde94", "title": "Q1: Builder is a better fit than many constructor parameters whe", "body": "A. Objects must be globally unique\nB. Construction is stepwise with optional parts and validation\nC. Behavior must be swapped at runtime\nD. Access to a remote service must be proxied\n\n**B.** It makes complex, ordered assembly explicit and safe.", "metadata": {"tags": ["design-pattern", "creational", "builder", "question"], "source": "design-patterns/glossary.json"}}, {"id": "fc043e027993", "title": "Q2: What does a Director contribute?", "body": "A. Stores the final product for all clients\nB. Encapsulates a reusable construction sequence\nC. Selects concrete classes by string name\nD. Handles persistence transactions\n\n**B.** The Director knows the order of steps; builders know how to perform each step.", "metadata": {"tags": ["design-pattern", "creational", "builder", "question"], "source": "design-patterns/glossary.json"}}, {"id": "251c58d33552", "title": "Intent: Chain of Responsibility", "body": "Pass a request along a chain of handlers until one handles or processes it.", "metadata": {"tags": ["design-pattern", "behavioral", "chain-of-responsibility", "intent"], "source": "design-patterns/glossary.json"}}, {"id": "f28f4ee927ee", "title": "Use Chain of Responsibility when", "body": "Coupling senders to specific handlers or writing large conditional dispatch logic makes request processing rigid.", "metadata": {"tags": ["design-pattern", "behavioral", "chain-of-responsibility", "problem"], "source": "design-patterns/glossary.json"}}, {"id": "5f99f97f8bd0", "title": "Trade-off: Chain of Responsibility", "body": "**Benefit**: Decouples senders from receivers and makes pipelines of checks or transforms composable.\n\n**Cost**: A request may go unhandled and chains can be harder to trace.", "metadata": {"tags": ["design-pattern", "behavioral", "chain-of-responsibility", "tradeoff"], "source": "design-patterns/glossary.json"}}, {"id": "535996db2eb8", "title": "Q1: Chain of Responsibility lets you:", "body": "A. Guarantee exactly one handler always runs\nB. Decouple sender from the concrete receiver by forwarding along handlers\nC. Replicate state across nodes\nD. Compile queries into SQL\n\n**B.** Handlers are linked and each decides whether to act or pass along.", "metadata": {"tags": ["design-pattern", "behavioral", "chain-of-responsibility", "question"], "source": "design-patterns/glossary.json"}}, {"id": "7bffb8f71c25", "title": "Q2: A risk to manage in handler chains is:", "body": "A. Mandatory global locks\nB. Requests falling off the end unhandled\nC. Inability to add new handlers\nD. Loss of type safety in all languages\n\n**B.** Without a terminal handler or contract, some requests may not be processed.", "metadata": {"tags": ["design-pattern", "behavioral", "chain-of-responsibility", "question"], "source": "design-patterns/glossary.json"}}, {"id": "5f641bf9717c", "title": "Intent: Command", "body": "Encapsulate a request as an object, allowing parameterization, queuing, logging, and undo.", "metadata": {"tags": ["design-pattern", "behavioral", "command", "intent"], "source": "design-patterns/glossary.json"}}, {"id": "eb043a8c96b5", "title": "Use Command when", "body": "Invokers are tightly coupled to concrete operations, making it hard to queue, audit, retry, or reverse actions.", "metadata": {"tags": ["design-pattern", "behavioral", "command", "problem"], "source": "design-patterns/glossary.json"}}, {"id": "6ccddf4d83ad", "title": "Trade-off: Command", "body": "**Benefit**: Decouples invocation from execution and enables scheduling, auditing, and reversal.\n\n**Cost**: Introduces many small command objects and lifecycle management concerns.", "metadata": {"tags": ["design-pattern", "behavioral", "command", "tradeoff"], "source": "design-patterns/glossary.json"}}, {"id": "4bb42dfbad2a", "title": "Q1: Command turns a request into:", "body": "A. A database schema\nB. A standalone object with execution context\nC. A shared mutable singleton\nD. A compile-time macro\n\n**B.** Encapsulation as an object enables queuing, logging, and undo.", "metadata": {"tags": ["design-pattern", "behavioral", "command", "question"], "source": "design-patterns/glossary.json"}}, {"id": "8411fec59f22", "title": "Q2: In CQRS-style systems, commands are useful because:", "body": "A. They replace read models entirely\nB. They represent intentful writes that can be validated, queued, and audited\nC. They guarantee eventual consistency without design\nD. They eliminate domain logic\n\n**B.** Commands make write operations explicit and manageable.", "metadata": {"tags": ["design-pattern", "behavioral", "command", "question"], "source": "design-patterns/glossary.json"}}, {"id": "fbd45845110b", "title": "Intent: Composite", "body": "Compose objects into tree structures and let clients treat individual objects and compositions uniformly.", "metadata": {"tags": ["design-pattern", "structural", "composite", "intent"], "source": "design-patterns/glossary.json"}}, {"id": "2da3daee9d5d", "title": "Use Composite when", "body": "Client code must distinguish leaves from containers when operating over hierarchical structures, leading to special-case logic.", "metadata": {"tags": ["design-pattern", "structural", "composite", "problem"], "source": "design-patterns/glossary.json"}}, {"id": "98a488d0f49e", "title": "Trade-off: Composite", "body": "**Benefit**: Simplifies client code and makes it easy to add new component types.\n\n**Cost**: Can make it harder to restrict which children a composite may contain.", "metadata": {"tags": ["design-pattern", "structural", "composite", "tradeoff"], "source": "design-patterns/glossary.json"}}, {"id": "aae4f2848ed4", "title": "Q1: Composite is most appropriate for:", "body": "A. Flat collections with no nesting\nB. Tree-like part-whole structures\nC. Request/response retries\nD. Two-phase commits\n\n**B.** It models recursive hierarchies behind a uniform interface.", "metadata": {"tags": ["design-pattern", "structural", "composite", "question"], "source": "design-patterns/glossary.json"}}, {"id": "c2e58cd9bd8f", "title": "Q2: A trade-off of Composite is:", "body": "A. Clients must always know concrete types\nB. Constraining allowed child types can become harder\nC. It cannot support recursion\nD. It removes polymorphism\n\n**B.** A uniform component interface can weaken compile-time/type-level constraints.", "metadata": {"tags": ["design-pattern", "structural", "composite", "question"], "source": "design-patterns/glossary.json"}}, {"id": "c17e6b26274a", "title": "Intent: Decorator", "body": "Attach additional responsibilities to an object dynamically by wrapping it.", "metadata": {"tags": ["design-pattern", "structural", "decorator", "intent"], "source": "design-patterns/glossary.json"}}, {"id": "4d0aab09dc68", "title": "Use Decorator when", "body": "Subclassing to add combinations of behaviors (logging, caching, auth, metrics) causes class explosion and rigid composition.", "metadata": {"tags": ["design-pattern", "structural", "decorator", "problem"], "source": "design-patterns/glossary.json"}}, {"id": "381e0b8cf7e8", "title": "Trade-off: Decorator", "body": "**Benefit**: Enables flexible, mix-and-match behavior without subclass explosions.\n\n**Cost**: Many small wrappers can complicate debugging and object identity.", "metadata": {"tags": ["design-pattern", "structural", "decorator", "tradeoff"], "source": "design-patterns/glossary.json"}}, {"id": "060c4911abe8", "title": "Q1: Decorator differs from inheritance by:", "body": "A. Composing behavior at runtime via wrapping\nB. Requiring access to source code\nC. Only working for UI widgets\nD. Forcing a single global wrapper\n\n**A.** Decorators wrap objects dynamically, allowing flexible combinations.", "metadata": {"tags": ["design-pattern", "structural", "decorator", "question"], "source": "design-patterns/glossary.json"}}, {"id": "432d5f9e93f9", "title": "Q2: A common operational pitfall of decorators is:", "body": "A. They cannot implement interfaces\nB. Wrapper order can change semantics and complicate tracing\nC. They require database locks\nD. They eliminate the need for testing\n\n**B.** Behavior like auth-before-cache vs cache-before-auth depends on composition order.", "metadata": {"tags": ["design-pattern", "structural", "decorator", "question"], "source": "design-patterns/glossary.json"}}, {"id": "8d77754dfb4e", "title": "Intent: Dependency Injection", "body": "Supply an object’s dependencies from the outside rather than having it construct or locate them internally.", "metadata": {"tags": ["design-pattern", "application", "dependency-injection", "intent"], "source": "design-patterns/glossary.json"}}, {"id": "89c1f14ac994", "title": "Use Dependency Injection when", "body": "Hard-coded dependencies make code difficult to test, configure, and extend across environments.", "metadata": {"tags": ["design-pattern", "application", "dependency-injection", "problem"], "source": "design-patterns/glossary.json"}}, {"id": "f4db45446b32", "title": "Trade-off: Dependency Injection", "body": "**Benefit**: Improves testability, configurability, and adherence to dependency inversion.\n\n**Cost**: Can obscure object creation flow and introduce container/configuration complexity.", "metadata": {"tags": ["design-pattern", "application", "dependency-injection", "tradeoff"], "source": "design-patterns/glossary.json"}}, {"id": "584606210031", "title": "Q1: Dependency Injection mainly improves:", "body": "A. Network throughput\nB. Testability and flexibility by externalizing dependency creation\nC. Database normalization\nD. Binary size\n\n**B.** Clients receive collaborators, making substitution and configuration easier.", "metadata": {"tags": ["design-pattern", "application", "dependency-injection", "question"], "source": "design-patterns/glossary.json"}}, {"id": "77b07a06008f", "title": "Q2: A potential downside of DI containers is:", "body": "A. They prevent interface use\nB. Wiring can become implicit and harder to trace\nC. They require no configuration ever\nD. They eliminate constructors\n\n**B.** Automated wiring may hide how objects are composed, so explicitness matters.", "metadata": {"tags": ["design-pattern", "application", "dependency-injection", "question"], "source": "design-patterns/glossary.json"}}, {"id": "30debc77afc2", "title": "Intent: Facade", "body": "Provide a simplified interface to a complex subsystem.", "metadata": {"tags": ["design-pattern", "structural", "facade", "intent"], "source": "design-patterns/glossary.json"}}, {"id": "32c301a9e13d", "title": "Use Facade when", "body": "Clients must orchestrate many subsystem classes and calls, increasing coupling and misuse risk.", "metadata": {"tags": ["design-pattern", "structural", "facade", "problem"], "source": "design-patterns/glossary.json"}}, {"id": "448588ce23ac", "title": "Trade-off: Facade", "body": "**Benefit**: Reduces coupling and makes common use cases easier and safer.\n\n**Cost**: Can become a god object if it accumulates unrelated responsibilities.", "metadata": {"tags": ["design-pattern", "structural", "facade", "tradeoff"], "source": "design-patterns/glossary.json"}}, {"id": "57473ddf335b", "title": "Q1: Facade is primarily about:", "body": "A. Enforcing one instance globally\nB. Simplifying access to a subsystem\nC. Sharing intrinsic state efficiently\nD. Deferring execution as commands\n\n**B.** It provides a higher-level interface over complex components.", "metadata": {"tags": ["design-pattern", "structural", "facade", "question"], "source": "design-patterns/glossary.json"}}, {"id": "e93dea2beed6", "title": "Q2: When should clients bypass a facade?", "body": "A. Never, facades must hide everything permanently\nB. When advanced or uncommon capabilities are legitimately needed\nC. Only during testing\nD. Whenever performance matters\n\n**B.** Facades simplify common paths but do not have to forbid direct subsystem access.", "metadata": {"tags": ["design-pattern", "structural", "facade", "question"], "source": "design-patterns/glossary.json"}}, {"id": "6378a7fbaffc", "title": "Intent: Factory Method", "body": "Let subclasses or hook implementations decide which concrete object to create.", "metadata": {"tags": ["design-pattern", "creational", "factory-method", "intent"], "source": "design-patterns/glossary.json"}}, {"id": "533ebbfdc482", "title": "Use Factory Method when", "body": "A framework needs to create products while allowing extensions to choose concrete types without changing core workflow code.", "metadata": {"tags": ["design-pattern", "creational", "factory-method", "problem"], "source": "design-patterns/glossary.json"}}, {"id": "bb14034760ed", "title": "Trade-off: Factory Method", "body": "**Benefit**: Decouples object creation from the high-level algorithm that uses it.\n\n**Cost**: Introduces subclassing or hook points that can proliferate.", "metadata": {"tags": ["design-pattern", "creational", "factory-method", "tradeoff"], "source": "design-patterns/glossary.json"}}, {"id": "782fa7848922", "title": "Q1: Factory Method is most useful when:", "body": "A. One global object must be shared\nB. Object creation must vary while the workflow stays fixed\nC. Multiple objects must be created as a family atomically\nD. An object graph is too expensive to copy\n\n**B.** It defers instantiation to an overridable hook so workflows can stay generic.", "metadata": {"tags": ["design-pattern", "creational", "factory-method", "question"], "source": "design-patterns/glossary.json"}}, {"id": "189e409f2fc1", "title": "Q2: Compared to putting `if type == ...` in the workflow, Factor", "body": "A. Removes all runtime polymorphism\nB. Moves variation to a dedicated creation point\nC. Requires distributed messaging\nD. Eliminates the need for interfaces\n\n**B.** Creation variability is isolated behind the factory method.", "metadata": {"tags": ["design-pattern", "creational", "factory-method", "question"], "source": "design-patterns/glossary.json"}}, {"id": "1c8b189eab85", "title": "Intent: Flyweight", "body": "Share common intrinsic state across many fine-grained objects to reduce memory use.", "metadata": {"tags": ["design-pattern", "structural", "flyweight", "intent"], "source": "design-patterns/glossary.json"}}, {"id": "60d89178adce", "title": "Use Flyweight when", "body": "Large numbers of similar objects duplicate immutable data, causing high memory overhead.", "metadata": {"tags": ["design-pattern", "structural", "flyweight", "problem"], "source": "design-patterns/glossary.json"}}, {"id": "652efc23a027", "title": "Trade-off: Flyweight", "body": "**Benefit**: Reduces memory and allocation costs for large object populations.\n\n**Cost**: Adds complexity and may increase CPU cost to manage extrinsic state.", "metadata": {"tags": ["design-pattern", "structural", "flyweight", "tradeoff"], "source": "design-patterns/glossary.json"}}, {"id": "01d0d2a3732d", "title": "Q1: Flyweight saves memory by:", "body": "A. Compressing objects on disk\nB. Sharing intrinsic state and externalizing extrinsic state\nC. Using lazy database queries\nD. Batching network calls\n\n**B.** Common immutable data is stored once and reused across many logical instances.", "metadata": {"tags": ["design-pattern", "structural", "flyweight", "question"], "source": "design-patterns/glossary.json"}}, {"id": "935bc14274dc", "title": "Q2: A precondition for safe Flyweight use is:", "body": "A. Intrinsic state must be mutable by clients\nB. Clear separation between shared and per-use state\nC. All objects must live in one process globally\nD. No factory can be used\n\n**B.** Shared state must be immutable or carefully controlled; extrinsic state is supplied per operation.", "metadata": {"tags": ["design-pattern", "structural", "flyweight", "question"], "source": "design-patterns/glossary.json"}}, {"id": "bff14fd96137", "title": "Intent: Iterator", "body": "Provide a way to access elements of an aggregate sequentially without exposing its representation.", "metadata": {"tags": ["design-pattern", "behavioral", "iterator", "intent"], "source": "design-patterns/glossary.json"}}, {"id": "8ad42309c553", "title": "Use Iterator when", "body": "Clients need to traverse collections with different internal structures without depending on their concrete storage details.", "metadata": {"tags": ["design-pattern", "behavioral", "iterator", "problem"], "source": "design-patterns/glossary.json"}}, {"id": "7a8e0f82b445", "title": "Trade-off: Iterator", "body": "**Benefit**: Simplifies client traversal logic and supports multiple simultaneous traversals.\n\n**Cost**: Adds objects and can be redundant in languages with rich built-in iteration.", "metadata": {"tags": ["design-pattern", "behavioral", "iterator", "tradeoff"], "source": "design-patterns/glossary.json"}}, {"id": "903406f4c642", "title": "Q1: Iterator’s key benefit is:", "body": "A. Faster sorting algorithms\nB. Traversal without exposing internal representation\nC. Automatic persistence\nD. Distributed consensus\n\n**B.** Clients consume elements through a standard interface regardless of storage layout.", "metadata": {"tags": ["design-pattern", "behavioral", "iterator", "question"], "source": "design-patterns/glossary.json"}}, {"id": "3656c3d6d308", "title": "Q2: In data pipeline code, iterators are useful because:", "body": "A. They eliminate backpressure\nB. They provide a uniform way to stream records from varied sources\nC. They replace message queues\nD. They guarantee exactly-once delivery\n\n**B.** Different sources can expose the same traversal contract to downstream stages.", "metadata": {"tags": ["design-pattern", "behavioral", "iterator", "question"], "source": "design-patterns/glossary.json"}}, {"id": "d3d31c0e6f28", "title": "Intent: Mediator", "body": "Centralize complex interactions between related objects in a mediator to reduce direct dependencies.", "metadata": {"tags": ["design-pattern", "behavioral", "mediator", "intent"], "source": "design-patterns/glossary.json"}}, {"id": "4e1ddb24b86e", "title": "Use Mediator when", "body": "Many components reference each other directly, creating tangled communication and fragile change propagation.", "metadata": {"tags": ["design-pattern", "behavioral", "mediator", "problem"], "source": "design-patterns/glossary.json"}}, {"id": "5c1ee4a07b4e", "title": "Trade-off: Mediator", "body": "**Benefit**: Reduces coupling between components and localizes collaboration logic.\n\n**Cost**: Mediator can grow into a complex central controller.", "metadata": {"tags": ["design-pattern", "behavioral", "mediator", "tradeoff"], "source": "design-patterns/glossary.json"}}, {"id": "225e4c25c22c", "title": "Q1: Mediator reduces:", "body": "A. The need for any interfaces\nB. Direct many-to-many dependencies between colleagues\nC. All runtime latency\nD. Storage requirements\n\n**B.** Peers communicate via a central coordinator rather than referencing each other.", "metadata": {"tags": ["design-pattern", "behavioral", "mediator", "question"], "source": "design-patterns/glossary.json"}}, {"id": "0cc92da40de2", "title": "Q2: A warning sign when using Mediator is:", "body": "A. Colleagues become too reusable\nB. The mediator accumulates most business rules and complexity\nC. Handlers become stateless\nD. Events become immutable\n\n**B.** Centralization helps decoupling but can create a god object if overused.", "metadata": {"tags": ["design-pattern", "behavioral", "mediator", "question"], "source": "design-patterns/glossary.json"}}, {"id": "01e094d1f9b3", "title": "Intent: Memento", "body": "Capture and externalize an object’s internal state so it can be restored later without violating encapsulation.", "metadata": {"tags": ["design-pattern", "behavioral", "memento", "intent"], "source": "design-patterns/glossary.json"}}, {"id": "f7f03e0fa36f", "title": "Use Memento when", "body": "Implementing undo, checkpoints, or rollback requires access to internal state that should remain private.", "metadata": {"tags": ["design-pattern", "behavioral", "memento", "problem"], "source": "design-patterns/glossary.json"}}, {"id": "8481ca81d5d8", "title": "Trade-off: Memento", "body": "**Benefit**: Supports rollback and checkpoints while preserving encapsulation boundaries.\n\n**Cost**: Can consume significant memory or require careful snapshot sizing.", "metadata": {"tags": ["design-pattern", "behavioral", "memento", "tradeoff"], "source": "design-patterns/glossary.json"}}, {"id": "ff903ebab7bd", "title": "Q1: Memento preserves encapsulation by:", "body": "A. Making all state public for caretakers\nB. Letting the originator create and consume opaque snapshots\nC. Storing state only in global variables\nD. Serializing directly in every client\n\n**B.** Caretakers hold snapshots without reading their internal structure.", "metadata": {"tags": ["design-pattern", "behavioral", "memento", "question"], "source": "design-patterns/glossary.json"}}, {"id": "267081d4d9d2", "title": "Q2: In event-driven systems, mementos are often used for:", "body": "A. Routing messages between brokers\nB. Checkpointing state for recovery/undo scenarios\nC. Load balancing HTTP traffic\nD. Schema migration\n\n**B.** Snapshots can complement event streams for rollback or fast restore points.", "metadata": {"tags": ["design-pattern", "behavioral", "memento", "question"], "source": "design-patterns/glossary.json"}}, {"id": "aba8b36bba8f", "title": "Intent: Observer", "body": "Define a one-to-many dependency so dependents are notified when a subject changes state.", "metadata": {"tags": ["design-pattern", "behavioral", "observer", "intent"], "source": "design-patterns/glossary.json"}}, {"id": "cd539739b3e7", "title": "Use Observer when", "body": "Components need to react to state changes without hard-coded polling or tight coupling between publisher and subscribers.", "metadata": {"tags": ["design-pattern", "behavioral", "observer", "problem"], "source": "design-patterns/glossary.json"}}, {"id": "4c56181ae2f0", "title": "Trade-off: Observer", "body": "**Benefit**: Enables loose coupling and dynamic subscription for change propagation.\n\n**Cost**: Notification order, storms, and debugging event flows can be challenging.", "metadata": {"tags": ["design-pattern", "behavioral", "observer", "tradeoff"], "source": "design-patterns/glossary.json"}}, {"id": "6510ffdd1ade", "title": "Q1: Observer is best characterized as:", "body": "A. One-to-one synchronous call chains only\nB. A publish/subscribe dependency between subject and observers\nC. A data partitioning strategy\nD. A compile-time code generator\n\n**B.** Observers register interest and receive updates when the subject changes.", "metadata": {"tags": ["design-pattern", "behavioral", "observer", "question"], "source": "design-patterns/glossary.json"}}, {"id": "03c7ef6ab1de", "title": "Q2: In distributed event-driven systems, a common observer risk ",
