 "body": "A. No way to add subscribers\nB. Uncontrolled cascades and unclear delivery/ordering semantics\nC. Guaranteed global transactions\nD. Static schemas only\n\n**B.** Loose coupling is powerful but requires attention to ordering, retries, and idempotency.", "metadata": {"tags": ["design-pattern", "behavioral", "observer", "question"], "source": "design-patterns/glossary.json"}}, {"id": "f18148170a84", "title": "Intent: Prototype", "body": "Create new objects by copying a prototypical instance instead of instantiating from scratch.", "metadata": {"tags": ["design-pattern", "creational", "prototype", "intent"], "source": "design-patterns/glossary.json"}}, {"id": "8cabbc62853d", "title": "Use Prototype when", "body": "Object creation is expensive or configuration-heavy, and new instances should start from known templates with small variations.", "metadata": {"tags": ["design-pattern", "creational", "prototype", "problem"], "source": "design-patterns/glossary.json"}}, {"id": "50e1b2fb0b29", "title": "Trade-off: Prototype", "body": "**Benefit**: Speeds creation and centralizes default templates.\n\n**Cost**: Cloning graphs with shared references or cycles can be error-prone.", "metadata": {"tags": ["design-pattern", "creational", "prototype", "tradeoff"], "source": "design-patterns/glossary.json"}}, {"id": "ae6ec0698ffb", "title": "Q1: Prototype is especially helpful when:", "body": "A. You need one instance per process\nB. Creating from a configured template is cheaper than full construction\nC. Objects must never be copied\nD. You must enforce access control\n\n**B.** Cloning reuses an initialized template as the starting point.", "metadata": {"tags": ["design-pattern", "creational", "prototype", "question"], "source": "design-patterns/glossary.json"}}, {"id": "fb10eb508637", "title": "Q2: A key risk with Prototype is:", "body": "A. Inability to support interfaces\nB. Incorrect deep vs shallow copying of mutable state\nC. Guaranteed memory leaks\nD. Mandatory network calls during clone\n\n**B.** Copy semantics determine whether clones share nested mutable objects.", "metadata": {"tags": ["design-pattern", "creational", "prototype", "question"], "source": "design-patterns/glossary.json"}}, {"id": "05acd23994e9", "title": "Intent: Proxy", "body": "Provide a surrogate or placeholder that controls access to another object.", "metadata": {"tags": ["design-pattern", "structural", "proxy", "intent"], "source": "design-patterns/glossary.json"}}, {"id": "b049f25e4f1f", "title": "Use Proxy when", "body": "Direct access to an object is expensive, remote, unsafe, or needs cross-cutting controls like caching or lazy loading.", "metadata": {"tags": ["design-pattern", "structural", "proxy", "problem"], "source": "design-patterns/glossary.json"}}, {"id": "03a1685d3fb2", "title": "Trade-off: Proxy", "body": "**Benefit**: Adds access control or optimization transparently to clients.\n\n**Cost**: Introduces latency/complexity and can obscure failure modes of the real subject.", "metadata": {"tags": ["design-pattern", "structural", "proxy", "tradeoff"], "source": "design-patterns/glossary.json"}}, {"id": "3a04e86ef3fb", "title": "Q1: A proxy and the real subject typically:", "body": "A. Expose unrelated interfaces\nB. Share the same subject interface so clients are unaware\nC. Must run in different processes\nD. Cannot be swapped at runtime\n\n**B.** Transparency to the client is a core property of Proxy.", "metadata": {"tags": ["design-pattern", "structural", "proxy", "question"], "source": "design-patterns/glossary.json"}}, {"id": "6fc32235d3df", "title": "Q2: Which is a valid proxy use case?", "body": "A. Defining algorithm families\nB. Lazy loading or access control around a real object\nC. Building objects stepwise\nD. Traversing tree structures uniformly\n\n**B.** Proxies control access for concerns like laziness, protection, remoting, or caching.", "metadata": {"tags": ["design-pattern", "structural", "proxy", "question"], "source": "design-patterns/glossary.json"}}, {"id": "1909656ae9a6", "title": "Intent: Repository", "body": "Mediate between domain and data mapping layers through a collection-like interface for aggregates.", "metadata": {"tags": ["design-pattern", "application", "repository", "intent"], "source": "design-patterns/glossary.json"}}, {"id": "f71256e0c264", "title": "Use Repository when", "body": "Domain logic becomes coupled to queries, ORM APIs, and persistence details, making it hard to test and evolve.", "metadata": {"tags": ["design-pattern", "application", "repository", "problem"], "source": "design-patterns/glossary.json"}}, {"id": "128404eb489d", "title": "Trade-off: Repository", "body": "**Benefit**: Improves separation of concerns and testability of domain logic.\n\n**Cost**: Can hide important query capabilities or add leaky abstractions if over-generalized.", "metadata": {"tags": ["design-pattern", "application", "repository", "tradeoff"], "source": "design-patterns/glossary.json"}}, {"id": "fab005b05d9c", "title": "Q1: Repository aims to present persistence as:", "body": "A. A set of HTTP endpoints\nB. A collection-like interface over domain aggregates\nC. A UI component tree\nD. A message broker topic\n\n**B.** It abstracts storage behind domain-oriented operations.", "metadata": {"tags": ["design-pattern", "application", "repository", "question"], "source": "design-patterns/glossary.json"}}, {"id": "4ce6ea4ed35b", "title": "Q2: A common repository anti-pattern is:", "body": "A. Defining methods per aggregate use case\nB. A one-size-fits-all generic CRUD interface that hides important domain queries\nC. Using interfaces for testing\nD. Separating domain and infrastructure\n\n**B.** Overly generic repositories can leak persistence details or fail to express intent.", "metadata": {"tags": ["design-pattern", "application", "repository", "question"], "source": "design-patterns/glossary.json"}}, {"id": "0828d27aed2f", "title": "Intent: State", "body": "Allow an object to alter its behavior when its internal state changes by delegating to state objects.", "metadata": {"tags": ["design-pattern", "behavioral", "state", "intent"], "source": "design-patterns/glossary.json"}}, {"id": "6a8f605f7d76", "title": "Use State when", "body": "Behavior that depends on lifecycle state leads to large conditional blocks and invalid transitions scattered through methods.", "metadata": {"tags": ["design-pattern", "behavioral", "state", "problem"], "source": "design-patterns/glossary.json"}}, {"id": "810a896cfb1a", "title": "Trade-off: State", "body": "**Benefit**: Localizes state-specific behavior and makes transitions explicit.\n\n**Cost**: Increases number of classes and requires careful transition ownership.", "metadata": {"tags": ["design-pattern", "behavioral", "state", "tradeoff"], "source": "design-patterns/glossary.json"}}, {"id": "b3b4a24fd582", "title": "Q1: State pattern is a strong fit when:", "body": "A. Behavior is identical in all modes\nB. An object’s behavior and valid transitions depend on lifecycle phase\nC. You need to clone object graphs\nD. You need a simplified subsystem API\n\n**B.** It encapsulates per-state behavior and transitions.", "metadata": {"tags": ["design-pattern", "behavioral", "state", "question"], "source": "design-patterns/glossary.json"}}, {"id": "8554c43dbc4d", "title": "Q2: How does State differ from Strategy conceptually?", "body": "A. State is chosen by client only; Strategy never is\nB. State transitions are typically driven by context lifecycle, Strategy by interchangeable policy choice\nC. State requires databases; Strategy does not\nD. They are identical patterns\n\n**B.** Both delegate behavior, but State models internal lifecycle transitions.", "metadata": {"tags": ["design-pattern", "behavioral", "state", "question"], "source": "design-patterns/glossary.json"}}, {"id": "6b4951b36e89", "title": "Intent: Strategy", "body": "Define interchangeable algorithms behind a stable interface so behavior can vary at runtime.", "metadata": {"tags": ["design-pattern", "behavioral", "strategy", "intent"], "source": "design-patterns/glossary.json"}}, {"id": "b0b160364c65", "title": "Use Strategy when", "body": "A service needs multiple pricing, routing, or ranking behaviors without scattering conditionals across callers.", "metadata": {"tags": ["design-pattern", "behavioral", "strategy", "problem"], "source": "design-patterns/glossary.json"}}, {"id": "198fae39e7e8", "title": "Trade-off: Strategy", "body": "**Benefit**: Replaces branching logic with composable, testable policies.\n\n**Cost**: Adds indirection and requires explicit strategy selection.", "metadata": {"tags": ["design-pattern", "behavioral", "strategy", "tradeoff"], "source": "design-patterns/glossary.json"}}, {"id": "fda5e5d88560", "title": "Q1: What problem does Strategy primarily solve?", "body": "A. Sharing mutable state across objects\nB. Selecting algorithms at runtime without caller conditionals\nC. Persisting objects to storage\nD. Coordinating distributed transactions\n\n**B.** Strategy encapsulates interchangeable behaviors behind a common interface.", "metadata": {"tags": ["design-pattern", "behavioral", "strategy", "question"], "source": "design-patterns/glossary.json"}}, {"id": "18da04799b8d", "title": "Q2: In a microservices pricing service, where does Strategy fit ", "body": "A. As a network retry policy between services\nB. As pluggable domain policies inside one service\nC. As the service discovery mechanism\nD. As the database replication protocol\n\n**B.** It organizes internal behavior variants; cross-service concerns belong to architecture patterns.", "metadata": {"tags": ["design-pattern", "behavioral", "strategy", "question"], "source": "design-patterns/glossary.json"}}, {"id": "7fc3ebc7bc3a", "title": "Intent: Template Method", "body": "Define the skeleton of an algorithm in a base operation, deferring specific steps to subclasses or hooks.", "metadata": {"tags": ["design-pattern", "behavioral", "template-method", "intent"], "source": "design-patterns/glossary.json"}}, {"id": "bdc3fa355c83", "title": "Use Template Method when", "body": "Multiple implementations share the same overall process but duplicate its structure while varying a few steps.", "metadata": {"tags": ["design-pattern", "behavioral", "template-method", "problem"], "source": "design-patterns/glossary.json"}}, {"id": "c41cd05b6047", "title": "Trade-off: Template Method", "body": "**Benefit**: Reuses invariant workflow logic and enforces consistent sequencing.\n\n**Cost**: Relies on inheritance and can make flows harder to follow across class hierarchy.", "metadata": {"tags": ["design-pattern", "behavioral", "template-method", "tradeoff"], "source": "design-patterns/glossary.json"}}, {"id": "79c63e93bfd0", "title": "Q1: Template Method centralizes:", "body": "A. Object construction of families\nB. The invariant sequence of an algorithm\nC. Network communication retries\nD. Persistent storage schemas\n\n**B.** The base class owns the skeleton; subclasses supply variable steps.", "metadata": {"tags": ["design-pattern", "behavioral", "template-method", "question"], "source": "design-patterns/glossary.json"}}, {"id": "783df041e70d", "title": "Q2: A drawback compared to composition-based alternatives is:", "body": "A. It cannot enforce ordering\nB. It depends on inheritance, limiting flexibility\nC. It prevents code reuse\nD. It only works in functional languages\n\n**B.** Behavior variation is expressed through subclassing rather than object composition.", "metadata": {"tags": ["design-pattern", "behavioral", "template-method", "question"], "source": "design-patterns/glossary.json"}}, {"id": "055e696c81ff", "title": "Intent: Unit of Work", "body": "Track changes to objects during a business transaction and coordinate writing them out as a single unit.", "metadata": {"tags": ["design-pattern", "application", "unit-of-work", "intent"], "source": "design-patterns/glossary.json"}}, {"id": "fe4b3777254d", "title": "Use Unit of Work when", "body": "Multiple repository operations within one use case can become inconsistent without coordinated commit/rollback boundaries.", "metadata": {"tags": ["design-pattern", "application", "unit-of-work", "problem"], "source": "design-patterns/glossary.json"}}, {"id": "cfe6232b8bda", "title": "Trade-off: Unit of Work", "body": "**Benefit**: Ensures consistency within a transaction and simplifies commit coordination.\n\n**Cost**: Adds complexity and can be awkward across distributed systems or microservice boundaries.", "metadata": {"tags": ["design-pattern", "application", "unit-of-work", "tradeoff"], "source": "design-patterns/glossary.json"}}, {"id": "60faf8c453f1", "title": "Q1: Unit of Work primarily manages:", "body": "A. UI rendering state\nB. A transactional boundary and tracked changes\nC. HTTP routing tables\nD. Container orchestration\n\n**B.** It coordinates what must be committed or rolled back as one unit.", "metadata": {"tags": ["design-pattern", "application", "unit-of-work", "question"], "source": "design-patterns/glossary.json"}}, {"id": "f7a72b2a45de", "title": "Q2: Across microservices with separate databases, Unit of Work a", "body": "A. Provides global ACID transactions automatically\nB. Is limited to local boundaries; sagas/compensation are needed for cross-service consistency\nC. Replaces idempotent consumers\nD. Eliminates eventual consistency\n\n**B.** Distributed systems require additional coordination patterns beyond a local unit of work.", "metadata": {"tags": ["design-pattern", "application", "unit-of-work", "question"], "source": "design-patterns/glossary.json"}}, {"id": "c5688c1c4eef", "title": "Intent: Visitor", "body": "Represent an operation to be performed on elements of an object structure without changing the element classes.", "metadata": {"tags": ["design-pattern", "behavioral", "visitor", "intent"], "source": "design-patterns/glossary.json"}}, {"id": "5e6072738deb", "title": "Use Visitor when", "body": "Adding new operations across a stable set of element types leads to repeated edits and scattered logic in those classes.", "metadata": {"tags": ["design-pattern", "behavioral", "visitor", "problem"], "source": "design-patterns/glossary.json"}}, {"id": "7b2ac3e53558", "title": "Trade-off: Visitor", "body": "**Benefit**: Makes adding new operations easy and keeps operation-specific logic cohesive.\n\n**Cost**: Adding new element types requires changing every visitor.", "metadata": {"tags": ["design-pattern", "behavioral", "visitor", "tradeoff"], "source": "design-patterns/glossary.json"}}, {"id": "55286038b551", "title": "Q1: Visitor is a good fit when:", "body": "A. Element types change frequently but operations are fixed\nB. Element structure is stable and new operations are added often\nC. You need to share intrinsic state\nD. You need runtime service discovery\n\n**B.** It optimizes for adding operations across a stable set of elements.", "metadata": {"tags": ["design-pattern", "behavioral", "visitor", "question"], "source": "design-patterns/glossary.json"}}, {"id": "e8140283aeba", "title": "Q2: A major cost of Visitor is:", "body": "A. No way to group operation logic\nB. Adding a new element type forces updates to all visitors\nC. It cannot traverse structures\nD. It requires global variables\n\n**B.** The visitor interface mirrors the element hierarchy.", "metadata": {"tags": ["design-pattern", "behavioral", "visitor", "question"], "source": "design-patterns/glossary.json"}}, {"id": "9e0b49fb4581", "title": "Concept: Halfway Escape Optimization", "body": "A quantum-inspired metaheuristic whose move rule lets candidates leave a local region before settling.", "metadata": {"tags": ["2405.02850v7", "concept"], "source": "papers/2405.02850v7/glossary.json"}}, {"id": "8d1ed29fdaaa", "title": "Concept: Tunnelling metaphor", "body": "The quantum-inspired escape idea that lets a candidate cross a barrier instead of only climbing downhill.", "metadata": {"tags": ["2405.02850v7", "concept"], "source": "papers/2405.02850v7/glossary.json"}}, {"id": "4237d2d87f8a", "title": "Concept: Benchmark suite", "body": "Fourteen general optimization functions evaluated at dimension thirty to compare search behaviour.", "metadata": {"tags": ["2405.02850v7", "concept"], "source": "papers/2405.02850v7/glossary.json"}}, {"id": "66936830a077", "title": "Concept: Established optimizers", "body": "PSO, GA, AFSA, GWO, and QPSO, used as comparison points for the new method.", "metadata": {"tags": ["2405.02850v7", "concept"], "source": "papers/2405.02850v7/glossary.json"}}, {"id": "76f9780ca2bd", "title": "Concept: Constrained design problems", "body": "Pressure-vessel and tubular-column design tasks used to test feasibility beyond synthetic functions.", "metadata": {"tags": ["2405.02850v7", "concept"], "source": "papers/2405.02850v7/glossary.json"}}, {"id": "b7d6fd35fd1e", "title": "Claim: Benchmark evaluation", "body": "Halfway Escape Optimization is reported competitive with five established optimizers on fourteen benchmark functions at dimension thirty.", "metadata": {"tags": ["2405.02850v7", "claim"], "source": "papers/2405.02850v7/glossary.json"}}, {"id": "bdf98539b43d", "title": "Claim: Applications", "body": "The paper reports feasible engineering designs and higher accuracy on the Osmancik-97 and Cammeo rice classification tasks.", "metadata": {"tags": ["2405.02850v7", "claim"], "source": "papers/2405.02850v7/glossary.json"}}, {"id": "a1624034255a", "title": "Concept: Travelling-salesman tour", "body": "A combinatorial problem that asks for the shortest cycle visiting each city once and returning to the start.", "metadata": {"tags": ["2409.13788v1", "concept"], "source": "papers/2409.13788v1/glossary.json"}}, {"id": "4ead912ae0c1", "title": "Concept: Quantum-inspired genetic algorithm", "body": "A population search that borrows quantum state and gate metaphors to encode and update candidate tours.", "metadata": {"tags": ["2409.13788v1", "concept"], "source": "papers/2409.13788v1/glossary.json"}}, {"id": "1a13ae675a17", "title": "Concept: Classical genetic algorithm", "body": "A population heuristic using selection, crossover, and mutation to improve candidate tours.", "metadata": {"tags": ["2409.13788v1", "concept"], "source": "papers/2409.13788v1/glossary.json"}}, {"id": "1ae9acdf5a14", "title": "Concept: TSPLIB benchmarks", "body": "A standard library of tour instances used to compare algorithms across sizes and structures.", "metadata": {"tags": ["2409.13788v1", "concept"], "source": "papers/2409.13788v1/glossary.json"}}, {"id": "e3681f06ff5a", "title": "Concept: Rotation-angle tuning", "body": "The gate angle that controls how candidates change; the paper identifies it as a key tuning burden.", "metadata": {"tags": ["2409.13788v1", "concept"], "source": "papers/2409.13788v1/glossary.json"}}, {"id": "7f9ca71dbba6", "title": "Claim: Experiments", "body": "On the tested TSPLIB instances, the classical genetic algorithm usually converged to better tours faster than the quantum-inspired variant.", "metadata": {"tags": ["2409.13788v1", "claim"], "source": "papers/2409.13788v1/glossary.json"}}, {"id": "c6a516ff4832", "title": "Claim: Limitations", "body": "The quantum-inspired results come from simulation; no real quantum hardware was evaluated.", "metadata": {"tags": ["2409.13788v1", "claim"], "source": "papers/2409.13788v1/glossary.json"}}, {"id": "f37340d96371", "title": "Prove: Dynamic array append is amortized O(1)", "body": "A sequence of n appends to a geometrically growing array costs O(n) time in total.\n\nComplexity: O(n) for n appends; O(1) amortized, O(n) worst case for a single resize.", "metadata": {"tags": ["data-structures", "proof", "dynamic-array-amortized", "statement"], "source": "proofs/dynamic-array-amortized/glossary.json"}}, {"id": "b7282b23aacc", "title": "Invariant: Dynamic array append is amortized O(1)", "body": "After every append, capacity is at least length; immediately after a resize, capacity is at most twice length.", "metadata": {"tags": ["data-structures", "proof", "dynamic-array-amortized", "invariant"], "source": "proofs/dynamic-array-amortized/glossary.json"}}, {"id": "86e58335be4d", "title": "Proof step: Base case", "body": "The first append writes one slot into the initial capacity and performs no copy.", "metadata": {"tags": ["data-structures", "proof", "dynamic-array-amortized", "step"], "source": "proofs/dynamic-array-amortized/glossary.json"}}, {"id": "3b461c80400b", "title": "Proof step: Resize points form a geometric series", "body": "Capacity doubles only when length reaches capacity, so resizes happen at lengths 1, 2, 4, 8, and so on.\n\nDepends on: base", "metadata": {"tags": ["data-structures", "proof", "dynamic-array-amortized", "step"], "source": "proofs/dynamic-array-amortized/glossary.json"}}, {"id": "b4220dbe4392", "title": "Proof step: Total copy work is bounded", "body": "Across all resizes the array copies at most 1 + 2 + 4 + ... + n slots, which is less than 2n.\n\nDepends on: doubling", "metadata": {"tags": ["data-structures", "proof", "dynamic-array-amortized", "step"], "source": "proofs/dynamic-array-amortized/glossary.json"}}, {"id": "81be90459e46", "title": "Proof step: Add writes and copies", "body": "n appends perform n writes and fewer than 2n copies, so the sequence is linear and each append is O(1) on average.\n\nDepends on: copies", "metadata": {"tags": ["data-structures", "proof", "dynamic-array-amortized", "step"], "source": "proofs/dynamic-array-amortized/glossary.json"}}, {"id": "192555af0031", "title": "Prove: Bottom-up heapify is linear", "body": "Constructing a binary heap by calling sift-down from the last internal node to the root takes O(n) time.\n\nComplexity: O(n) time and O(1) extra space, versus O(n log n) for repeated insertion.", "metadata": {"tags": ["data-structures", "proof", "heapify-linear", "statement"], "source": "proofs/heapify-linear/glossary.json"}}, {"id": "6835d3027f21", "title": "Invariant: Bottom-up heapify is linear", "body": "Before node i is processed, every subtree rooted at an index greater than i is already a valid heap.", "metadata": {"tags": ["data-structures", "proof", "heapify-linear", "invariant"], "source": "proofs/heapify-linear/glossary.json"}}, {"id": "d9fa625eef9c", "title": "Proof step: Leaves are heaps", "body": "Nodes with no children already satisfy the heap property, so processing can start at the last parent.", "metadata": {"tags": ["data-structures", "proof", "heapify-linear", "step"], "source": "proofs/heapify-linear/glossary.json"}}, {"id": "8b852901f8d9", "title": "Proof step: Process internal nodes bottom-up", "body": "Walking from the last parent down to the root guarantees each child subtree is a heap before its parent is fixed.\n\nDepends on: leaves", "metadata": {"tags": ["data-structures", "proof", "heapify-linear", "step"], "source": "proofs/heapify-linear/glossary.json"}}, {"id": "60de0299c55e", "title": "Proof step: Cost depends on height", "body": "A node at height h moves at most h levels, and a binary heap has at most ceil(n / 2^(h+1)) nodes at height h.\n\nDepends on: reverse", "metadata": {"tags": ["data-structures", "proof", "heapify-linear", "step"], "source": "proofs/heapify-linear/glossary.json"}}, {"id": "8c0e6207ef2b", "title": "Proof step: Bound the weighted sum", "body": "The sum over heights of h * n / 2^(h+1) is at most n, because the series sum h / 2^h converges to 2.\n\nDepends on: height-cost", "metadata": {"tags": ["data-structures", "proof", "heapify-linear", "step"], "source": "proofs/heapify-linear/glossary.json"}}, {"id": "ba179a799948", "title": "Prove: Sliding window moves each pointer at most n times", "body": "A sliding window over an array of n elements runs in O(n) time when each pointer only moves forward.\n\nComplexity: O(n) time, O(1) extra space.", "metadata": {"tags": ["data-structures", "proof", "sliding-window-linear", "statement"], "source": "proofs/sliding-window-linear/glossary.json"}}, {"id": "de524b1db297", "title": "Invariant: Sliding window moves each pointer at most n times", "body": "At the start of every iteration the half-open interval [left, right) is the current window and right is one past the last inspected element.", "metadata": {"tags": ["data-structures", "proof", "sliding-window-linear", "invariant"], "source": "proofs/sliding-window-linear/glossary.json"}}, {"id": "edc7deb7a793", "title": "Proof step: Empty window", "body": "Set left = right = 0. The window is empty and the invariant holds before any input is consumed.", "metadata": {"tags": ["data-structures", "proof", "sliding-window-linear", "step"], "source": "proofs/sliding-window-linear/glossary.json"}}, {"id": "5c560f703266", "title": "Proof step: Right pointer only advances", "body": "Each iteration admits at most one new element by increasing right, so right advances at most n times.\n\nDepends on: init", "metadata": {"tags": ["data-structures", "proof", "sliding-window-linear", "step"], "source": "proofs/sliding-window-linear/glossary.json"}}, {"id": "34711c572519", "title": "Proof step: Left pointer only advances", "body": "Invalid windows are repaired by increasing left; it never decreases, so left also advances at most n times.\n\nDepends on: init", "metadata": {"tags": ["data-structures", "proof", "sliding-window-linear", "step"], "source": "proofs/sliding-window-linear/glossary.json"}}, {"id": "b8853299f83d", "title": "Proof step: Sum the pointer moves", "body": "At most n expansions plus at most n shrink steps gives O(n) total work, with O(1) extra space.\n\nDepends on: expand, shrink", "metadata": {"tags": ["data-structures", "proof", "sliding-window-linear", "step"], "source": "proofs/sliding-window-linear/glossary.json"}}, {"id": "289412dfd1ce", "title": "Provider map: Event-driven processing", "body": "**aws**: SQS queue with dead-letter queue + AWS Lambda + DynamoDB\n**azure**: Azure Storage Queues with poison queue + Azure Functions + Table Storage\n**gcp**: Pub/Sub topic with dead-letter topic + Cloud Functions + Firestore", "metadata": {"tags": ["provider", "event-driven", "mapping"], "source": "providers/glossary.json"}}, {"id": "064366db24c5", "title": "Event-driven processing on AWS", "body": "SQS queue with dead-letter queue + AWS Lambda + DynamoDB\n\n**Plan only**: `terraform/aws/event-driven`\n\n**Watch out**: The event source mapping and redrive policy reference ARNs; verify both resolve in the plan without live state.", "metadata": {"tags": ["provider", "event-driven", "aws"], "source": "providers/glossary.json"}}, {"id": "6853dc985188", "title": "Event-driven processing on AZURE", "body": "Azure Storage Queues with poison queue + Azure Functions + Table Storage\n\n**Plan only**: `terraform/azure/event-driven`\n\n**Watch out**: Storage Queue and Table names must be lowercase, and Function App names are globally unique.", "metadata": {"tags": ["provider", "event-driven", "azure"], "source": "providers/glossary.json"}}, {"id": "5c3657574f3b", "title": "Event-driven processing on GCP", "body": "Pub/Sub topic with dead-letter topic + Cloud Functions + Firestore\n\n**Plan only**: `terraform/gcp/event-driven`\n\n**Watch out**: Dead-letter policies need a topic id and delivery attempt count; keep the trigger and subscription on the same project.", "metadata": {"tags": ["provider", "event-driven", "gcp"], "source": "providers/glossary.json"}}, {"id": "b40b1e03295a", "title": "Q1: What does a dead-letter destination provide in an event-driv", "body": "A. It caches successful responses for faster reads\nB. It isolates messages that repeatedly fail processing\nC. It replaces the queue when traffic spikes\nD. It encrypts the topic at rest\n\n**B.** A dead-letter queue or topic captures poison messages after a retry limit so the main stream keeps flowing.", "metadata": {"tags": ["provider", "event-driven", "question"], "source": "providers/glossary.json"}}, {"id": "918001739bdf", "title": "Q2: Which combination models the event-driven pattern across all", "body": "A. Queue or topic, consumer function, and dead-letter or storage\nB. API gateway, function, and relational database\nC. Load balancer, virtual machine, and block storage\nD. CDN, static files, and DNS record\n\n**A.** Each provider fixture names a queue or topic, a function to consume events, and a dead-letter destination plus state storage.", "metadata": {"tags": ["provider", "event-driven", "question"], "source": "providers/glossary.json"}}, {"id": "0158e6311252", "title": "Provider map: Serverless API", "body": "**aws**: API Gateway HTTP API + AWS Lambda + DynamoDB\n**azure**: API Management + Azure Functions + Table Storage\n**gcp**: Cloud Run endpoint + Cloud Functions + Firestore", "metadata": {"tags": ["provider", "serverless-api", "mapping"], "source": "providers/glossary.json"}}, {"id": "51fe48a38f76", "title": "Serverless API on AWS", "body": "API Gateway HTTP API + AWS Lambda + DynamoDB\n\n**Plan only**: `terraform/aws/serverless-api`\n\n**Watch out**: Lambda invoke permissions and integration URIs are easy to miswire; check the API Gateway source ARN in the plan.", "metadata": {"tags": ["provider", "serverless-api", "aws"], "source": "providers/glossary.json"}}, {"id": "8af4e7e5bb03", "title": "Serverless API on AZURE", "body": "API Management + Azure Functions + Table Storage\n\n**Plan only**: `terraform/azure/serverless-api`\n\n**Watch out**: Function App and Storage Account names are globally unique, and API Management needs publisher details even in a plan.", "metadata": {"tags": ["provider", "serverless-api", "azure"], "source": "providers/glossary.json"}}, {"id": "4bf595d47e4d", "title": "Serverless API on GCP", "body": "Cloud Run endpoint + Cloud Functions + Firestore\n\n**Plan only**: `terraform/gcp/serverless-api`\n\n**Watch out**: Cloud Functions needs a runtime, entry point, and source location at plan time; supply placeholders, never credentials.", "metadata": {"tags": ["provider", "serverless-api", "gcp"], "source": "providers/glossary.json"}}, {"id": "62ef43ab0164", "title": "Q1: What is the provider-neutral core of the serverless API patt", "body": "A. A long-running VM behind a load balancer\nB. An HTTP endpoint, a stateless function, and a managed store\nC. A message queue with a dead-letter queue\nD. A container orchestrator with persistent volumes\n\n**B.** The pattern is an endpoint that routes to a stateless handler which persists to a managed table or document store.", "metadata": {"tags": ["provider", "serverless-api", "question"], "source": "providers/glossary.json"}}, {"id": "d9fba3ae8a1a", "title": "Q2: Why do the Terraform fixtures use placeholder project names ", "body": "A. To make terraform apply succeed without a budget\nB. To satisfy emulator authentication\nC. To allow terraform plan without live state or credentials\nD. To enable automatic provider upgrades\n\n**C.** Placeholders keep the fixtures cost-free and offline; plan can resolve schema and references without contacting a provider.", "metadata": {"tags": ["provider", "serverless-api", "question"], "source": "providers/glossary.json"}}, {"id": "34621d26fdc2", "title": "Claim: contract-tests-prevent-api-misalignment", "body": "Contract tests verify that both client and server agree on API format before integration.", "metadata": {"tags": ["contract-testing", "claim"], "source": "testing/contract-testing/glossary.json"}}, {"id": "3c3090e0b290", "title": "Claim: consumer-driven-contracts-empower-clients", "body": "Consumer-driven contracts let clients define their needs; providers implement to meet them.", "metadata": {"tags": ["contract-testing", "claim"], "source": "testing/contract-testing/glossary.json"}}, {"id": "3ff539e8e0dc", "title": "Claim: contract-tests-are-faster-than-e2e-tests", "body": "Contract tests don't require full service startup; they're faster than end-to-end tests and provide quicker feedback.", "metadata": {"tags": ["contract-testing", "claim"], "source": "testing/contract-testing/glossary.json"}}, {"id": "829089876de8", "title": "Claim: schema-validation-enforces-contracts-without-pact", "body": "JSON Schema, OpenAPI, and GraphQL schemas enforce contracts; tests validate requests and responses.", "metadata": {"tags": ["contract-testing", "claim"], "source": "testing/contract-testing/glossary.json"}}, {"id": "50c2fa382d29", "title": "Claim: contract-tests-in-ci-prevent-breaking-changes", "body": "Contract tests fail when an API change breaks compatibility, preventing merges and catching issues early.", "metadata": {"tags": ["contract-testing", "claim"], "source": "testing/contract-testing/glossary.json"}}, {"id": "a43c2334b1ff", "title": "Complexity: consumer-driven contract test (client expectations)", "body": "**O(1) milliseconds**\n\nno service calls; validates against schema", "metadata": {"tags": ["contract-testing", "complexity"], "source": "testing/contract-testing/glossary.json"}}, {"id": "cfd03b7b1adc", "title": "Complexity: provider contract test (server behavior)", "body": "**O(n) where n is number of scenarios**\n\nserver must respond to all expected requests", "metadata": {"tags": ["contract-testing", "complexity"], "source": "testing/contract-testing/glossary.json"}}, {"id": "c6f62e2738f8", "title": "Complexity: schema validation (request or response)", "body": "**O(n) where n is schema depth**\n\nlinear in schema complexity", "metadata": {"tags": ["contract-testing", "complexity"], "source": "testing/contract-testing/glossary.json"}}, {"id": "9d33a7221db9", "title": "Complexity: end-to-end test (full client + server interaction)", "body": "**O(n) seconds**\n\nslower than contract tests; full startup and teardown", "metadata": {"tags": ["contract-testing", "complexity"], "source": "testing/contract-testing/glossary.json"}}, {"id": "99376ed29d9e", "title": "Complexity: contract test in CI with multiple consumers", "body": "**O(n*m) where n is consumers, m is scenarios per consumer**\n\nparallelizable; each consumer's tests run independently", "metadata": {"tags": ["contract-testing", "complexity"], "source": "testing/contract-testing/glossary.json"}}, {"id": "ded0516fbba2", "title": "Q1: What is a consumer-driven contract?", "body": "A. A contract where the server defines all the rules and the client must obey\nB. A contract where the client defines expectations and the server implements to meet them\nC. A contract that is agreed upon after integration issues occur\nD. A contract that only applies to external APIs\n\n**B.** Consumer-driven contracts empower clients to define their needs; providers implement to satisfy the contract.", "metadata": {"tags": ["contract-testing", "question"], "source": "testing/contract-testing/glossary.json"}}, {"id": "a8b6f25d81c7", "title": "Q2: How do contract tests differ from end-to-end tests?", "body": "A. Contract tests are slower because they test the entire system\nB. Contract tests are faster because they focus on API format, not full system behavior\nC. Contract tests require a running server; end-to-end tests do not\nD. Contract tests and end-to-end tests are the same thing\n\n**B.** Contract tests validate API format without requiring full service startup. They're faster than end-to-end tests and provide quicker feedback.", "metadata": {"tags": ["contract-testing", "question"], "source": "testing/contract-testing/glossary.json"}}, {"id": "8ebfdfeedbc4", "title": "Q3: What does jsonschema.validate(response, schema) do?", "body": "A. It sends a request to verify the server is running\nB. It checks that the response matches the expected schema (required fields, types)\nC. It converts the response to a different format\nD. It compresses the response for storage\n\n**B.** jsonschema.validate checks that the response conforms to the schema: required fields are present, types are correct, and no extra fields violate constraints.", "metadata": {"tags": ["contract-testing", "question"], "source": "testing/contract-testing/glossary.json"}}, {"id": "d4cbd913b41f", "title": "Q4: Why should contract tests run in CI?", "body": "A. To slow down the build and catch fewer bugs\nB. To catch breaking changes before merging, preventing integration failures\nC. To replace all unit and integration tests\nD. To verify that the code is fast enough\n\n**B.** Contract tests in CI fail when an API change breaks compatibility, preventing merges and catching issues early before they reach production.", "metadata": {"tags": ["contract-testing", "question"], "source": "testing/contract-testing/glossary.json"}}, {"id": "36381113d67c", "title": "Q5: What should happen if a provider contract test fails?", "body": "A. Ignore the failure and merge anyway\nB. Fix the implementation to satisfy the contract, or update the contract if intentional\nC. Always update the contract to match the implementation\nD. Delete the contract test\n\n**B.** A failing provider contract means the implementation doesn't meet the contract. Either fix the implementation or intentionally update the contract (and notify clients).", "metadata": {"tags": ["contract-testing", "question"], "source": "testing/contract-testing/glossary.json"}}, {"id": "5a8c2216dd59", "title": "1. Define API contract between client and server", "body": "**Pattern**: consumer-driven contract: client defines expectations, server implements\n\n**Why**: Formal contracts prevent misalignment; both sides validate against the contract before integrating.\n\n**Python**: `Pact CLI or jsonschema`", "metadata": {"tags": ["contract-testing", "problem"], "source": "testing/contract-testing/glossary.json"}}, {"id": "cea780582db9", "title": "2. Validate API request against schema before sending", "body": "**Pattern**: validate request before making HTTP call\n\n**Why**: Catching schema violations early saves time debugging invalid requests.\n\n**Python**: `jsonschema.validate(request, schema)`", "metadata": {"tags": ["contract-testing", "problem"], "source": "testing/contract-testing/glossary.json"}}, {"id": "ebb7c2cb5a16", "title": "3. Validate API response against schema after receiving", "body": "**Pattern**: validate response after receiving HTTP response\n\n**Why**: Mismatched responses are caught immediately, not silently processed as wrong data.\n\n**Python**: `jsonschema.validate(response, schema)`", "metadata": {"tags": ["contract-testing", "problem"], "source": "testing/contract-testing/glossary.json"}}, {"id": "32472f4e8e62", "title": "4. Test that error responses match the contract (error format, status code)", "body": "**Pattern**: send invalid request, assert error status and error message format\n\n**Why**: Clients rely on error format and codes; contracts ensure consistency.\n\n**Python**: `pytest with assertions on response status and body`", "metadata": {"tags": ["contract-testing", "problem"], "source": "testing/contract-testing/glossary.json"}}, {"id": "6d5c6a9fd92d", "title": "5. Prevent API breaking changes in CI", "body": "**Pattern**: run contract tests for main and PR; fail if contract is violated\n\n**Why**: Catching breaking changes before merge prevents integration failures and reduces incidents.\n\n**Python**: `CI integration with pytest`", "metadata": {"tags": ["contract-testing", "problem"], "source": "testing/contract-testing/glossary.json"}}, {"id": "23533f7a0eaa", "title": "Signal: API client and server agree on request/response format befor", "body": "**Structure**: consumer-driven contract (Pact) or schema validation (JSON Schema, OpenAPI)\n\n**Requirement**: Prevent breaking changes; catch misalignment early\n\n**Python**: `jsonschema for schema validation; Pact for formal contracts`\n\n**Example**: verify that GET /api/health returns {status: 'ok'} and status 200", "metadata": {"tags": ["contract-testing", "signal"], "source": "testing/contract-testing/glossary.json"}}, {"id": "e4aecc81c0f5", "title": "Signal: Prevent API breaking changes in CI before merging", "body": "**Structure**: contract test in CI; run against main branch and PR branch\n\n**Requirement**: Fail the contract test if API changes incompatibly\n\n**Python**: `pytest with contract assertions; Pact broker for distributed contracts`\n\n**Example**: contract test fails if response schema changes", "metadata": {"tags": ["contract-testing", "signal"], "source": "testing/contract-testing/glossary.json"}}, {"id": "b856475825ba", "title": "Signal: Validate that a request matches the API schema before sendin", "body": "**Structure**: JSON Schema validation on request construction\n\n**Requirement**: O(1) per request; fail fast if schema is violated\n\n**Python**: `jsonschema.validate(request, request_schema)`\n\n**Example**: verify request body has required fields and correct types", "metadata": {"tags": ["contract-testing", "signal"], "source": "testing/contract-testing/glossary.json"}}, {"id": "0375cabdd78f", "title": "Signal: Validate that a response matches the expected schema after r", "body": "**Structure**: JSON Schema validation on response processing\n\n**Requirement**: O(1) per response; fail fast if schema is violated\n\n**Python**: `jsonschema.validate(response, response_schema)`\n\n**Example**: verify response has status, data, and optional error fields", "metadata": {"tags": ["contract-testing", "signal"], "source": "testing/contract-testing/glossary.json"}}, {"id": "ce5efa0ce5f6", "title": "Signal: Test error scenarios: client sends invalid input, server ret", "body": "**Structure**: contract test with error scenarios\n\n**Requirement**: Both sides agree on error format and status codes\n\n**Python**: `pytest with error assertions; schema validation on error response`\n\n**Example**: verify that POST /api/item with missing 'name' returns 400 {error: 'name required'}", "metadata": {"tags": ["contract-testing", "signal"], "source": "testing/contract-testing/glossary.json"}}, {"id": "419e74783cd0", "title": "Claim: integration-tests-verify-component-interactions", "body": "Integration tests verify that components work together correctly across service boundaries.", "metadata": {"tags": ["integration-testing", "claim"], "source": "testing/integration-testing/glossary.json"}}, {"id": "cddac5eadd2f", "title": "Claim: integration-tests-are-slower-but-more-realistic", "body": "Integration tests may hit real databases or local services, so they run slower than unit tests but catch more real-world issues.", "metadata": {"tags": ["integration-testing", "claim"], "source": "testing/integration-testing/glossary.json"}}, {"id": "c7cf2dfc9d7f", "title": "Claim: fixture-scope-balances-speed-and-isolation", "body": "Function-scoped fixtures ensure isolation; session-scoped fixtures reuse expensive setup. Choose the right scope for your trade-off.", "metadata": {"tags": ["integration-testing", "claim"], "source": "testing/integration-testing/glossary.json"}}, {"id": "f17c60690631", "title": "Claim: transaction-rollback-keeps-db-clean", "body": "Tests that use a database can wrap in transactions that roll back, so the database is clean for the next test.", "metadata": {"tags": ["integration-testing", "claim"], "source": "testing/integration-testing/glossary.json"}}, {"id": "a718e0f8e0b1", "title": "Claim: contract-tests-prevent-api-misalignment", "body": "Contract tests verify both client and server agree on request/response format, preventing integration breaks.", "metadata": {"tags": ["integration-testing", "claim"], "source": "testing/integration-testing/glossary.json"}}, {"id": "71a7af1582f2", "title": "Complexity: integration test (real database, transaction rollback)", "body": "**O(n) milliseconds to seconds, depends on database operations**\n\nmay hit real I/O; slower than unit tests", "metadata": {"tags": ["integration-testing", "complexity"], "source": "testing/integration-testing/glossary.json"}}, {"id": "f6cd2497ae98", "title": "Complexity: session-scoped fixture (database connection, expensive setup)", "body": "**O(1) setup per session; reused across all tests**\n\namortizes expensive setup cost", "metadata": {"tags": ["integration-testing", "complexity"], "source": "testing/integration-testing/glossary.json"}}, {"id": "f10fcd00fb35", "title": "Complexity: module-scoped fixture", "body": "**O(1) setup per module**\n\nfiner granularity than session, coarser than function", "metadata": {"tags": ["integration-testing", "complexity"], "source": "testing/integration-testing/glossary.json"}}, {"id": "c96558f60cb3", "title": "Complexity: function-scoped fixture (cleanup after each test)", "body": "**O(n) where n is number of tests**\n\nmost isolation; all setup/teardown happens per-test", "metadata": {"tags": ["integration-testing", "complexity"], "source": "testing/integration-testing/glossary.json"}}, {"id": "e1b3e7dff13b", "title": "Complexity: contract test (verify request/response schemas)", "body": "**O(1) for each contract assertion**\n\nfast; no external service calls, just schema validation", "metadata": {"tags": ["integration-testing", "complexity"], "source": "testing/integration-testing/glossary.json"}}, {"id": "3554022f4f51", "title": "Complexity: parallel integration tests (pytest-xdist with real database)", "body": "**O(n/p) but limited by database connection pool**\n\nparallelism may be bottlenecked by database access", "metadata": {"tags": ["integration-testing", "complexity"], "source": "testing/integration-testing/glossary.json"}}, {"id": "62c5455bcb79", "title": "Q1: What is the main difference between unit tests and integrati", "body": "A. Unit tests are faster and test components in isolation; integration tests verify interactions between components\nB. Integration tests are always faster because they use mocking\nC. Unit tests require mocking; integration tests never use mocks\nD. Integration tests always use a real database\n\n**A.** Unit tests isolate components; integration tests verify cross-component interactions. Integration tests may use real databases or in-memory replicas.", "metadata": {"tags": ["integration-testing", "question"], "source": "testing/integration-testing/glossary.json"}}, {"id": "f77518119a43", "title": "Q2: What does a session-scoped fixture do?", "body": "A. Runs setup before each test\nB. Runs setup once per test session and reuses it across all tests\nC. Runs setup once per test module\nD. Disables setup and teardown entirely\n\n**B.** Session-scoped fixtures run setup once and reuse the result across all tests in the session. This amortizes expensive setup cost but requires careful cleanup.", "metadata": {"tags": ["integration-testing", "question"], "source": "testing/integration-testing/glossary.json"}}, {"id": "1096c94a28fe", "title": "Q3: How does transaction rollback keep database tests isolated?", "body": "A. It reverts all changes after each test, so the database is clean for the next test\nB. It prevents tests from writing to the database\nC. It duplicates the database for each test\nD. It disables database commits entirely\n\n**A.** A test's writes are wrapped in a transaction that rolls back, leaving the database clean. No explicit cleanup needed; the database is fresh for the next test.", "metadata": {"tags": ["integration-testing", "question"], "source": "testing/integration-testing/glossary.json"}}, {"id": "3732d1696856", "title": "Q4: What is a contract test?", "body": "A. A test that verifies a service conforms to its API contract (request/response format)\nB. A test that always passes\nC. A test that uses mocking instead of real services\nD. A test that runs only on Sundays\n\n**A.** Contract tests verify that both client and server agree on API format (schema, status codes, error messages). Misalignment breaks the contract.", "metadata": {"tags": ["integration-testing", "question"], "source": "testing/integration-testing/glossary.json"}}, {"id": "b05c850b4686", "title": "Q5: Why might you use a module-scoped fixture instead of a sessi", "body": "A. Module scope runs faster because it reuses setup across more tests\nB. Module scope provides finer isolation granularity; setup is shared per module, not per session\nC. Module scope is always slower and should be avoided\nD. Module scope disables cleanup\n\n**B.** Module scope balances speed (reuse setup per module) and isolation (fresh setup for each new module). It's a middle ground between function and session scopes.", "metadata": {"tags": ["integration-testing", "question"], "source": "testing/integration-testing/glossary.json"}}, {"id": "49e6caf30e13", "title": "1. Test interaction between a service and a repository", "body": "**Pattern**: integration fixture with session or module scope; verify service calls repository correctly\n\n**Why**: Unit tests alone don't catch bugs in cross-component interaction; integration tests verify the real integration.\n\n**Python**: `@pytest.fixture with SQLAlchemy or custom repository`", "metadata": {"tags": ["integration-testing", "problem"], "source": "testing/integration-testing/glossary.json"}}, {"id": "0259c0c64c5f", "title": "2. Keep a database clean between tests without manual cleanup", "body": "**Pattern**: session starts transaction before test, rolls back after\n\n**Why**: Explicit cleanup is error-prone; transaction rollback is automatic and keeps tests isolated.\n\n**Python**: `SQLAlchemy session with context manager`", "metadata": {"tags": ["integration-testing", "problem"], "source": "testing/integration-testing/glossary.json"}}, {"id": "bf7b6de0d07c", "title": "3. Verify that an API request/response matches a schema", "body": "**Pattern**: contract test framework (Pact) or manual schema assertions\n\n**Why**: Schema misalignment causes silent failures at runtime; contract tests catch it before integration.\n\n**Python**: `jsonschema, Pact, or custom validation`", "metadata": {"tags": ["integration-testing", "problem"], "source": "testing/integration-testing/glossary.json"}}, {"id": "5aa50dbadb2e", "title": "4. Reuse expensive setup (database connection, service startup) across tests", "body": "**Pattern**: fixture with scope='session' or scope='module' and cleanup in yield\n\n**Why**: Recreating expensive resources for each test slows down the test suite; reuse amortizes the cost.\n\n**Python**: `@pytest.fixture(scope='...')`", "metadata": {"tags": ["integration-testing", "problem"], "source": "testing/integration-testing/glossary.json"}}, {"id": "c821d19a3fb7", "title": "5. Test a multi-step workflow involving multiple services", "body": "**Pattern**: orchestrate service calls in test; verify final state and side effects\n\n**Why**: Unit tests of individual services don't catch orchestration bugs; integration tests verify the whole flow.\n\n**Python**: `pytest with integration fixtures`", "metadata": {"tags": ["integration-testing", "problem"], "source": "testing/integration-testing/glossary.json"}}, {"id": "d6a7db51e350", "title": "Signal: Test interaction between a service and a repository or exter", "body": "**Structure**: real or in-memory database, service layer, integration fixture\n\n**Requirement**: Slower than unit tests, but still deterministic and repeatable\n\n**Python**: `@pytest.fixture(scope='module'), SQLAlchemy session, transaction rollback`\n\n**Example**: test_work_item_dispatch verifies fleet-ops service calls the work-item repository", "metadata": {"tags": ["integration-testing", "signal"], "source": "testing/integration-testing/glossary.json"}}, {"id": "11d5f55820bc", "title": "Signal: Test API contract between client and server (request/respons", "body": "**Structure**: contract test framework (Pact) or manual schema validation\n\n**Requirement**: Both sides must agree on schema; misalignment is a contract violation\n\n**Python**: `pytest with custom assertions on request/response shape`\n\n**Example**: verify that a request to /api/health returns {status: 'ok'}", "metadata": {"tags": ["integration-testing", "signal"], "source": "testing/integration-testing/glossary.json"}}, {"id": "51daea8ca466", "title": "Signal: Database tests that need clean state between tests", "body": "**Structure**: transaction rollback fixture or database reset between tests\n\n**Requirement**: Each test sees a clean database; no test pollution\n\n**Python**: `@pytest.fixture with connection.rollback() or database reset`\n\n**Example**: test_insert_work_item; insert, query, verify, rollback", "metadata": {"tags": ["integration-testing", "signal"], "source": "testing/integration-testing/glossary.json"}}, {"id": "81c94de24758", "title": "Signal: Test a workflow across multiple components (end-to-end orche", "body": "**Structure**: integration test with multiple components in-process or containerized\n\n**Requirement**: Slower but realistic; uses real components where possible\n\n**Python**: `pytest, docker-compose, or local service instances`\n\n**Example**: test_workflow_dispatch_and_queue verifies dispatch creates a queued job", "metadata": {"tags": ["integration-testing", "signal"], "source": "testing/integration-testing/glossary.json"}}, {"id": "50b950d48fb6", "title": "Signal: Reuse expensive setup (database, service startup) across tes", "body": "**Structure**: session or module-scoped fixture with careful teardown\n\n**Requirement**: Balance speed and isolation; minimize setup/teardown overhead\n\n**Python**: `@pytest.fixture(scope='session' or 'module')`\n\n**Example**: session-scoped database connection shared across all integration tests", "metadata": {"tags": ["integration-testing", "signal"], "source": "testing/integration-testing/glossary.json"}}, {"id": "61537f039393", "title": "Claim: fixtures-are-dependency-injection-for-tests", "body": "Fixtures inject dependencies into tests; this makes setup explicit and tests more readable.", "metadata": {"tags": ["test-fixtures", "claim"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "ea14d93495a7", "title": "Claim: conftest-py-shares-fixtures-across-tests", "body": "Fixtures in conftest.py are automatically discovered and available to all tests in that directory and subdirectories.", "metadata": {"tags": ["test-fixtures", "claim"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "2f5391f95160", "title": "Claim: fixture-scope-balances-reuse-and-isolation", "body": "Function scope ensures isolation; module or session scope reuses setup. Choose the right scope for your trade-off.", "metadata": {"tags": ["test-fixtures", "claim"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "af85f2a07bba", "title": "Claim: fixtures-compose-building-complex-environments", "body": "One fixture can depend on another; Pytest resolves the chain and runs setup in order.", "metadata": {"tags": ["test-fixtures", "claim"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "ebbca53d0003", "title": "Claim: yield-in-fixtures-simplifies-cleanup", "body": "Using `yield` in a fixture separates setup and cleanup; code after yield runs after the test.", "metadata": {"tags": ["test-fixtures", "claim"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "6545074e17d5", "title": "Complexity: simple fixture (no dependencies, function scope)", "body": "**O(1) setup, O(1) cleanup per test**\n\nminimal overhead", "metadata": {"tags": ["test-fixtures", "complexity"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "7d4e49571966", "title": "Complexity: session-scoped fixture (reused across all tests)", "body": "**O(1) setup once; O(1) cleanup at end**\n\nexpensive setup amortized across all tests", "metadata": {"tags": ["test-fixtures", "complexity"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "12aebe302bc6", "title": "Complexity: fixture composition (fixture depends on another fixture)", "body": "**O(1) per dependency; resolved in order**\n\ndependency resolution is linear in dependency depth", "metadata": {"tags": ["test-fixtures", "complexity"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "e8a85dc1e4fe", "title": "Complexity: fixture with monkeypatch (patching module globals)", "body": "**O(1) patch, O(1) restore**\n\nrestores patches automatically after test", "metadata": {"tags": ["test-fixtures", "complexity"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "621f69e25c5a", "title": "Complexity: parameterized fixture (@pytest.fixture(params=[...]))", "body": "**O(n) where n is number of parameter values**\n\ntest runs once per parameter value", "metadata": {"tags": ["test-fixtures", "complexity"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "1df9a2f87493", "title": "Q1: What is dependency injection in pytest?", "body": "A. Tests directly instantiate objects and pass them to fixtures\nB. Tests declare parameters matching fixture names; pytest injects the fixtures\nC. Tests import fixtures explicitly from a fixtures module\nD. Tests call a setup function before each test\n\n**B.** Pytest uses the test function's parameter names to match fixtures. If a test has a parameter named 'tmp_path', Pytest injects the built-in tmp_path fixture.", "metadata": {"tags": ["test-fixtures", "question"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "473e5e9f3b9d", "title": "Q2: What is conftest.py?", "body": "A. A configuration file for pytest settings\nB. A pytest file that defines shared fixtures available to all tests in that directory and subdirectories\nC. A test file that runs configuration checks\nD. A file that imports all test modules\n\n**B.** conftest.py is a pytest convention; fixtures defined there are automatically discovered and available to all tests in that directory and subdirectories.", "metadata": {"tags": ["test-fixtures", "question"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "811398843d96", "title": "Q3: How does the `yield` keyword in a fixture work?", "body": "A. It skips the test if the condition is false\nB. It returns a value from the fixture\nC. It separates setup (before yield) from cleanup (after yield)\nD. It makes the fixture run in parallel\n\n**C.** yield separates setup and cleanup in a fixture. Code before yield runs before the test; code after yield runs after the test, even if the test fails.", "metadata": {"tags": ["test-fixtures", "question"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "25516b0a2ab6", "title": "Q4: What does fixture scope control?", "body": "A. Whether the fixture is visible in other test files\nB. When setup runs and when cleanup happens (function, module, session)\nC. How many tests can use the fixture\nD. The order in which tests run\n\n**B.** Fixture scope determines: function-scoped fixtures run before each test; module-scoped fixtures run once per module; session-scoped fixtures run once per session.", "metadata": {"tags": ["test-fixtures", "question"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "8b1fbc4238a0", "title": "Q5: How can a fixture depend on another fixture?", "body": "A. By importing it explicitly\nB. By calling it directly\nC. By declaring the other fixture as a parameter\nD. By registering it in conftest.py\n\n**C.** A fixture can take another fixture as a parameter. Pytest resolves the dependency chain and runs setup in order.", "metadata": {"tags": ["test-fixtures", "question"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "c59947b5e05f", "title": "1. Multiple tests need the same temporary directory", "body": "**Pattern**: test declares tmp_path parameter; pytest injects it\n\n**Why**: Avoids manual tempdir cleanup; pytest manages it. Each test gets a fresh directory.\n\n**Python**: `@pytest.fixture (tmp_path is built-in)`", "metadata": {"tags": ["test-fixtures", "problem"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "f9cbdc9f653a", "title": "2. Setup and cleanup must be coordinated (e.g., start/stop a server)", "body": "**Pattern**: setup before yield; cleanup after yield\n\n**Why**: Cleanup is guaranteed even if the test fails; no manual try/finally needed.\n\n**Python**: `@pytest.fixture with yield`", "metadata": {"tags": ["test-fixtures", "problem"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "7f893cafe651", "title": "3. A fixture depends on another fixture (composition)", "body": "**Pattern**: fixture_a takes fixture_b as parameter\n\n**Why**: Avoids duplication; complex environments built from simple fixtures.\n\n**Python**: `@pytest.fixture, parameter passing`", "metadata": {"tags": ["test-fixtures", "problem"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "2b3a8717dc46", "title": "4. Expensive setup (database) should be reused across tests", "body": "**Pattern**: @pytest.fixture(scope='session' or 'module')\n\n**Why**: Amortizes expensive setup cost; tests run faster.\n\n**Python**: `@pytest.fixture(scope=...)`", "metadata": {"tags": ["test-fixtures", "problem"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "5b4ded04caea", "title": "5. Run the same test with 10 different inputs", "body": "**Pattern**: @pytest.fixture(params=[...]) or @pytest.mark.parametrize(...)\n\n**Why**: DRY: avoid copy-pasting the test 10 times.\n\n**Python**: `@pytest.fixture(params=...) or @pytest.mark.parametrize(...)`", "metadata": {"tags": ["test-fixtures", "problem"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "81bef5ccfcd9", "title": "Signal: Multiple tests need the same resource (database, temporary d", "body": "**Structure**: fixture with @pytest.fixture decorator, injected as test parameter\n\n**Requirement**: DRY: avoid duplicating setup logic in each test\n\n**Python**: `@pytest.fixture, yield for cleanup`\n\n**Example**: all tests need a temporary directory; define tmp_path fixture once", "metadata": {"tags": ["test-fixtures", "signal"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "858c832287c3", "title": "Signal: Setup and cleanup must happen in a specific order", "body": "**Structure**: fixture with `yield` to separate setup and cleanup\n\n**Requirement**: Automatic teardown without explicit cleanup code\n\n**Python**: `def fixture(...): setup_code; yield; cleanup_code`\n\n**Example**: start a server, yield, then stop it", "metadata": {"tags": ["test-fixtures", "signal"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "8bb792af5e6d", "title": "Signal: A test depends on multiple resources (database, mock, config", "body": "**Structure**: fixture takes other fixtures as parameters\n\n**Requirement**: Compose fixtures; avoid deeply nested setup\n\n**Python**: `def fixture_a(fixture_b, fixture_c): ...`\n\n**Example**: a service fixture depends on a database fixture and a config fixture", "metadata": {"tags": ["test-fixtures", "signal"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "b3bb07295fea", "title": "Signal: Expensive setup should be reused across tests (avoid repeati", "body": "**Structure**: session or module-scoped fixture\n\n**Requirement**: Balance speed (reuse) and isolation (fresh state)\n\n**Python**: `@pytest.fixture(scope='module' or 'session')`\n\n**Example**: database connection or service startup, reused across tests", "metadata": {"tags": ["test-fixtures", "signal"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "9707444c6bb1", "title": "Signal: Run the same test with different parameter values", "body": "**Structure**: @pytest.fixture(params=[...]) or @pytest.mark.parametrize\n\n**Requirement**: DRY: avoid copy-pasting the test\n\n**Python**: `@pytest.fixture(params=...) or @pytest.mark.parametrize(...)`\n\n**Example**: test the same function with 5 different input values", "metadata": {"tags": ["test-fixtures", "signal"], "source": "testing/test-fixtures/glossary.json"}}, {"id": "6a9b9f53368f", "title": "Claim: unit-tests-run-fast", "body": "Unit tests on isolated components run in milliseconds, not seconds, because they avoid I/O.", "metadata": {"tags": ["unit-testing", "claim"], "source": "testing/unit-testing/glossary.json"}}, {"id": "2c0b1359d623", "title": "Claim: hermetic-tests-never-touch-external-services", "body": "Hermetic tests mock all external dependencies: databases, networks, file systems, caches.", "metadata": {"tags": ["unit-testing", "claim"], "source": "testing/unit-testing/glossary.json"}}, {"id": "45c04b883976", "title": "Claim: dependency-injection-enables-mocking", "body": "Functions that take dependencies as parameters (not globals) can be tested with mock objects.", "metadata": {"tags": ["unit-testing", "claim"], "source": "testing/unit-testing/glossary.json"}}, {"id": "ccc7654604a5", "title": "Claim: markers-enable-selective-execution", "body": "@pytest.mark.unit and @pytest.mark.integration allow running only a subset of tests before commit.", "metadata": {"tags": ["unit-testing", "claim"], "source": "testing/unit-testing/glossary.json"}}, {"id": "86fbb4b41e3e", "title": "Claim: mocking-is-for-external-io", "body": "Mock external services (HTTP, database, file I/O); test real logic with real domain objects.", "metadata": {"tags": ["unit-testing", "claim"], "source": "testing/unit-testing/glossary.json"}}, {"id": "007cf27a9a24", "title": "Complexity: unit test (mock dependency)", "body": "**O(1) milliseconds**\n\nisolated component, no I/O", "metadata": {"tags": ["unit-testing", "complexity"], "source": "testing/unit-testing/glossary.json"}}, {"id": "a2d1e1fabaf1", "title": "Complexity: unit test setup (fixture with monkeypatch)", "body": "**O(1) setup time**\n\nin-memory fixture; minimal allocation", "metadata": {"tags": ["unit-testing", "complexity"], "source": "testing/unit-testing/glossary.json"}}, {"id": "92185ee43e85", "title": "Complexity: mock assertion (verify call count, args)", "body": "**O(1)**\n\nrecorded in-memory; no I/O", "metadata": {"tags": ["unit-testing", "complexity"], "source": "testing/unit-testing/glossary.json"}}, {"id": "0ece1c14d064", "title": "Complexity: unit test with parametrize (@pytest.mark.parametrize)", "body": "**O(n) for n inputs**\n\nsame test run multiple times; linear in test count", "metadata": {"tags": ["unit-testing", "complexity"], "source": "testing/unit-testing/glossary.json"}}, {"id": "37b25c8029d6", "title": "Complexity: test collection (pytest discovery)", "body": "**O(n) where n is number of test files**\n\nimports all test modules; linear scan", "metadata": {"tags": ["unit-testing", "complexity"], "source": "testing/unit-testing/glossary.json"}}, {"id": "37a94f0d328c", "title": "Complexity: parallel unit tests (pytest-xdist, -n auto)", "body": "**O(n/p) where p is number of processes**\n\nideal speedup if tests are independent", "metadata": {"tags": ["unit-testing", "complexity"], "source": "testing/unit-testing/glossary.json"}}, {"id": "696a2790b3b3", "title": "Q1: Why should unit tests avoid calling external services like d", "body": "A. External services are always slower, so tests must be fast\nB. Tests should be hermetic: deterministic, fast, and runnable in any order or location\nC. External services are not available in the test environment\nD. All of the above\n\n**B.** Hermetic tests are isolated and reproducible. They run in milliseconds, in any order, and don't depend on network or service availability.", "metadata": {"tags": ["unit-testing", "question"], "source": "testing/unit-testing/glossary.json"}}, {"id": "dd1a2ed18d04", "title": "Q2: Which pytest marker should a fast, isolated test declare?", "body": "A. @pytest.mark.integration\nB. @pytest.mark.unit\nC. @pytest.mark.slow\nD. @pytest.mark.skip\n\n**B.** @pytest.mark.unit tags fast, isolated component tests. Markers allow running only unit tests before commit with `pytest -m unit`.", "metadata": {"tags": ["unit-testing", "question"], "source": "testing/unit-testing/glossary.json"}}, {"id": "809663df83e8", "title": "Q3: What does unittest.mock.MagicMock.side_effect do?", "body": "A. Records how many times the mock was called\nB. Defines the return value of the mock\nC. Raises an exception or returns a value when the mock is called\nD. Prevents the mock from being called more than once\n\n**C.** side_effect can be an exception (raises it) or a callable (calls it). This lets tests trigger error paths without raising real errors.", "metadata": {"tags": ["unit-testing", "question"], "source": "testing/unit-testing/glossary.json"}}, {"id": "9b011a519eeb", "title": "Q4: In dependency injection, what is passed to the function bein", "body": "A. The real external service\nB. A mock object that simulates the service\nC. A stub that returns a default value\nD. Both mock and stub objects\n\n**B.** Mocks replace real dependencies in tests, allowing control over inputs and verification of behavior without side effects.", "metadata": {"tags": ["unit-testing", "question"], "source": "testing/unit-testing/glossary.json"}}, {"id": "33c0b8c8c54c", "title": "Q5: What does @pytest.mark.parametrize do?", "body": "A. Skips a test until it passes\nB. Runs a test multiple times with different inputs\nC. Marks a test as slow or expensive\nD. Enables parallel test execution\n\n**B.** Parametrize runs the same test function with different arguments, specified as a list of tuples. This keeps tests DRY.", "metadata": {"tags": ["unit-testing", "question"], "source": "testing/unit-testing/glossary.json"}}, {"id": "892b41f2074a", "title": "1. Isolate a function from a database dependency", "body": "**Pattern**: dependency injection (pass mock as parameter or fixture)\n\n**Why**: A function that queries a database cannot run fast or repeatably. Mock the database to return test data.\n\n**Python**: `unittest.mock.MagicMock or pytest-mock`", "metadata": {"tags": ["unit-testing", "problem"], "source": "testing/unit-testing/glossary.json"}}, {"id": "761eaf013aad", "title": "2. Test error handling without triggering real errors", "body": "**Pattern**: mock.side_effect = ExceptionType() to trigger error paths\n\n**Why**: Testing error paths without actually raising them lets tests run fast and verify both success and failure.\n\n**Python**: `unittest.mock.MagicMock.side_effect`", "metadata": {"tags": ["unit-testing", "problem"], "source": "testing/unit-testing/glossary.json"}}, {"id": "c2a86f6895ea", "title": "3. Verify a function logs the correct message", "body": "**Pattern**: pass mock logger to function; assert mock.assert_called_with(...)\n\n**Why**: Capturing logging without side effects; verify the function called log with the right args.\n\n**Python**: `unittest.mock.patch, pytest-mock, capsys`", "metadata": {"tags": ["unit-testing", "problem"], "source": "testing/unit-testing/glossary.json"}}, {"id": "be9913700fb3", "title": "4. Test a class that depends on an external service", "body": "**Pattern**: constructor injection (pass mock in __init__); mock returns test data\n\n**Why**: Classes that call external APIs must be testable without hitting the network; inject mocks.\n\n**Python**: `unittest.mock.MagicMock, @pytest.fixture`", "metadata": {"tags": ["unit-testing", "problem"], "source": "testing/unit-testing/glossary.json"}}, {"id": "a11296dbfdd8", "title": "5. Run the same test on 10 different inputs", "body": "**Pattern**: @pytest.mark.parametrize with list of (input, expected)\n\n**Why**: Avoids copy-pasting the same test 10 times; DRY principle for test cases.\n\n**Python**: `@pytest.mark.parametrize decorator`", "metadata": {"tags": ["unit-testing", "problem"], "source": "testing/unit-testing/glossary.json"}}, {"id": "2fb75f127597", "title": "Signal: Verify a single function's behavior given various inputs", "body": "**Structure**: function under test + mock dependencies + assertions\n\n**Requirement**: O(1) milliseconds, no external calls\n\n**Python**: `@pytest.fixture, unittest.mock.MagicMock, pytest-mock`\n\n**Example**: test_branch_from_result_whitespace_frozen; verify branch_from_result('   ') is None", "metadata": {"tags": ["unit-testing", "signal"], "source": "testing/unit-testing/glossary.json"}}, {"id": "5462ade3ae65", "title": "Signal: Test a class constructor, field assignment, and simple metho", "body": "**Structure**: instantiate class, set fields, call methods, assert results\n\n**Requirement**: O(1), no I/O or network\n\n**Python**: `@pytest.fixture for object construction, capsys for stdout capture`\n\n**Example**: test_error_initialization; verify FleetError('msg').message == 'msg'", "metadata": {"tags": ["unit-testing", "signal"], "source": "testing/unit-testing/glossary.json"}}, {"id": "79f3fe1ba47a", "title": "Signal: Test error handling and exception messages", "body": "**Structure**: pytest.raises(ExceptionType), assert error details\n\n**Requirement**: O(1), verify exception type and message text\n\n**Python**: `pytest.raises context manager`\n\n**Example**: test_policy_violation_includes_rule_id; verify PolicyViolation('X').rule_id == 'X'", "metadata": {"tags": ["unit-testing", "signal"], "source": "testing/unit-testing/glossary.json"}}, {"id": "87ebe5fec4e8", "title": "Signal: Verify function calls to a mocked dependency (call count, ar", "body": "**Structure**: mock.assert_called_once_with(...) or mock.call_count assertions\n\n**Requirement**: O(1), inspect mock call history\n\n**Python**: `unittest.mock.MagicMock, pytest-mock`\n\n**Example**: verify a logger was called with the correct message", "metadata": {"tags": ["unit-testing", "signal"], "source": "testing/unit-testing/glossary.json"}}, {"id": "48ed90474ad2", "title": "Signal: Run the same test on multiple inputs (parametrize)", "body": "**Structure**: @pytest.mark.parametrize with list of (input, expected) tuples\n\n**Requirement**: O(n) where n is number of inputs, but DRY\n\n**Python**: `@pytest.mark.parametrize decorator`\n\n**Example**: test_json_parse with [('{\"a\":1}', {'a': 1}), ('bad', ValueError)]", "metadata": {"tags": ["unit-testing", "signal"], "source": "testing/unit-testing/glossary.json"}}]}</script>
<script>
(() => {
  const deck = JSON.parse(document.getElementById('deck').textContent);
  const cards = deck.cards;
  const stateKey = 'patterns.cards.v1';
  const state = JSON.parse(localStorage.getItem(stateKey) || '{}');
  const intervals = [1, 3, 7, 14, 30];
  const day = 86400000;
  const el = (id) => document.getElementById(id);
  const tag = el('tag'), dueOnly = el('due'), shuffle = el('shuffle');
  const front = el('front'), back = el('back'), actions = el('actions');
  const status = el('status'), timer = el('timer'), bar = el('bar');
  let queue = [], position = 0, revealed = false, seconds = 1800, ticker = null;

  [...new Set(cards.flatMap(card => card.metadata.tags))].sort().forEach(value => {
    const option = document.createElement('option');
    option.value = value;
    option.textContent = value;
    tag.appendChild(option);
  });

  const isDue = (card) => {
    const record = state[card.id];
    return !record || !record.due || Date.parse(record.due) <= Date.now();
  };

  const grade = (again) => {
    const card = queue[position];
    if (!card) return;
    const record = state[card.id] || {box: 0, seen: 0};
    record.seen += 1;
    record.box = again ? 0 : Math.min(record.box + 1, intervals.length - 1);
    record.due = new Date(Date.now() + (again ? 0 : intervals[record.box] * day)).toISOString();
    state[card.id] = record;
    localStorage.setItem(stateKey, JSON.stringify(state));
    position += 1;
    show();
  };

  const show = () => {
    const card = queue[position];
    back.hidden = true;
    actions.hidden = true;
    if (!card) {
      front.textContent = queue.length ? 'Session complete.' : 'No cards match this filter.';
      back.textContent = '';
      status.textContent = queue.length ? `Reviewed ${position} of ${queue.length}.` : 'Adjust the tag or turn off due-only.';
      bar.style.width = queue.length ? '100%' : '0';
      clearInterval(ticker);
      ticker = null;
      return;
    }
    revealed = false;
    front.textContent = card.title;
    back.textContent = card.body;
    status.textContent = `${position + 1} / ${queue.length} · ${card.metadata.tags.join(' · ')} · ${card.metadata.source}`;
    bar.style.width = `${(position / queue.length) * 100}%`;
  };

  const reveal = () => {
    if (!queue[position] || revealed) return;
    revealed = true;
    back.hidden = false;
    actions.hidden = false;
  };

  el('card').addEventListener('click', reveal);
  el('again').addEventListener('click', () => grade(true));
  el('good').addEventListener('click', () => grade(false));
  el('start').addEventListener('click', () => {
    queue = cards.filter(card => (!tag.value || card.metadata.tags.includes(tag.value)) && (!dueOnly.checked || isDue(card)));
    if (shuffle.checked) {
      for (let i = queue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [queue[i], queue[j]] = [queue[j], queue[i]];
      }
    }
    position = 0;
    seconds = 1800;
    timer.textContent = '30:00';
    clearInterval(ticker);
    ticker = setInterval(() => {
      seconds = Math.max(0, seconds - 1);
      timer.textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
      if (seconds === 0) { clearInterval(ticker); ticker = null; queue = []; show(); }
    }, 1000);
    show();
  });
  document.addEventListener('keydown', event => {
    if (event.code === 'Space') { event.preventDefault(); reveal(); }
    if (event.key === '1' && revealed) grade(true);
    if (event.key === '2' && revealed) grade(false);
  });
  show();
})();
</script>
</body>
</html>
