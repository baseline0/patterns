id: dynamic-array-amortized
title: Dynamic array append is amortized O(1)
family: data-structures
claim_ids:
  - list-append-is-amortized-constant
statement: "A sequence of n appends to a geometrically growing array costs O(n) time in total."
invariant: "After every append, capacity is at least length; immediately after a resize, capacity is at most twice length."
steps:
  - id: base
    label: "Base case"
    detail: "The first append writes one slot into the initial capacity and performs no copy."
  - id: doubling
    label: "Resize points form a geometric series"
    detail: "Capacity doubles only when length reaches capacity, so resizes happen at lengths 1, 2, 4, 8, and so on."
    depends_on: [base]
  - id: copies
    label: "Total copy work is bounded"
    detail: "Across all resizes the array copies at most 1 + 2 + 4 + ... + n slots, which is less than 2n."
    depends_on: [doubling]
  - id: total
    label: "Add writes and copies"
    detail: "n appends perform n writes and fewer than 2n copies, so the sequence is linear and each append is O(1) on average."
    depends_on: [copies]
complexity: "O(n) for n appends; O(1) amortized, O(n) worst case for a single resize."
