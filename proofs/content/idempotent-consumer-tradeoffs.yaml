id: idempotent-consumer-tradeoffs
title: Idempotent consumers trade storage for safe retries
family: architecture
claim_ids:
  - set-membership-beats-list-search
  - dict-lookup-is-constant-time
statement: "Making message consumers idempotent allows at-least-once delivery and retries without duplicate side effects, at the cost of deduplication state, retention policy, and coordination."
invariant: "For a given idempotency key, applying the same operation more than once produces the same externally visible result as applying it once."
steps:
  - id: dedupe-key
    label: "Identify operations uniquely"
    detail: "Each message or request carries a stable idempotency key so repeated deliveries can be recognized as the same logical operation."
  - id: seen-check
    label: "Check-before-apply"
    detail: "The consumer tests whether the key was already processed; constant-time hash lookups or set membership checks avoid linear scans as processed history grows."
    depends_on: [dedupe-key]
  - id: record
    label: "Record effect atomically enough"
    detail: "On first application the consumer persists the result or marks the key seen so subsequent retries take the no-op/return-prior-result path."
    depends_on: [seen-check]
  - id: tradeoff
    label: "Safety gained, state and lifecycle added"
    detail: "Retries become safe under redelivery and crashes, but the system must store, expire, and sometimes distribute dedupe state, and define behavior when keys collide or state is lost."
    depends_on: [record, seen-check]
complexity: "O(1) average deduplication check/record per message plus storage proportional to retained keys; enables correctness under at-least-once delivery."
