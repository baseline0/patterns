default_stages:
  - pre-commit
default_install_hook_types:
  - pre-commit
  - pre-push
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
        - id: trailing-whitespace
          args: [--markdown-linebreak-ext=md]
        - id: end-of-file-fixer
        - id: check-merge-conflict
        - id: check-added-large-files
          args: [--maxkb=1000]
        - id: check-yaml
          args: [--unsafe]
        - id: detect-private-key
  - repo: local
    hooks:
      - id: repo-root-pattern
        name: "[P1] Enforce REPO_ROOT pattern (no .parent outside constants.py)"
        entry: fleet hook --name check-repo-root-pattern
        language: system
        pass_filenames: false
        files: '\.py$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: check-argparse-prohibition
        name: "[P1] No argparse: CLIs use Typer"
        entry: fleet hook --name check-argparse-prohibition
        language: system
        pass_filenames: false
        files: '\.py$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: just-fleet-test
        name: '[P0] Pre-push: just fleet-test (unit tests)'
        entry: env -u VIRTUAL_ENV just fleet-test
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-push
  - repo: local
    hooks:
      - id: fleet-clean-vendored
        name: "[P1] just/fleet-clean.just matches fleet-base (hand edits fail)"
        entry: just check-fleet-clean
        language: system
        pass_filenames: false
        files: '^(just/fleet-clean\.just|justfile)$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: vendored-fleet-commit
        name: "[P1] just/fleet-commit.just matches fleet-base (hand edits fail)"
        entry: just check-fleet-commit
        language: system
        pass_filenames: false
        files: '^(just/fleet-commit\.just|justfile)$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: vendored-repo-push
        name: "[P1] just/repo-push.just matches fleet-base (hand edits fail)"
        entry: just check-repo-push
        language: system
        pass_filenames: false
        files: '^(just/repo-push\.just|justfile)$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: vendored-fleet-checks
        name: "[P1] just/fleet-checks.just matches fleet-base (hand edits fail)"
        entry: just check-fleet-checks
        language: system
        pass_filenames: false
        files: '^(just/fleet-checks\.just|justfile)$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: vendored-fleet-test
        name: "[P1] just/fleet-test.just matches fleet-base (hand edits fail)"
        entry: just check-fleet-test
        language: system
        pass_filenames: false
        files: '^(just/fleet-test\.just|justfile)$'
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: vendored-current
        name: "[P1] vendored just modules are current with the latest fleet-base release (pre-push)"
        entry: uv run --project ../fleet-base python -m fleet_base.vendor_just check --repo .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
