quiz:
- question: 'Adapter primarily addresses:'
  choices:
  - Object creation complexity
  - Interface incompatibility between components
  - Concurrent access control
  - State persistence
  answer: 1
  explanation: It translates one interface into another expected by clients.
- question: 'In a layered architecture, an adapter commonly lives at:'
  choices:
  - The domain core only
  - An integration boundary such as infrastructure/ports
  - The browser UI exclusively
  - The database index layer
  answer: 1
  explanation: Adapters bridge external or legacy systems to internal abstractions at boundaries.
