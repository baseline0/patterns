example: A microservices orchestration layer (09-microservices) can act as a mediator for UI workflows,
  coordinating service calls instead of letting clients chat with every service directly.
related_architecture:
- 09-microservices
- layered
- saga
quiz:
- question: 'Mediator reduces:'
  choices:
  - The need for any interfaces
  - Direct many-to-many dependencies between colleagues
  - All runtime latency
  - Storage requirements
  answer: 1
  explanation: Peers communicate via a central coordinator rather than referencing each other.
- question: 'A warning sign when using Mediator is:'
  choices:
  - Colleagues become too reusable
  - The mediator accumulates most business rules and complexity
  - Handlers become stateless
  - Events become immutable
  answer: 1
  explanation: Centralization helps decoupling but can create a god object if overused.
