id: mediator
name: Mediator
category: behavioral
intent: Centralize complex interactions between related objects in a mediator to reduce direct dependencies.
problem: Many components reference each other directly, creating tangled communication and fragile change
  propagation.
structure: 'ColleagueA <-> Mediator <-> ColleagueB

  Colleagues notify mediator instead of peers

  Mediator coordinates responses'
participants:
- name: Mediator
  role: Defines coordination interface for colleagues.
- name: ConcreteMediator
  role: Encapsulates interaction rules between colleagues.
- name: Colleague
  role: Communicates through the mediator rather than directly with peers.
forces:
- Object interactions are many-to-many and hard to reason about.
- Reuse of components is limited by peer coupling.
- Interaction rules change frequently.
consequences:
  benefit: Reduces coupling between components and localizes collaboration logic.
  cost: Mediator can grow into a complex central controller.
smells_fixed:
- Spaghetti references between peer components
- Change ripple effects across tightly coupled objects
smells_created:
- God-mediator with excessive knowledge
- Hidden workflows centralized in one place
