    why: "DRY: avoid copy-pasting the test 10 times."

quiz:
  - question: "What is dependency injection in pytest?"
    choices:
      - "Tests directly instantiate objects and pass them to fixtures"
      - "Tests declare parameters matching fixture names; pytest injects the fixtures"
      - "Tests import fixtures explicitly from a fixtures module"
      - "Tests call a setup function before each test"
    answer: 1
    explanation: "Pytest uses the test function's parameter names to match fixtures. If a test has a parameter named 'tmp_path', Pytest injects the built-in tmp_path fixture."
  - question: "What is conftest.py?"
    choices:
      - "A configuration file for pytest settings"
      - "A pytest file that defines shared fixtures available to all tests in that directory and subdirectories"
      - "A test file that runs configuration checks"
      - "A file that imports all test modules"
    answer: 1
    explanation: "conftest.py is a pytest convention; fixtures defined there are automatically discovered and available to all tests in that directory and subdirectories."
  - question: "How does the `yield` keyword in a fixture work?"
    choices:
      - "It skips the test if the condition is false"
      - "It returns a value from the fixture"
      - "It separates setup (before yield) from cleanup (after yield)"
      - "It makes the fixture run in parallel"
    answer: 2
    explanation: "yield separates setup and cleanup in a fixture. Code before yield runs before the test; code after yield runs after the test, even if the test fails."
  - question: "What does fixture scope control?"
    choices:
      - "Whether the fixture is visible in other test files"
      - "When setup runs and when cleanup happens (function, module, session)"
      - "How many tests can use the fixture"
      - "The order in which tests run"
    answer: 1
    explanation: "Fixture scope determines: function-scoped fixtures run before each test; module-scoped fixtures run once per module; session-scoped fixtures run once per session."
  - question: "How can a fixture depend on another fixture?"
    choices:
      - "By importing it explicitly"
      - "By calling it directly"
      - "By declaring the other fixture as a parameter"
      - "By registering it in conftest.py"
    answer: 2
    explanation: "A fixture can take another fixture as a parameter. Pytest resolves the dependency chain and runs setup in order."

examples:
  - title: "fleet-base: conftest.py with shared fixtures"
    code: |
      """Shared fixtures for all tests (from fleet-base)."""
      @pytest.fixture
      def settings() -> Callable[..., FleetSettings]:
          def build(settings_class: type[FleetSettings] = FleetSettings, **overrides):
              return _without_process_env(settings_class)(**overrides)
          return build

      def test_settings_from_overrides(settings):
          cfg = settings(api_key="secret")
          assert cfg.api_key == "secret"
      # The settings fixture is defined in conftest.py; all tests can use it by declaring the parameter.
  - title: "pytest: fixture with setup and cleanup (yield)"
    code: |
      """Fixture that starts a resource and cleans it up."""
      @pytest.fixture
      def temp_repo(tmp_path: Path) -> Path:
          repo = tmp_path / "test_repo"
          repo.mkdir()
          (repo / ".git").mkdir()
          yield repo  # Test runs here
          # Cleanup (if needed) happens after yield

      def test_repo_exists(temp_repo):
          assert (temp_repo / ".git").exists()
      # tmp_path is injected; yield provides the repo to the test; cleanup (none here) runs after.
  - title: "fleet-base: fixture composition (one fixture depends on another)"
    code: |
      """Fixture that depends on another fixture."""
      @pytest.fixture
      def isolated_git_env(tmp_path: Path, monkeypatch: pytest.MonkeyPatch) -> Path:
          empty_config = tmp_path / "empty-gitconfig"
          empty_config.write_text("", encoding="utf-8")
          monkeypatch.setenv("GIT_CONFIG_GLOBAL", str(empty_config))
          return empty_config

      def test_git_isolation(isolated_git_env: Path):
          # isolated_git_env depends on tmp_path and monkeypatch
          # Pytest injects them in order, then isolated_git_env
          import subprocess
          result = subprocess.run(['git', 'config', '--global', 'user.name'],
                                  capture_output=True, text=True)
          assert result.stdout.strip() == ''
      # tmp_path and monkeypatch are injected; isolated_git_env is constructed using them.
  - title: "pytest: session-scoped fixture for expensive setup"
    code: |
      """Expensive setup reused across all tests in the session."""
      @pytest.fixture(scope='session')
      def database():
          """Create and migrate database once per session."""
          engine = create_engine("sqlite:///:memory:")
          Base.metadata.create_all(engine)
          yield engine
          engine.dispose()

      def test_first_query(database):
          session = Session(database)
          items = session.query(Item).all()
          assert items == []

      def test_second_query(database):
          # Same database as first test; expensive setup not repeated
          session = Session(database)
          items = session.query(Item).all()
          assert items == []
      # Both tests reuse the same database session, avoiding repeated setup.
  - title: "pytest: parameterized fixture"
    code: |
      """Run a test with different parameter values."""
      @pytest.fixture(params=["value1", "value2", "value3"])
      def param_value(request):
          return request.param

      def test_with_params(param_value):
          assert param_value in ["value1", "value2", "value3"]
      # The test runs three times, once for each parameter value.
  - title: "fleet-base: automatic marker assignment in conftest.py"
    code: |
      """conftest.py hook to automatically assign markers based on directory."""
      def pytest_collection_modifyitems(items: list[pytest.Item]) -> None:
          for item in items:
              path = Path(str(item.fspath)).resolve()
              relative = path.relative_to(TESTS_ROOT.resolve())
              top_level = relative.parts[0] if relative.parts else ""
              marker_name = DIRECTORY_MARKERS.get(top_level)
              if marker_name:
                  item.add_marker(getattr(pytest.mark, marker_name))
      # Conftest.py uses pytest hooks; markers are assigned based on test directory.
