# Test Fixtures: pytest conftest patterns, scope, dependency injection
# Source of truth for test fixtures patterns. Generated outputs built from this file by tools/build.py.

id: test-fixtures
title: "Test fixtures: pytest conftest patterns, scope, and dependency injection"
summary: >
  Pytest fixtures are reusable setup/teardown functions that tests depend on. Fixtures manage resources
  (databases, temporary files, mocks) and provide them to tests via dependency injection. A fixture's scope
  (function, class, module, session) determines when setup runs and cleanup happens. conftest.py is a pytest
  file that defines fixtures shared across tests in a directory and subdirectories. Fixtures compose: one
  fixture can depend on another, building up complex test environments from simple pieces.

mechanics:
  - heading: "Fixtures as dependency injection for tests"
    body: >
      A test declares its dependencies (database, mock service) as function parameters. Pytest matches parameters
      to fixture names and injects them. This decouples test code from setup logic and makes dependencies explicit
      in the test signature.
  - heading: "conftest.py defines shared fixtures"
    body: >
      conftest.py is a pytest convention file where fixtures are defined. Pytest discovers conftest.py files
      in the test directory and parent directories, automatically making fixtures available to all tests.
      This avoids importing fixtures explicitly.
  - heading: "Fixture scope controls setup reuse (function, module, session)"
    body: >
      A function-scoped fixture runs setup before each test and cleanup after. A module-scoped fixture runs
      setup once per module and cleans up after the module. Session-scoped fixtures run once per test session.
      Broader scopes reuse setup (faster) but risk test coupling; narrower scopes ensure isolation.
  - heading: "Fixtures compose: one fixture depends on another"
    body: >
      A fixture can take another fixture as a parameter. Pytest resolves the dependency chain and runs setup
      in order. This builds complex environments from simple pieces and avoids duplication.

claims:
  - id: fixtures-are-dependency-injection-for-tests
    text: "Fixtures inject dependencies into tests; this makes setup explicit and tests more readable."
  - id: conftest-py-shares-fixtures-across-tests
    text: "Fixtures in conftest.py are automatically discovered and available to all tests in that directory and subdirectories."
  - id: fixture-scope-balances-reuse-and-isolation
    text: "Function scope ensures isolation; module or session scope reuses setup. Choose the right scope for your trade-off."
  - id: fixtures-compose-building-complex-environments
    text: "One fixture can depend on another; Pytest resolves the chain and runs setup in order."
  - id: yield-in-fixtures-simplifies-cleanup
    text: "Using `yield` in a fixture separates setup and cleanup; code after yield runs after the test."

complexity:
  - operation: "simple fixture (no dependencies, function scope)"
    time: "O(1) setup, O(1) cleanup per test"
    note: "minimal overhead"
  - operation: "session-scoped fixture (reused across all tests)"
    time: "O(1) setup once; O(1) cleanup at end"
    note: "expensive setup amortized across all tests"
  - operation: "fixture composition (fixture depends on another fixture)"
    time: "O(1) per dependency; resolved in order"
    note: "dependency resolution is linear in dependency depth"
  - operation: "fixture with monkeypatch (patching module globals)"
    time: "O(1) patch, O(1) restore"
    note: "restores patches automatically after test"
  - operation: "parameterized fixture (@pytest.fixture(params=[...]))"
    time: "O(n) where n is number of parameter values"
    note: "test runs once per parameter value"

signals:
  - signal: "Multiple tests need the same resource (database, temporary directory, mock)"
    requirement: "DRY: avoid duplicating setup logic in each test"
    structure: "fixture with @pytest.fixture decorator, injected as test parameter"
    stdlib: "@pytest.fixture, yield for cleanup"
    example: "all tests need a temporary directory; define tmp_path fixture once"
  - signal: "Setup and cleanup must happen in a specific order"
    requirement: "Automatic teardown without explicit cleanup code"
    structure: "fixture with `yield` to separate setup and cleanup"
    stdlib: "def fixture(...): setup_code; yield; cleanup_code"
    example: "start a server, yield, then stop it"
  - signal: "A test depends on multiple resources (database, mock, config)"
    requirement: "Compose fixtures; avoid deeply nested setup"
    structure: "fixture takes other fixtures as parameters"
    stdlib: "def fixture_a(fixture_b, fixture_c): ..."
    example: "a service fixture depends on a database fixture and a config fixture"
  - signal: "Expensive setup should be reused across tests (avoid repeating)"
    requirement: "Balance speed (reuse) and isolation (fresh state)"
    structure: "session or module-scoped fixture"
    stdlib: "@pytest.fixture(scope='module' or 'session')"
    example: "database connection or service startup, reused across tests"
  - signal: "Run the same test with different parameter values"
    requirement: "DRY: avoid copy-pasting the test"
    structure: "@pytest.fixture(params=[...]) or @pytest.mark.parametrize"
    stdlib: "@pytest.fixture(params=...) or @pytest.mark.parametrize(...)"
    example: "test the same function with 5 different input values"

