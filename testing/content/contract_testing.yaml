    why: "Catching breaking changes before merge prevents integration failures and reduces incidents."

quiz:
  - question: "What is a consumer-driven contract?"
    choices:
      - "A contract where the server defines all the rules and the client must obey"
      - "A contract where the client defines expectations and the server implements to meet them"
      - "A contract that is agreed upon after integration issues occur"
      - "A contract that only applies to external APIs"
    answer: 1
    explanation: "Consumer-driven contracts empower clients to define their needs; providers implement to satisfy the contract."
  - question: "How do contract tests differ from end-to-end tests?"
    choices:
      - "Contract tests are slower because they test the entire system"
      - "Contract tests are faster because they focus on API format, not full system behavior"
      - "Contract tests require a running server; end-to-end tests do not"
      - "Contract tests and end-to-end tests are the same thing"
    answer: 1
    explanation: "Contract tests validate API format without requiring full service startup. They're faster than end-to-end tests and provide quicker feedback."
  - question: "What does jsonschema.validate(response, schema) do?"
    choices:
      - "It sends a request to verify the server is running"
      - "It checks that the response matches the expected schema (required fields, types)"
      - "It converts the response to a different format"
      - "It compresses the response for storage"
    answer: 1
    explanation: "jsonschema.validate checks that the response conforms to the schema: required fields are present, types are correct, and no extra fields violate constraints."
  - question: "Why should contract tests run in CI?"
    choices:
      - "To slow down the build and catch fewer bugs"
      - "To catch breaking changes before merging, preventing integration failures"
      - "To replace all unit and integration tests"
      - "To verify that the code is fast enough"
    answer: 1
    explanation: "Contract tests in CI fail when an API change breaks compatibility, preventing merges and catching issues early before they reach production."
  - question: "What should happen if a provider contract test fails?"
    choices:
      - "Ignore the failure and merge anyway"
      - "Fix the implementation to satisfy the contract, or update the contract if intentional"
      - "Always update the contract to match the implementation"
      - "Delete the contract test"
    answer: 1
    explanation: "A failing provider contract means the implementation doesn't meet the contract. Either fix the implementation or intentionally update the contract (and notify clients)."

examples:
  - title: "Consumer-driven contract: Pact definition"
    code: |
      """Consumer-driven contract in Pact format."""
      {
        "interactions": [
          {
            "description": "a request for health status",
            "request": {
              "method": "GET",
              "path": "/healthz"
            },
            "response": {
              "status": 200,
              "body": {
                "status": "ok"
              }
            }
          }
        ]
      }
      # The client expects GET /healthz to return {status: "ok"} with status 200.
      # The server must satisfy this contract.
  - title: "Schema validation: validate request"
    code: |
      """Validate request against JSON Schema before sending."""
      from jsonschema import validate, ValidationError

      request_schema = {
          "type": "object",
          "properties": {
              "name": {"type": "string"},
              "age": {"type": "integer", "minimum": 0}
          },
          "required": ["name"]
      }

      request_data = {"name": "Alice", "age": 30}
      validate(instance=request_data, schema=request_schema)
      # If request_data were {"age": 30}, validation would fail: 'name' is required.
  - title: "Schema validation: validate response"
    code: |
      """Validate response against JSON Schema after receiving."""
      from jsonschema import validate

      response_schema = {
          "type": "object",
          "properties": {
              "id": {"type": "integer"},
              "name": {"type": "string"},
              "status": {"type": "string", "enum": ["active", "inactive"]}
          },
          "required": ["id", "name", "status"]
      }

      response = {"id": 1, "name": "Alice", "status": "active"}
      validate(instance=response, schema=response_schema)
      # If response were {"id": 1, "name": "Alice"}, validation would fail: 'status' is required.
  - title: "Contract test: error response format"
    code: |
      """Test that error responses match the contract."""
      import requests
      from jsonschema import validate

      error_schema = {
          "type": "object",
          "properties": {
              "error": {"type": "string"},
              "code": {"type": "string"}
          },
          "required": ["error", "code"]
      }

      def test_error_response_format():
          response = requests.post("http://localhost:8080/api/item", json={})
          assert response.status_code == 400
          validate(instance=response.json(), schema=error_schema)
      # The contract specifies error format and status code; the test verifies both.
  - title: "OpenAPI schema as contract"
    code: |
      """OpenAPI spec as a contract for API clients and servers."""
      openapi: 3.0.0
      info:
        title: Work Item API
        version: 1.0.0
      paths:
        /api/items:
          get:
            responses:
              200:
                description: List of work items
                content:
                  application/json:
                    schema:
                      type: array
                      items:
                        type: object
                        properties:
                          id: {type: integer}
                          task: {type: string}
                        required: [id, task]
      # The OpenAPI spec defines the contract; both client and server must conform.
  - title: "Contract test CI failure prevents breaking changes"
    code: |
      """Contract test in CI: fails if API changes incompatibly."""
      def test_contract_health_endpoint():
          # This test is part of CI
          response = requests.get("http://localhost:8080/healthz")
          assert response.status_code == 200
          assert response.json() == {"status": "ok"}
      # If a PR changes the response to {"health": "ok"}, the test fails, blocking the merge.
