# Contract Testing: API contracts, consumer-driven contracts
# Source of truth for contract testing patterns. Generated outputs built from this file by tools/build.py.

id: contract-testing
title: "Contract testing: API contracts and consumer-driven contracts"
summary: >
  Contract tests verify that a client and a server agree on the shape and behavior of their API:
  request format, response schema, status codes, and error handling. Consumer-driven contracts start
  with the client's expectations and verify the server meets them. Provider contracts test the server's
  behavior independently. Contract tests prevent integration breaks: when a contract test fails, the
  API has changed in a way that breaks the client. Contract tests are faster than end-to-end tests
  and catch misalignment early.

mechanics:
  - heading: "Consumer-driven contracts: client defines expectations"
    body: >
      The client (consumer) defines what it expects from the server (provider) in a contract file.
      The contract specifies request format, response schema, status codes, and error messages.
      The provider implements to satisfy the contract; both sides validate against it.
  - heading: "Provider contracts: server defines its capabilities"
    body: >
      The provider defines what it guarantees: API version, supported methods, response schemas.
      The provider tests that it meets its contract. When a consumer violates the contract (e.g.,
      sends invalid input), the provider's contract test might not catch it, but the consumer's
      contract test should.
  - heading: "Schema validation as a lightweight contract test"
    body: >
      Without a formal contract framework (like Pact), schema validation can enforce contracts:
      jsonschema, OpenAPI specs, or GraphQL schemas. Tests validate requests against schemas
      before sending and responses after receiving. This catches misalignment faster than
      end-to-end tests.
  - heading: "Contract tests in CI catch breaking changes early"
    body: >
      Contract tests run in CI before merging. If a PR changes the API in a breaking way, the
      contract test fails, preventing the merge. This is faster feedback than waiting for
      end-to-end tests or production issues.

claims:
  - id: contract-tests-prevent-api-misalignment
    text: "Contract tests verify that both client and server agree on API format before integration."
  - id: consumer-driven-contracts-empower-clients
    text: "Consumer-driven contracts let clients define their needs; providers implement to meet them."
  - id: contract-tests-are-faster-than-e2e-tests
    text: "Contract tests don't require full service startup; they're faster than end-to-end tests and provide quicker feedback."
  - id: schema-validation-enforces-contracts-without-pact
    text: "JSON Schema, OpenAPI, and GraphQL schemas enforce contracts; tests validate requests and responses."
  - id: contract-tests-in-ci-prevent-breaking-changes
    text: "Contract tests fail when an API change breaks compatibility, preventing merges and catching issues early."

complexity:
  - operation: "consumer-driven contract test (client expectations)"
    time: "O(1) milliseconds"
    note: "no service calls; validates against schema"
  - operation: "provider contract test (server behavior)"
    time: "O(n) where n is number of scenarios"
    note: "server must respond to all expected requests"
  - operation: "schema validation (request or response)"
    time: "O(n) where n is schema depth"
    note: "linear in schema complexity"
  - operation: "end-to-end test (full client + server interaction)"
    time: "O(n) seconds"
    note: "slower than contract tests; full startup and teardown"
  - operation: "contract test in CI with multiple consumers"
    time: "O(n*m) where n is consumers, m is scenarios per consumer"
    note: "parallelizable; each consumer's tests run independently"

signals:
  - signal: "API client and server agree on request/response format before integration"
    requirement: "Prevent breaking changes; catch misalignment early"
    structure: "consumer-driven contract (Pact) or schema validation (JSON Schema, OpenAPI)"
    stdlib: "jsonschema for schema validation; Pact for formal contracts"
    example: "verify that GET /api/health returns {status: 'ok'} and status 200"
  - signal: "Prevent API breaking changes in CI before merging"
    requirement: "Fail the contract test if API changes incompatibly"
    structure: "contract test in CI; run against main branch and PR branch"
    stdlib: "pytest with contract assertions; Pact broker for distributed contracts"
    example: "contract test fails if response schema changes"
  - signal: "Validate that a request matches the API schema before sending"
    requirement: "O(1) per request; fail fast if schema is violated"
    structure: "JSON Schema validation on request construction"
    stdlib: "jsonschema.validate(request, request_schema)"
    example: "verify request body has required fields and correct types"
  - signal: "Validate that a response matches the expected schema after receiving"
    requirement: "O(1) per response; fail fast if schema is violated"
    structure: "JSON Schema validation on response processing"
    stdlib: "jsonschema.validate(response, response_schema)"
    example: "verify response has status, data, and optional error fields"
  - signal: "Test error scenarios: client sends invalid input, server returns correct error"
    requirement: "Both sides agree on error format and status codes"
    structure: "contract test with error scenarios"
    stdlib: "pytest with error assertions; schema validation on error response"
    example: "verify that POST /api/item with missing 'name' returns 400 {error: 'name required'}"

