# Unit Testing: isolation, hermetic tests, mocking strategy
# Source of truth for unit testing patterns. Generated outputs built from this file by tools/build.py.
# Each claim id needs a check in tests/unit/test_testing_patterns.py.

id: unit-testing
title: "Unit testing: test isolation, hermetic tests, and mocking strategies"
summary: >
  Unit tests verify single functions or classes in isolation, fast and deterministically.
  Hermetic tests are self-contained: they never touch external services, file systems, or databases.
  Mocking replaces dependencies, allowing tests to control inputs and verify behavior. Pytest markers
  (@pytest.mark.unit) organize tests by scope. Fixtures manage setup and teardown, keeping tests DRY.

mechanics:
  - heading: "Isolation through dependency injection"
    body: >
      Tests pass dependencies explicitly: a function takes a database connector as a parameter, and the test passes
      a mock. This breaks coupling and makes behavior testable. Avoid global state; instead, inject or monkeypatch.
  - heading: "Hermetic tests: no external I/O"
    body: >
      Hermetic tests never hit the network, disk, or external services. All I/O is mocked or replaced with in-memory
      stubs. A test should pass or fail the same way in isolation, in parallel, or in a different order.
  - heading: "Mocking libraries: unittest.mock and pytest-mock"
    body: >
      Mock objects replace real dependencies. unittest.mock.MagicMock records calls and returns, pytest-mock wraps it.
      Mocks allow tests to verify behavior without running expensive operations (database commits, HTTP calls).
  - heading: "Markers partition tests by scope and runtime cost"
    body: >
      @pytest.mark.unit tags fast, isolated tests. @pytest.mark.integration tags cross-component tests.
      Markers allow running only unit tests before commit (@pytest -m unit), or integration tests in CI only.

claims:
  - id: unit-tests-run-fast
    text: "Unit tests on isolated components run in milliseconds, not seconds, because they avoid I/O."
  - id: hermetic-tests-never-touch-external-services
    text: "Hermetic tests mock all external dependencies: databases, networks, file systems, caches."
  - id: dependency-injection-enables-mocking
    text: "Functions that take dependencies as parameters (not globals) can be tested with mock objects."
  - id: markers-enable-selective-execution
    text: "@pytest.mark.unit and @pytest.mark.integration allow running only a subset of tests before commit."
  - id: mocking-is-for-external-io
    text: "Mock external services (HTTP, database, file I/O); test real logic with real domain objects."

complexity:
  - operation: "unit test (mock dependency)"
    time: "O(1) milliseconds"
    note: "isolated component, no I/O"
  - operation: "unit test setup (fixture with monkeypatch)"
    time: "O(1) setup time"
    note: "in-memory fixture; minimal allocation"
  - operation: "mock assertion (verify call count, args)"
    time: "O(1)"
    note: "recorded in-memory; no I/O"
  - operation: "unit test with parametrize (@pytest.mark.parametrize)"
    time: "O(n) for n inputs"
    note: "same test run multiple times; linear in test count"
  - operation: "test collection (pytest discovery)"
    time: "O(n) where n is number of test files"
    note: "imports all test modules; linear scan"
  - operation: "parallel unit tests (pytest-xdist, -n auto)"
    time: "O(n/p) where p is number of processes"
    note: "ideal speedup if tests are independent"

signals:
  - signal: "Verify a single function's behavior given various inputs"
    requirement: "O(1) milliseconds, no external calls"
    structure: "function under test + mock dependencies + assertions"
    stdlib: "@pytest.fixture, unittest.mock.MagicMock, pytest-mock"
    example: "test_branch_from_result_whitespace_frozen; verify branch_from_result('   ') is None"
  - signal: "Test a class constructor, field assignment, and simple methods"
    requirement: "O(1), no I/O or network"
    structure: "instantiate class, set fields, call methods, assert results"
    stdlib: "@pytest.fixture for object construction, capsys for stdout capture"
    example: "test_error_initialization; verify FleetError('msg').message == 'msg'"
  - signal: "Test error handling and exception messages"
    requirement: "O(1), verify exception type and message text"
    structure: "pytest.raises(ExceptionType), assert error details"
    stdlib: "pytest.raises context manager"
    example: "test_policy_violation_includes_rule_id; verify PolicyViolation('X').rule_id == 'X'"
  - signal: "Verify function calls to a mocked dependency (call count, args)"
    requirement: "O(1), inspect mock call history"
    structure: "mock.assert_called_once_with(...) or mock.call_count assertions"
    stdlib: "unittest.mock.MagicMock, pytest-mock"
    example: "verify a logger was called with the correct message"
  - signal: "Run the same test on multiple inputs (parametrize)"
    requirement: "O(n) where n is number of inputs, but DRY"
    structure: "@pytest.mark.parametrize with list of (input, expected) tuples"
    stdlib: "@pytest.mark.parametrize decorator"
    example: "test_json_parse with [('{\"a\":1}', {'a': 1}), ('bad', ValueError)]"

problems:
  - number: 1
    title: "Isolate a function from a database dependency"
    container: "function + mock database"
    pattern: "dependency injection (pass mock as parameter or fixture)"
    stdlib: "unittest.mock.MagicMock or pytest-mock"
    why: "A function that queries a database cannot run fast or repeatably. Mock the database to return test data."
  - number: 2
    title: "Test error handling without triggering real errors"
    container: "mock + exception"
    pattern: "mock.side_effect = ExceptionType() to trigger error paths"
    stdlib: "unittest.mock.MagicMock.side_effect"
    why: "Testing error paths without actually raising them lets tests run fast and verify both success and failure."
  - number: 3
    title: "Verify a function logs the correct message"
    container: "mock logger + capsys"
    pattern: "pass mock logger to function; assert mock.assert_called_with(...)"
    stdlib: "unittest.mock.patch, pytest-mock, capsys"
    why: "Capturing logging without side effects; verify the function called log with the right args."
  - number: 4
    title: "Test a class that depends on an external service"
    container: "class + mocked service"
    pattern: "constructor injection (pass mock in __init__); mock returns test data"
    stdlib: "unittest.mock.MagicMock, @pytest.fixture"
    why: "Classes that call external APIs must be testable without hitting the network; inject mocks."
  - number: 5
    title: "Run the same test on 10 different inputs"
    container: "parametrized test"
    pattern: "@pytest.mark.parametrize with list of (input, expected)"
    stdlib: "@pytest.mark.parametrize decorator"
    why: "Avoids copy-pasting the same test 10 times; DRY principle for test cases."

quiz:
  - question: "Why should unit tests avoid calling external services like databases or APIs?"
    choices:
      - "External services are always slower, so tests must be fast"
      - "Tests should be hermetic: deterministic, fast, and runnable in any order or location"
      - "External services are not available in the test environment"
      - "All of the above"
    answer: 1
    explanation: "Hermetic tests are isolated and reproducible. They run in milliseconds, in any order, and don't depend on network or service availability."
  - question: "Which pytest marker should a fast, isolated test declare?"
    choices:
      - "@pytest.mark.integration"
      - "@pytest.mark.unit"
      - "@pytest.mark.slow"
      - "@pytest.mark.skip"
    answer: 1
    explanation: "@pytest.mark.unit tags fast, isolated component tests. Markers allow running only unit tests before commit with `pytest -m unit`."
  - question: "What does unittest.mock.MagicMock.side_effect do?"
    choices:
      - "Records how many times the mock was called"
      - "Defines the return value of the mock"
      - "Raises an exception or returns a value when the mock is called"
      - "Prevents the mock from being called more than once"
    answer: 2
    explanation: "side_effect can be an exception (raises it) or a callable (calls it). This lets tests trigger error paths without raising real errors."
  - question: "In dependency injection, what is passed to the function being tested?"
    choices:
      - "The real external service"
      - "A mock object that simulates the service"
      - "A stub that returns a default value"
      - "Both mock and stub objects"
    answer: 1
    explanation: "Mocks replace real dependencies in tests, allowing control over inputs and verification of behavior without side effects."
  - question: "What does @pytest.mark.parametrize do?"
    choices:
      - "Skips a test until it passes"
      - "Runs a test multiple times with different inputs"
      - "Marks a test as slow or expensive"
      - "Enables parallel test execution"
    answer: 1
    explanation: "Parametrize runs the same test function with different arguments, specified as a list of tuples. This keeps tests DRY."

examples:
  - title: "fleet-base: test isolation via mock dependency"
    code: |
      """Test commit_message.attribution_lines without file I/O."""
      def test_co_authored_by_trailer_fails_in_any_case(tmp_path: Path) -> None:
          path = _message(tmp_path, "fix: x\n\nco-authored-by: Someone <a@b.invalid>\n")
          assert commit_message.attribution_lines(Path(path).read_text(encoding="utf-8")) == [
              "co-authored-by: Someone <a@b.invalid>"
          ]
      # The function is tested in isolation; mocking file I/O is avoided by passing text directly.
  - title: "fleet-base: hermetic test with monkeypatch"
    code: |
      """A settings factory that never reads the process environment."""
      @pytest.fixture
      def settings() -> Callable[..., FleetSettings]:
          def build(settings_class: type[FleetSettings] = FleetSettings, **overrides):
              return _without_process_env(settings_class)(**overrides)
          return build
      # The fixture isolates settings from the real environment; tests control all inputs.
  - title: "fleet-ops: test with mock return value"
    code: |
      """Test branch_from_result parsing."""
      def test_a_whitespace_only_result_names_no_branch() -> None:
          assert branch_from_result("   ") is None
      # No mocking needed; the function is pure. Input and output are tested directly.
  - title: "pytest: parametrized test for multiple inputs"
    code: |
      """Test a function on multiple inputs."""
      @pytest.mark.parametrize("input_val,expected", [
          ("  ", None),
          ('{"branch": "agent/x"}', "agent/x"),
      ])
      def test_branch_from_result(input_val: str, expected) -> None:
          assert branch_from_result(input_val) == expected
      # The same test runs twice with different inputs; the test code is not duplicated.
  - title: "pytest: capsys to verify output without side effects"
    code: |
      """Capture stdout/stderr to verify logging without side effects."""
      def test_co_authored_by_trailer_fails(tmp_path: Path, capsys: pytest.CaptureFixture[str]) -> None:
          path = _message(tmp_path, "feat: add thing\n\nCo-Authored-By: Claude <noreply@anthropic.com>\n")
          with pytest.raises(SystemExit) as exit_info:
              commit_message.main([path])
          assert exit_info.value.code == 1
          assert "Co-Authored-By: Claude <noreply@anthropic.com>" in capsys.readouterr().err
      # capsys captures output without mocking; the test verifies error messages were printed.
  - title: "pytest: fixture for object construction and teardown"
    code: |
      """Fixture that constructs and tears down an object."""
      @pytest.fixture
      def temp_repo(tmp_path: Path) -> Path:
          repo = tmp_path / "test_repo"
          repo.mkdir()
          (repo / ".git").mkdir()
          yield repo
          # Cleanup is automatic after the test.
      def test_repo_operations(temp_repo: Path) -> None:
          assert (temp_repo / ".git").exists()
      # The fixture handles setup and teardown; tests use clean state each run.
