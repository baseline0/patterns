title: 'Halfway Escape Optimization: A Quantum-Inspired Solution for General Optimization
  Problems'
authors: []
abstract: >-
  Introduces Halfway Escape Optimization, a quantum-inspired metaheuristic that models tunnelling and entanglement
  effects to move candidates between search regions. The paper evaluates it on fourteen thirty-dimensional benchmark
  functions against particle swarm, genetic, artificial fish swarm, grey wolf, and quantum-behaved particle swarm
  optimizers. It then tries two constrained engineering designs and a rice-classification task, reporting competitive
  optimizer performance and stronger accuracy on the classification example.
