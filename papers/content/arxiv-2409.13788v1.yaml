title: Quantum evolutionary algorithm for TSP combinatorial optimisation problem
authors: []
abstract: >-
  An experimental comparison of a quantum-inspired genetic algorithm with a classical genetic algorithm on standard
  TSPLIB tours. The study varies instance size and type, then compares solution quality, iteration count, runtime, and
  stability. Across most instances, especially larger ones, the classical algorithm found better tours sooner. The
  paper points to difficult quantum-gate parameter tuning and notes that no real quantum hardware was used, so the
  results describe a simulation rather than a hardware speedup.
