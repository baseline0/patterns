:root{color-scheme:light dark;--b:#8884;--bg:#8881;--hi:#3a7;--txt:inherit}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;line-height:1.45;color:var(--txt)}
header{padding:1rem 1.25rem;border-bottom:1px solid var(--b);position:sticky;top:0;background:Canvas;z-index:2}
h1{margin:0 0 .25rem;font-size:1.35rem}.meta{color:#888;font-size:.9rem}
.toolbar{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.75rem}
input,select,button{font:inherit;padding:.4rem .55rem;border:1px solid var(--b);border-radius:6px;background:Canvas;color:inherit}
input[type=search]{min-width:18rem;flex:1}
main{display:grid;grid-template-columns:minmax(18rem,28rem) 1fr;min-height:calc(100vh - 140px)}
#list{border-right:1px solid var(--b);overflow:auto;max-height:calc(100vh - 140px)}
#detail{overflow:auto;padding:1rem 1.25rem;max-height:calc(100vh - 140px)}
.group{border-top:1px solid var(--b)}.group>summary{cursor:pointer;padding:.55rem .75rem;font-weight:600;list-style:none;background:var(--bg)}
.group>summary::-webkit-details-marker{display:none}.count{color:#888;font-weight:400}
.item{display:block;width:100%;text-align:left;padding:.55rem .75rem;border:0;border-bottom:1px solid var(--b);background:none;cursor:pointer}
.item:hover,.item.active{background:color-mix(in srgb,var(--hi) 18%,transparent)}
.item .t{font-weight:600}.item .s{font-size:.85rem;color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;font-size:.75rem;padding:.1rem .4rem;border:1px solid var(--b);border-radius:999px;margin-right:.25rem;color:#888}
h2{margin-top:0}h3{margin:1.1rem 0 .35rem}pre{background:var(--bg);padding:.75rem;overflow:auto;border-radius:6px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--b);padding:.35rem .45rem;text-align:left;vertical-align:top}
a{color:inherit}ul.links{padding-left:1.2rem}.empty{padding:1rem;color:#888}
@media (max-width:900px){main{grid-template-columns:1fr}#list{max-height:40vh;border-right:0;border-bottom:1px solid var(--b)}#detail{max-height:none}}
</style>
</head>

      "id": "asynchronous-job-processing",
      "title": "Asynchronous Job Processing",
      "family": "pattern-catalogue",
      "kind": "delivery-and-reliability",
      "status": "implemented",
      "summary": "A synchronous request invokes work whose duration, failure rate, or throughput cannot safely be handled within the request-response path. Waiting for completion can exhaust client connections, exceed request timeouts, or",
      "decision": "Accept the request durably into a queue, return immediately to the client, and process it asynchronously through a worker pool. Expose work status, retry behavior, and failure handling explicitly. The queue acts as a durable buffer and allows workers to scale independently.",
      "use_when": [
        "Work duration is unpredictable or exceeds request timeouts",
        "Retries and durable audit trails matter for compliance or reliability",
        "You need to prioritize work, batch it, or distribute it across multiple workers",
        "Multiple workers may process the same type of work in parallel",
        "Decoupling producers from execution improves system resilience"
      ],
      "avoid_when": [
        "Immediate synchronous confirmation is non-negotiable (e.g., payment authorization, form validation)",
        "The operation is simple and always completes in milliseconds",
        "The operational complexity and cost of queue infrastructure is unjustifiable for the workload",
        "You have no mechanism to report completion status back to the client"

      "tradeoffs": [

          "benefit": "Decouples producers from workers; workers scale independently from request rate",
          "cost": "Operational complexity: queue, worker pool, monitoring, dead-letter handling, idempotency logic"
        },
        {
          "benefit": "Enables retries with backoff, durable record of work, and recovery from transient failures",
          "cost": "Eventual consistency; client cannot immediately verify success; must poll or use webhooks"
        },
        {
          "benefit": "Graceful degradation under load; queue absorbs spikes and workers process at their own pace",
          "cost": "Requires idempotency design and duplicate-detection policy to avoid executing the same work twice"
        },
        {
          "benefit": "Visibility into work status, failures, and processing time across the entire pipeline",
          "cost": "Requires comprehensive logging and monitoring; operational alerts are essential"
        }

      "id": "strangler-pattern",
      "title": "Strangler Fig: Incremental Legacy Modernization",
      "family": "pattern-catalogue",
      "kind": "migration",
      "status": "implemented",
      "summary": "A legacy system is mission-critical but increasingly costly to maintain, lacks desired features, or blocks adoption of new technologies. A complete rewrite is too risky and blocks business value. You need to modernize in",
      "decision": "Build a facade (strangler) that intercepts requests destined for the legacy system. Route specific feature requests to the new system, while others continue through to the legacy implementation. Over time, shift more traffic to the new system as capabilities are proven. The legacy system is gradually 'strangled' until it can be retired entirely.",
      "use_when": [
        "The legacy system is stable, mission-critical, and cannot be taken offline",
        "You can identify seams or boundaries—features or flows that can be migrated incrementally",
        "The new system can coexist with the legacy system for a transition period",
        "You have the organizational capacity to maintain two systems in parallel",
        "Risk reduction and business continuity are higher priorities than speed"
      ],
      "avoid_when": [
        "The entire system must be replaced simultaneously (regulatory deadline, hardware EOL)",
        "The legacy system has deeply entangled logic with no clear seams",
        "Operating two systems in parallel is infeasible (cost, complexity, skill constraints)",
        "The legacy system is already isolated and easy to replace in one go"
      ],
      "tradeoffs": [
        {
          "benefit": "Risk is spread across multiple deployments; each feature can be tested independently before full cutover",
          "cost": "Operational complexity increases: need to run, monitor, and debug two systems in parallel for months"
        },
        {
          "benefit": "Business value is delivered incrementally; users gain new capabilities while stability is maintained",
          "cost": "Seam identification takes careful analysis; poor boundaries create cross-system dependencies and make migration harder"
        },
        {
          "benefit": "Graceful fallback is possible; if the new system fails, traffic reverts to legacy without data loss",
          "cost": "Requires robust routing/facade logic and data synchronization between systems"
        },
        {
          "benefit": "Team can learn and iterate on new system design while legacy system handles baseline load",
          "cost": "Legacy system must remain operational; cannot be abandoned immediately even after new system goes live"
        }
      ],
      "concerns": [
        "reliability",
        "migration",
        "risk-reduction"
      ],

<script>
(() => {
  const data = JSON.parse(document.getElementById('catalog').textContent);
  const items = data.items || [];
  const list = document.getElementById('list');
  const detail = document.getElementById('detail');
  const q = document.getElementById('q');
  const fam = document.getElementById('family');
  const kind = document.getElementById('kind');
  const stats = document.getElementById('stats');
  const state = {selected: null};

  const uniq = (arr) => [...new Set(arr.filter(Boolean))].sort();
  uniq(items.map(i => i.family)).forEach(v => fam.add(new Option(v, v)));
  uniq(items.map(i => i.kind)).forEach(v => kind.add(new Option(v, v)));

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const href = (p) => p ? '../' + p.replace(/^\.\//,'') : '';

  function matches(item) {
    const needle = q.value.trim().toLowerCase();
    if (fam.value && item.family !== fam.value) return false;
    if (kind.value && item.kind !== kind.value) return false;
    if (!needle) return true;
    const hay = [item.id, item.title, item.summary, item.family, item.kind, ...(item.tags||[]), ...(item.related||[])].join(' ').toLower();
    return hay.includes(needle);
  }

  function renderList() {
    const filtered = items.filter(matches);
    stats.textContent = `${filtered.length} / ${items.length} items`;
    const groups = new Map();
    for (const item of filtered) {
      const k = item.family || 'other';
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(item);
    }
    list.innerHTML = '';
    if (!filtered.length) { list.innerHTML = '<p class="empty">No items match.</p>'; return; }
    for (const [name, group] of [...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0]))) {
      const det = document.createElement('details');
      det.className = 'group';
      det.open = groups.size <= 8 || group.some(i => i.uid === state.selected);
      const sum = document.createElement('summary');
      sum.innerHTML = `${esc(name)} <span class="count">(${group.length})</span>`;
      det.appendChild(sum);
      for (const item of group) {
        const btn = document.createElement('button');
        btn.className = 'item' + (item.uid === state.selected ? ' active' : '');
        btn.type = 'button';
        btn.innerHTML = `<div class="t">${esc(item.title || item.id)}</div><div class="s"><span class="pill">${esc(item.kind)}</span>${esc(item.summary || item.id || '')}</div>`;
        btn.addEventListener('click', () => select(item.uid));
        det.appendChild(btn);
      }
      list.appendChild(det);
    }
  }

  function kv(label, value) {
    if (value == null || value === '' || (Array.isArray(value) && !value.length)) return '';
    const render = (v) => Array.isArray(v) ? `<ul>${v.map(x => `<li>${typeof x === 'object' ? '<pre>'+esc(JSON.stringify(x,null,2))+'</pre>' : esc(x)}</li>`).join('')}</ul>` : `<p>${esc(v)}</p>`;
    return `<h3>${esc(label)}</h3>${render(value)}`;
  }

  function renderDetail(item) {
    if (!item) { detail.innerHTML = '<p class="empty">Select an item to inspect its content, links, and source.</p>'; return; }
    const links = (item.links || []).filter(l => l && l.path);
    const rel = (item.related || []).map(id => items.find(x => x.id === id || x.uid === id)).filter(Boolean);
    let out = `<h2>${esc(item.title || item.id)}</h2>`;
    out += `<p><span class="pill">${esc(item.family)}</span><span class="pill">${esc(item.kind)}</span>${(item.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</p>`;
    if (item.summary) out += `<p>${esc(item.summary)}</p>`;
    if (links.length) out += `<h3>Open</h3><ul class="links">${links.map(l => `<li><a href="${esc(href(l.path))}">${esc(l.label || l.path)}</a> <span class="meta">${esc(l.path)}</span></li>`).join('')}</ul>`;
    if (item.source) out += `<h3>Source</h3><p class="meta">${esc(item.source)}</p>`;
    out += kv('Intent', item.intent);
    out += kv('Problem / decision', item.problem || item.decision);
    out += kv('Use when', item.use_when);
    out += kv('Avoid when', item.avoid_when);
    out += kv('Trade-offs / consequences', item.tradeoffs || item.consequences);
    out += kv('Components / participants', item.components || item.participants);
    out += kv('Measure / mechanism', item.measure || item.mechanism);
    out += kv('Scenario artifacts', item.artifacts);
    out += kv('Providers', item.providers);
    if (rel.length) out += `<h3>Related in catalog</h3><ul class="links">${rel.map(r => `<li><a href="#" data-uid="${esc(r.uid)}">${esc(r.title || r.id)}</a> <span class="meta">${esc(r.kind)}</span></li>`).join('')}</ul>`;
    out += kv('Related ids', (item.related||[]).filter(id => !rel.find(r => r.id===id || r.uid===id)));
    detail.innerHTML = out;
    detail.querySelectorAll('a[data-uid]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); select(a.dataset.uid); }));
  }

  function select(uid) {
    state.selected = uid;
    const item = items.find(i => i.uid === uid);
    renderList();
    renderDetail(item);
    if (item) history.replaceState(null, '', '#'+encodeURIComponent(uid));
  }

  [q,fam,kind].forEach(el => el.addEventListener('input', renderList));
  document.getElementById('clear').addEventListener('click', () => { q.value=''; fam.value=''; kind.value=''; renderList(); });
  renderList();
  const hash = decodeURIComponent(location.hash.slice(1));
  if (hash && items.find(i => i.uid === hash)) select(hash);
})();
</script>
