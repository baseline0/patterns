server {
    listen 80;
    server_name _;

    # Cloud Patterns architecture catalogue
    # Serves static HTML/SVG with relative URLs
    location = /patterns {
        return 301 /patterns/;
    }

    location /patterns/ {
        alias /usr/share/nginx/html/patterns/;
        index index.html;
        # SPA-like: fall back to index.html for client-side routing
        try_files $uri $uri/ /patterns/index.html;
    }

    # Math Trace (future)
    # Uncomment when math-trace site is built
    # location /math-trace/ {
    #     alias /usr/share/nginx/html/math-trace/;
    #     index index.html;
    #     try_files $uri $uri/ /math-trace/index.html;
    # }

    # Equations History (future)
    # Uncomment when equations-history site is built
    # location /equations/ {
    #     alias /usr/share/nginx/html/equations/;
    #     index index.html;
    #     try_files $uri $uri/ /equations/index.html;
    # }

    # API service (uvicorn backend)
    # Proxy to http://api:8080 (Docker service name)
    # Trailing slash on proxy_pass deliberately strips /api/ prefix
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;

        # Preserve original request context for backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gateway health check endpoint
    # Used by docker compose healthcheck and monitoring
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Block accidental root-level or unlisted paths
    # Prevents directory listing and exposure of unexpected routes
    location / {
        return 404;
    }
}
