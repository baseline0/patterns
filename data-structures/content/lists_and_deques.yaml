problems:
  - number: 102
    title: "Binary Tree Level Order Traversal"
    container: "block list (deque)"
    pattern: "breadth-first search"
    stdlib: "collections.deque: append and popleft"
    why: "The frontier is a FIFO queue. list.pop(0) would shift the whole frontier on every step."
  - number: 739
    title: "Daily Temperatures"
    container: "contiguous array (list)"
    pattern: "monotonic stack"
    stdlib: "list: append and pop"
    why: "The stack is used only at one end, so a plain list costs O(1) per push and pop."
  - number: 11
    title: "Container With Most Water"
    container: "contiguous array (list)"
    pattern: "two pointers"
    stdlib: "list indexing"
    why: "Random access by position is O(1), which the two pointers rely on."

quiz:
  - question: "Why is list.pop(0) a poor choice for a BFS queue?"
    choices:
      - "It allocates a new list every time"
      - "It shifts every remaining pointer, so each pop costs O(n)"
      - "It is not allowed on lists"
      - "It is only slow for strings"
    answer: 1
    explanation: "A list is a contiguous array. Removing the first element moves each remaining pointer one slot left."
  - question: "Which structure is the right queue for BFS in Python?"
    choices:
      - "list with pop(0)"
      - "collections.deque with popleft"
      - "dict with the smallest key"
      - "set with pop()"
    answer: 1
    explanation: "deque.popleft is O(1), because it touches only the block at the front."
  - question: "Why are appends to a list amortized O(1)?"
    choices:
      - "Each append reserves exactly one slot"
      - "Capacity grows by a fraction each time it is exceeded, so copies are rare"
      - "Appends never copy"
      - "CPython stores lists as linked nodes"
    answer: 1
    explanation: "Spare capacity grows geometrically, so the cost of the occasional copy spreads across many appends."
  - question: "bisect.insort on a sorted list is O(log n) per insert. True or false?"
    choices:
      - "True: the binary search dominates"
      - "False: the search is O(log n) but the list shift makes insertion O(n)"
    answer: 1
    explanation: "Finding the position is logarithmic. Inserting the value shifts the elements after it."
  - question: "Why can a list not be a dict key?"
    choices:
      - "Lists are too large"
      - "Lists are not hashable: their contents can change, so their hash would change too"
      - "Dict keys must be strings"
      - "Lists are stored out of order"
    answer: 1
    explanation: "A key's hash must stay constant while it is in the table. A mutable list cannot guarantee that."
