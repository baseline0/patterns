# Source of truth for the strings topic. Generated outputs are built from this file by tools/build.py.
# Each claim id needs a check in tests/unit/test_data_structures.py.

id: strings
title: "Strings: pattern matching, substring search, and palindromes"
summary: >
  Strings are sequences of characters. Finding patterns in strings uses two pointers to check palindromes
  and reverse sequences without allocating new strings. Hashing character positions or frequencies enables
  substring search and anagram detection in linear time without nested loops.

mechanics:
  - heading: "two pointers for symmetry checks"
    body: >
      Two pointers starting from opposite ends move inward simultaneously. This checks palindromes and
      validates symmetric properties without reversing the string. The only extra space is the pointers.
  - heading: "character frequency hashing"
    body: >
      A dict or Counter maps characters to their counts or positions. Anagrams share the same character counts,
      and comparing counts is O(1) per character instead of O(n log n) if the strings were sorted.
  - heading: "sliding window for unique-character substrings"
    body: >
      One pointer extends a window to add characters; the other retracts when a condition is violated (repetition,
      invalid character). Each character is added and removed once, keeping work linear.
  - heading: "pattern searching and string reversal"
    body: >
      Reversing words or characters in place uses index swapping. Finding a substring uses either naive
      position-by-position comparison or a rolling hash to detect the pattern in O(n).

claims:
  - id: two-pointers-check-palindrome
    text: "Two pointers from opposite ends can check a palindrome in O(n) time and O(1) space without reversing."
  - id: anagram-count-vs-sort
    text: "Anagrams have identical character counts. Comparing counts is O(n); sorting both strings is O(n log n)."
  - id: sliding-window-is-linear
    text: "A sliding window processes each character at most twice, keeping substring search O(n) instead of O(n^2)."
  - id: in-place-reversal-no-allocation
    text: "Reversing a string in place by swapping characters uses O(1) space; building a reversed copy uses O(n)."

complexity:
  - operation: "palindrome check (two pointers)"
    time: "O(n) time, O(1) space"
    note: "move from ends inward; no allocation"
  - operation: "reverse string in place (swap)"
    time: "O(n) time, O(1) space"
    note: "swap characters with two pointers"
  - operation: "anagram check (character count)"
    time: "O(n)"
    note: "dict lookups are O(1); faster than sorting"
  - operation: "anagram check (sort both)"
    time: "O(n log n)"
    note: "for comparison; sorting is more overhead than needed"
  - operation: "substring search (naive)"
    time: "O(n*m)"
    note: "nested loop: for each position, match up to m chars"
  - operation: "longest substring without repeats"
    time: "O(n)"
    note: "sliding window; each char seen at most twice"

