  - number: 151
    title: "Reverse Words in a String"
    container: "string"
    pattern: "word-by-word reversal with space handling"
    stdlib: "str.split and reverse and join, or two-pointer character swap"
    why: "Using split().reverse().join() is Pythonic and concise. Manual reversal in place avoids intermediate allocations."
  - number: 680
    title: "Valid Palindrome II"
    container: "string"
    pattern: "two pointers with one skip allowed"
    stdlib: "two-pointer recursion or backtracking to check both skip cases"
    why: "When a mismatch is found, we must try skipping the left or right character. Backtracking checks both without full string duplication."

quiz:
  - question: "When two pointers check a palindrome from the ends inward, what triggers a failed check?"
    choices:
      - "The left pointer reaches the right pointer"
      - "Characters at the current positions do not match"
      - "The string has an odd length"
      - "The string contains a space"
    answer: 1
    explanation: "Palindromes have matching characters at symmetric positions. Any mismatch means the string is not a palindrome."
  - question: "Why is checking if two strings are anagrams using Counter faster than sorting both?"
    choices:
      - "Counter is implemented in C and always faster"
      - "Counter is O(n); sorting both is O(n log n)"
      - "Counter eliminates duplicate characters"
      - "Sorting cannot compare frequencies"
    answer: 1
    explanation: "Counting characters is linear. Sorting is O(n log n), so dict lookup is more efficient for anagram detection."
  - question: "In the sliding-window approach to 'longest substring without repetition,' what does the left pointer do?"
    choices:
      - "Tracks the start of the current valid substring"
      - "Points to the rightmost character"
      - "Remains at the first character"
      - "Skips whitespace"
    answer: 0
    explanation: "The right pointer expands the window; the left retracts when a repeat is found. The distance between them is the substring length."
  - question: "Why does reversing a string with two pointers and swapping use O(1) space while str[::-1] uses O(n)?"
    choices:
      - "Swapping modifies the original; slicing allocates a new string"
      - "Two pointers are inherently more efficient"
      - "Slicing only works on immutable strings"
      - "Swapping runs in the CPU cache"
    answer: 0
    explanation: "Strings in Python are immutable, so str[::-1] allocates a new string. In-place swaps work on lists or character arrays."
  - question: "When comparing anagrams, why must we count all characters instead of just checking for duplicates?"
    choices:
      - "Duplicates are not relevant to anagrams"
      - "We need to verify the same multiset of characters appears in both strings"
      - "Counting is always faster than checking"
      - "Anagrams only have unique characters"
    answer: 1
    explanation: "Anagrams have the same characters with the same frequencies. Checking duplicates alone misses frequency differences."
