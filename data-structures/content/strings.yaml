    title: "Implement strStr"
    container: "string"
    pattern: "substring search at each position"
    stdlib: "str.find or manual char-by-char comparison"
    why: "Comparing characters position by position finds the first match in O(n*m). Rolling hash improves to O(n) but naive is sufficient for moderate lengths."
  - number: 125
    title: "Valid Palindrome"
    container: "string"
    pattern: "two pointers ignoring non-alphanumeric"
    stdlib: "str.isalnum and lower for filtering; two pointers"
    why: "Two pointers from the ends check symmetry in O(n) without allocating a reversed or cleaned string."
  - number: 242
    title: "Valid Anagram"
    container: "character frequency dict"
    pattern: "count and compare"
    stdlib: "collections.Counter"
    why: "Counting character frequencies is O(n). Sorting both strings is O(n log n). Counter is optimal for this check."
  - number: 58
    title: "Length of Last Word"
    container: "string"
    pattern: "reverse scan to skip trailing spaces"
    stdlib: "str.split or manual indexing from the end"
