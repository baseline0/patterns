quiz:
  - question: "Why is reversal a natural fit for linked lists?"
    choices:
      - "Linked lists are smaller than arrays"
      - "Pointers can be redirected in-place without allocating new nodes, using O(1) extra space"
      - "Reversing arrays requires copying the entire array"
      - "Linked lists are always bidirectional"
    answer: 1
    explanation: "Reversing a linked list changes the direction of pointers, not the nodes themselves. This in-place redirection uses constant extra space."
  - question: "How does the two-pointer cycle detection algorithm work?"
    choices:
      - "Mark visited nodes with a flag"
      - "Use a set to track seen nodes"
      - "Advance two pointers at different speeds; they meet if a cycle exists"
      - "Count nodes and check if the count exceeds the list length"
    answer: 2
    explanation: "A fast pointer (2 steps per iteration) and a slow pointer (1 step) eventually meet if a cycle exists. If the fast pointer reaches null, there is no cycle."
  - question: "Why is a dummy node useful when merging linked lists?"
    choices:
      - "It makes the list shorter"
      - "It holds the smaller of the two heads"
      - "It eliminates special cases at the head by providing a node to attach to initially"
      - "It is required by the algorithm"
    answer: 2
    explanation: "A dummy node lets the merge code treat the head uniformly. Instead of checking 'is this the first node?', the code always attaches to the previous node."
  - question: "In the 'Merge K Sorted Lists' problem, why is a heap faster than pairwise merging?"
    choices:
      - "Heaps use less memory"
      - "Heaps sort the lists automatically"
      - "Finding the next smallest among k lists is O(log k) with a heap instead of O(k) with linear search"
      - "Heaps eliminate the need for pointers"
    answer: 2
    explanation: "A heap tracks the smallest head across k lists. Inserting and extracting takes O(log k) per step, making the total time O(n log k) instead of O(n * k)."
  - question: "What is the time complexity of traversing a linked list to find a specific node?"
    choices:
      - "O(1)"
      - "O(log n)"
      - "O(n)"
      - "O(n log n)"
    answer: 2
    explanation: "A linked list has no random access. Reaching a node requires following pointers from the head, which takes O(n) in the worst case."
