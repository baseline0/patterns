    text: "A linked list requires O(n) steps to reach a position, so binary search is impossible without modifying the structure."
  - id: linked-list-insert-delete-constant
    text: "Insertion and deletion at a known node (with a pointer to it) cost O(1), because no shifting is required."
  - id: reversal-redirects-pointers-inplace
    text: "Reversing a linked list in-place by redirecting pointers uses O(1) extra space and O(n) time."
  - id: cycle-detection-two-pointers
    text: "A cycle in a linked list can be detected by advancing two pointers at different speeds; if they meet, a cycle exists."
  - id: dummy-node-simplifies-head-cases
    text: "A dummy node pointing to the head eliminates special cases when modifying the head node."

