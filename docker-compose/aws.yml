version: '3.8'

services:
  # Floci: AWS emulator
  # Includes: S3, Lambda, DynamoDB, SQS, SNS, API Gateway, IAM, CloudWatch
  # Endpoint: http://localhost:4566
  aws:
    image: floci/floci:latest
    container_name: patterns-aws
    ports:
      - "4566:4566"  # Main API endpoint
    environment:
      # Emulator configuration
      SERVICES: s3,lambda,dynamodb,sqs,sns,apigateway,iam,cloudwatch
      DEBUG: 0
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - patterns

networks:
  patterns:
    driver: bridge
