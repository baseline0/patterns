version: '3.8'

services:
  # Floci: Azure emulator
  # Includes: Blob Storage, Queue Storage, Table Storage, Azure Functions, Service Bus
  # Endpoint: http://localhost:4577
  azure:
    image: floci/floci-az:latest
    container_name: patterns-azure
    ports:
      - "4577:4577"  # Main API endpoint
    environment:
      # Emulator configuration
      DEBUG: 0
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - patterns

networks:
  patterns:
    driver: bridge
